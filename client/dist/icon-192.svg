<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0e0030"/>
      <stop offset="100%" stop-color="#03000d"/>
    </radialGradient>
    <radialGradient id="crownFill" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="60%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6000"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle vignette border -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#1a0045" stroke-width="40"/>

  <!-- Outer glow ring -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.25" filter="url(#softglow)"/>

  <!-- Crown body -->
  <!-- Base band -->
  <rect x="104" y="316" width="304" height="72" rx="10" fill="url(#crownFill)"/>

  <!-- Crown peaks: left low, center high, right low -->
  <!-- Left peak -->
  <polygon points="104,316 148,220 192,316" fill="url(#crownFill)"/>
  <!-- Left-center valley fill -->
  <rect x="148" y="280" width="68" height="36" fill="url(#crownFill)"/>
  <!-- Center peak -->
  <polygon points="190,316 256,148 322,316" fill="url(#crownFill)"/>
  <!-- Right-center valley fill -->
  <rect x="296" y="280" width="68" height="36" fill="url(#crownFill)"/>
  <!-- Right peak -->
  <polygon points="320,316 364,220 408,316" fill="url(#crownFill)"/>

  <!-- Crown highlight line on base top -->
  <rect x="104" y="316" width="304" height="6" rx="3" fill="#ffe566" opacity="0.6"/>

  <!-- Gem dots on peak tips -->
  <circle cx="256" cy="148" r="14" fill="#ff0040" opacity="0.95" filter="url(#softglow)"/>
  <circle cx="148" cy="220" r="10" fill="#00f5ff" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="364" cy="220" r="10" fill="#00f5ff" opacity="0.9" filter="url(#softglow)"/>

  <!-- Crown mid-band decoration -->
  <circle cx="256" cy="352" r="18" fill="#03000d" opacity="0.5"/>
  <circle cx="256" cy="352" r="10" fill="#ff0040" opacity="0.8"/>
  <circle cx="180" cy="352" r="8" fill="#03000d" opacity="0.4"/>
  <circle cx="332" cy="352" r="8" fill="#03000d" opacity="0.4"/>

  <!-- VOID MAFIA text -->
  <text x="256" y="452" font-family="monospace,Courier New,serif" font-weight="bold" font-size="46" text-anchor="middle" fill="#00f5ff" opacity="0.85" letter-spacing="3" filter="url(#softglow)">VOID MAFIA</text>

  <!-- Bottom glow line -->
  <line x1="90" y1="462" x2="422" y2="462" stroke="#00f5ff" stroke-width="1" opacity="0.2"/>
</svg>
