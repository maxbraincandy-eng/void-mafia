<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="bgmaniac" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9b00ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020b14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cgmaniac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b00ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9b00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdmaniac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b00ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6600cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9b00ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="gbmaniac" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="gsmaniac" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="400" height="560" fill="#020b14"/>
  <rect width="400" height="560" fill="url(#bgmaniac)"/>

  <!-- grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="110" x2="400" y2="110" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="310" x2="400" y2="310" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="410" x2="400" y2="410" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="460" x2="400" y2="460" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="50" y1="0" x2="50" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="560" stroke="#9b00ff" stroke-opacity="0.045" stroke-width="1"/>

  <!-- circuit nodes -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="#9b00ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="300" y1="80" x2="70" y2="480" stroke="#9b00ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="70" y1="480" x2="330" y2="480" stroke="#9b00ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="330" y1="480" x2="100" y2="80" stroke="#9b00ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="100" cy="80" r="3" fill="#9b00ff" opacity="0.35"/>
  <circle cx="100" cy="80" r="7" fill="#9b00ff" opacity="0.08"/>
  <circle cx="300" cy="80" r="3" fill="#9b00ff" opacity="0.35"/>
  <circle cx="300" cy="80" r="7" fill="#9b00ff" opacity="0.08"/>
  <circle cx="70" cy="480" r="3" fill="#9b00ff" opacity="0.35"/>
  <circle cx="70" cy="480" r="7" fill="#9b00ff" opacity="0.08"/>
  <circle cx="330" cy="480" r="3" fill="#9b00ff" opacity="0.35"/>
  <circle cx="330" cy="480" r="7" fill="#9b00ff" opacity="0.08"/>

  <!-- outer border glow -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="#9b00ff" stroke-width="4" stroke-opacity="0.1" filter="url(#gbmaniac)"/>
  <!-- border -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="url(#bdmaniac)" stroke-width="1.5"/>

  <!-- corner brackets -->
  <path d="M22 22 L22 52 M22 22 L52 22" stroke="#9b00ff" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 22 L378 52 M378 22 L348 22" stroke="#9b00ff" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M22 538 L22 508 M22 538 L52 538" stroke="#9b00ff" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 538 L378 508 M378 538 L348 538" stroke="#9b00ff" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- central glow -->
  <ellipse cx="200" cy="250" rx="110" ry="110" fill="url(#cgmaniac)" filter="url(#gbmaniac)" opacity="0.6"/>

  <!-- symbol glow layer -->
  <text x="200" y="272" text-anchor="middle" dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="120"
    fill="#9b00ff" opacity="0.18" filter="url(#gbmaniac)">∞</text>

  <!-- symbol soft blur -->
  <text x="200" y="272" text-anchor="middle" dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="116"
    fill="#9b00ff" opacity="0.35" filter="url(#gsmaniac)">∞</text>

  <!-- symbol crisp -->
  <text x="200" y="272" text-anchor="middle" dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="112"
    fill="#9b00ff" opacity="1">∞</text>

  <!-- divider -->
  <line x1="55" y1="388" x2="345" y2="388" stroke="#9b00ff" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="85" y1="392" x2="315" y2="392" stroke="#9b00ff" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- role name -->
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#9b00ff" opacity="0.95" filter="url(#gsmaniac)">MANIAC</text>
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#9b00ff" opacity="1">MANIAC</text>

  <!-- pip dots -->
  <circle cx="172" cy="468" r="2.5" fill="#9b00ff" opacity="0.45"/>
  <circle cx="200" cy="468" r="2.5" fill="#9b00ff" opacity="0.45"/>
  <circle cx="228" cy="468" r="2.5" fill="#9b00ff" opacity="0.45"/>

  <!-- bottom label -->
  <text x="200" y="520" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="9"
    letter-spacing="5" fill="#9b00ff" opacity="0.28">VOID MAFIA</text>
</svg>