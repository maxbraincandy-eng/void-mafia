<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="bgvampire" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020b14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cgvampire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdvampire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8a0018" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="gbvampire" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="gsvampire" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="400" height="560" fill="#020b14"/>
  <rect width="400" height="560" fill="url(#bgvampire)"/>

  <!-- grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="110" x2="400" y2="110" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="310" x2="400" y2="310" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="410" x2="400" y2="410" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="460" x2="400" y2="460" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="50" y1="0" x2="50" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="560" stroke="#ff2d55" stroke-opacity="0.045" stroke-width="1"/>

  <!-- circuit nodes -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="#ff2d55" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="300" y1="80" x2="70" y2="480" stroke="#ff2d55" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="70" y1="480" x2="330" y2="480" stroke="#ff2d55" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="330" y1="480" x2="100" y2="80" stroke="#ff2d55" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="100" cy="80" r="3" fill="#ff2d55" opacity="0.35"/>
  <circle cx="100" cy="80" r="7" fill="#ff2d55" opacity="0.08"/>
  <circle cx="300" cy="80" r="3" fill="#ff2d55" opacity="0.35"/>
  <circle cx="300" cy="80" r="7" fill="#ff2d55" opacity="0.08"/>
  <circle cx="70" cy="480" r="3" fill="#ff2d55" opacity="0.35"/>
  <circle cx="70" cy="480" r="7" fill="#ff2d55" opacity="0.08"/>
  <circle cx="330" cy="480" r="3" fill="#ff2d55" opacity="0.35"/>
  <circle cx="330" cy="480" r="7" fill="#ff2d55" opacity="0.08"/>

  <!-- outer border glow -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="#ff2d55" stroke-width="4" stroke-opacity="0.1" filter="url(#gbvampire)"/>
  <!-- border -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="url(#bdvampire)" stroke-width="1.5"/>

  <!-- corner brackets -->
  <path d="M22 22 L22 52 M22 22 L52 22" stroke="#ff2d55" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 22 L378 52 M378 22 L348 22" stroke="#ff2d55" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M22 538 L22 508 M22 538 L52 538" stroke="#ff2d55" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 538 L378 508 M378 538 L348 538" stroke="#ff2d55" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- central glow -->
  <ellipse cx="200" cy="250" rx="110" ry="110" fill="url(#cgvampire)" filter="url(#gbvampire)" opacity="0.6"/>

  <!-- symbol: a bat over a pair of fangs, drawn rather than typed so it renders the same everywhere -->
  <g transform="translate(200 250)">
    <g opacity="0.25" filter="url(#gbvampire)">
      <path d="M0 -62 C-14 -88 -46 -96 -96 -80 C-74 -70 -66 -54 -70 -38 C-54 -48 -36 -46 -24 -36 C-18 -48 -8 -54 0 -54 C8 -54 18 -48 24 -36 C36 -46 54 -48 70 -38 C66 -54 74 -70 96 -80 C46 -96 14 -88 0 -62 Z" fill="#ff2d55"/>
    </g>
    <path d="M0 -62 C-14 -88 -46 -96 -96 -80 C-74 -70 -66 -54 -70 -38 C-54 -48 -36 -46 -24 -36 C-18 -48 -8 -54 0 -54 C8 -54 18 -48 24 -36 C36 -46 54 -48 70 -38 C66 -54 74 -70 96 -80 C46 -96 14 -88 0 -62 Z" fill="#ff2d55" opacity="0.9"/>
    <path d="M-9 -62 L-6 -74 L-2 -60 Z M2 -60 L6 -74 L9 -62 Z" fill="#ff2d55" opacity="0.9"/>
    <!-- lip and fangs -->
    <path d="M-78 10 Q0 52 78 10" fill="none" stroke="#ff2d55" stroke-width="5" stroke-linecap="round" filter="url(#gsvampire)" opacity="0.6"/>
    <path d="M-78 10 Q0 52 78 10" fill="none" stroke="#ff2d55" stroke-width="4" stroke-linecap="round"/>
    <path d="M-40 26 L-30 72 L-20 31 Z" fill="#f4f0ff"/>
    <path d="M20 31 L30 72 L40 26 Z" fill="#f4f0ff"/>
    <!-- a drop of blood -->
    <path d="M30 80 C26 88 24 92 24 96 A6 6 0 0 0 36 96 C36 92 34 88 30 80 Z" fill="#ff2d55"/>
  </g>

  <!-- divider -->
  <line x1="55" y1="388" x2="345" y2="388" stroke="#ff2d55" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="85" y1="392" x2="315" y2="392" stroke="#ff2d55" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- role name -->
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#ff2d55" opacity="0.95" filter="url(#gsvampire)">VAMPIRE</text>
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#ff2d55" opacity="1">VAMPIRE</text>

  <!-- pip dots -->
  <circle cx="172" cy="468" r="2.5" fill="#ff2d55" opacity="0.45"/>
  <circle cx="200" cy="468" r="2.5" fill="#ff2d55" opacity="0.45"/>
  <circle cx="228" cy="468" r="2.5" fill="#ff2d55" opacity="0.45"/>

  <!-- bottom label -->
  <text x="200" y="520" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="9"
    letter-spacing="5" fill="#ff2d55" opacity="0.28">VOID MAFIA</text>
</svg>