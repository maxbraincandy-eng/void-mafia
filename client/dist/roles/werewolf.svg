<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <radialGradient id="bgwerewolf" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020b14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cgwerewolf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdwerewolf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7a4a12" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="gbwerewolf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="gswerewolf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="400" height="560" fill="#020b14"/>
  <rect width="400" height="560" fill="url(#bgwerewolf)"/>

  <!-- grid -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="110" x2="400" y2="110" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="310" x2="400" y2="310" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="410" x2="400" y2="410" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="0" y1="460" x2="400" y2="460" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="50" y1="0" x2="50" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="250" y1="0" x2="250" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="560" stroke="#ffb347" stroke-opacity="0.045" stroke-width="1"/>

  <!-- circuit nodes -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="#ffb347" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="300" y1="80" x2="70" y2="480" stroke="#ffb347" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="70" y1="480" x2="330" y2="480" stroke="#ffb347" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="330" y1="480" x2="100" y2="80" stroke="#ffb347" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="100" cy="80" r="3" fill="#ffb347" opacity="0.35"/>
  <circle cx="100" cy="80" r="7" fill="#ffb347" opacity="0.08"/>
  <circle cx="300" cy="80" r="3" fill="#ffb347" opacity="0.35"/>
  <circle cx="300" cy="80" r="7" fill="#ffb347" opacity="0.08"/>
  <circle cx="70" cy="480" r="3" fill="#ffb347" opacity="0.35"/>
  <circle cx="70" cy="480" r="7" fill="#ffb347" opacity="0.08"/>
  <circle cx="330" cy="480" r="3" fill="#ffb347" opacity="0.35"/>
  <circle cx="330" cy="480" r="7" fill="#ffb347" opacity="0.08"/>

  <!-- outer border glow -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="#ffb347" stroke-width="4" stroke-opacity="0.1" filter="url(#gbwerewolf)"/>
  <!-- border -->
  <rect x="3" y="3" width="394" height="554" rx="16" fill="none" stroke="url(#bdwerewolf)" stroke-width="1.5"/>

  <!-- corner brackets -->
  <path d="M22 22 L22 52 M22 22 L52 22" stroke="#ffb347" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 22 L378 52 M378 22 L348 22" stroke="#ffb347" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M22 538 L22 508 M22 538 L52 538" stroke="#ffb347" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M378 538 L378 508 M378 538 L348 538" stroke="#ffb347" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- central glow -->
  <ellipse cx="200" cy="250" rx="110" ry="110" fill="url(#cgwerewolf)" filter="url(#gbwerewolf)" opacity="0.6"/>

  <!-- symbol: a wolf's head against the full moon -->
  <g transform="translate(200 250)">
    <defs>
      <radialGradient id="moonww" cx="42%" cy="38%" r="70%">
        <stop offset="0%" stop-color="#fff3d6"/>
        <stop offset="70%" stop-color="#ffc46b"/>
        <stop offset="100%" stop-color="#e08a1e"/>
      </radialGradient>
      <clipPath id="discww"><circle r="84"/><rect x="-120" y="-120" width="240" height="96"/></clipPath>
    </defs>
    <circle r="96" fill="#ffb347" opacity="0.18" filter="url(#gbwerewolf)"/>
    <circle r="84" fill="url(#moonww)" opacity="0.92"/>
    <!-- head, facing left, muzzle raised; the neck stops at the moon's edge -->
    <path clip-path="url(#discww)" d="M70 120 L40 18 L52 -40 L34 -66 L26 -36 L6 -44 L-4 -78 L-18 -40 L-48 -28 L-84 -34 L-70 -16 L-90 -6 L-60 6 L-36 10 L-24 26 L-8 30 L0 120 Z"
      fill="#140b03"/>
    <!-- eye -->
    <path d="M-6 -22 L8 -26 L2 -16 Z" fill="#ffb347"/>
    <circle cx="2" cy="-22" r="2.2" fill="#fff6e0"/>
    <!-- fang -->
    <path d="M-64 2 L-58 16 L-52 4 Z" fill="#fff6e0"/>
  </g>

  <!-- divider -->
  <line x1="55" y1="388" x2="345" y2="388" stroke="#ffb347" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="85" y1="392" x2="315" y2="392" stroke="#ffb347" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- role name -->
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#ffb347" opacity="0.95" filter="url(#gswerewolf)">WEREWOLF</text>
  <text x="200" y="438" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold"
    letter-spacing="7" fill="#ffb347" opacity="1">WEREWOLF</text>

  <!-- pip dots -->
  <circle cx="172" cy="468" r="2.5" fill="#ffb347" opacity="0.45"/>
  <circle cx="200" cy="468" r="2.5" fill="#ffb347" opacity="0.45"/>
  <circle cx="228" cy="468" r="2.5" fill="#ffb347" opacity="0.45"/>

  <!-- bottom label -->
  <text x="200" y="520" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace" font-size="9"
    letter-spacing="5" fill="#ffb347" opacity="0.28">VOID MAFIA</text>
</svg>