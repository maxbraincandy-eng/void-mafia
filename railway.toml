[build]
buildCommand = "echo 'using pre-built dist'"

# No watch patterns, on purpose.
#
# Railway skips a build when a push touches none of a service's watch paths
# (`no changes detected in watch paths, build will skip`) and keeps the old
# container running. This file used to declare `watchPatterns = ["**"]` to
# rule that out. On 2026-10-01 Railway's builder v3 started answering "no
# changes" for this service on every upload — three times in a row, with
# server/dist really changed — while the client service, whose railway.toml
# declares no patterns at all, kept deploying. With no patterns there is
# nothing to skip on: every upload builds. The dashboard's Watch Paths field
# for the server service must stay empty for the same reason.

[deploy]
startCommand = "NODE_ENV=production node server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
