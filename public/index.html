<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>VOID MAFIA v14 Compact</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07020f">
<style>
:root{--bg:#07020f;--card:rgba(12,7,29,.88);--cyan:#00f5ff;--pink:#ff00e6;--red:#ff3c4f;--green:#2dff93;--muted:#b7a5c9;--line:rgba(0,245,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(255,0,230,.25),transparent 30%),radial-gradient(circle at 90% 5%,rgba(0,245,255,.16),transparent 30%),linear-gradient(to bottom,transparent 50%,rgba(255,0,255,.045) 50%),linear-gradient(to right,transparent 50%,rgba(0,255,255,.045) 50%),#07020f;background-size:auto,auto,42px 42px,42px 42px;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{border:1px solid var(--line);background:rgba(255,255,255,.07);color:white;border-radius:16px;padding:12px 14px;font-weight:900}input,select{width:100%;background:#05040b;color:white;border:1px solid rgba(255,0,230,.55);border-radius:16px;padding:13px 14px;outline:none}.primary{background:linear-gradient(135deg,var(--pink),var(--cyan));color:#07020f;border:0}.hidden{display:none!important}.screen{min-height:100vh;padding:16px}.glass{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 0 34px rgba(255,0,230,.18);backdrop-filter:blur(14px)}.brand{padding:9px;text-align:center;font-weight:900;color:#8df5ff;background:linear-gradient(90deg,rgba(255,0,230,.25),rgba(0,245,255,.23));text-shadow:0 0 12px var(--cyan);border-bottom:1px solid rgba(255,0,230,.35)}
.auth{display:grid;place-items:center}.card{width:min(94vw,560px);padding:20px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.tabs button.active{background:rgba(0,245,255,.18);color:var(--cyan)}.form{display:grid;gap:10px}.topbar,.gamebar{position:sticky;top:0;z-index:50;margin:-16px -16px 14px;padding:12px;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,0,230,.4)}h1,h2,h3{color:var(--cyan);margin:.35em 0}p,span{color:var(--muted)}.round{width:54px;height:54px;border-radius:18px;padding:0}.main{padding-bottom:86px}.page{display:none}.page.active{display:block}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-top:1px solid rgba(255,0,230,.4);z-index:70}.nav button{border:0;background:transparent;color:var(--muted);font-size:12px}.nav button.active{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid{display:grid;gap:12px}.room,.clan,.player,.msg,.event{padding:14px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid rgba(0,245,255,.22)}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--cyan);font-size:12px}.live{color:var(--green);border-color:var(--green)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lobby{display:grid;gap:12px}.player{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--cyan));color:#05030b;font-size:26px;box-shadow:0 0 18px rgba(0,245,255,.25)}.player .meta{flex:1}.player.speaking{border-color:var(--green);box-shadow:0 0 22px rgba(45,255,147,.35);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.01)}}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.role-grid label{display:grid;gap:5px;background:rgba(255,255,255,.045);border-radius:14px;padding:10px}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{position:relative;aspect-ratio:4/3;background:#000;border:2px solid rgba(255,0,230,.75);border-radius:24px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.tile .avatar{position:absolute;inset:0;width:100%;height:100%;border-radius:0}.seat{position:absolute;right:8px;top:8px;background:var(--pink);border-radius:999px;padding:4px 8px}.tile-name{position:absolute;left:0;right:0;bottom:0;padding:24px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-weight:800}.panel{position:fixed;left:10px;right:10px;bottom:10px;z-index:100;max-height:68vh;display:flex;flex-direction:column;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(0,245,255,.25)}.scroll{overflow:auto;padding:12px;display:grid;gap:8px}.send{display:grid;grid-template-columns:1fr 58px;gap:8px;padding:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:150;display:grid;place-items:center;padding:16px}.modal-card{width:min(95vw,720px);max-height:88vh;overflow:auto;padding:20px}.toastbox{position:fixed;left:14px;right:14px;bottom:90px;z-index:300;display:grid;gap:8px}.toast{padding:12px;text-align:center;border-radius:16px;background:rgba(0,0,0,.92);border:1px solid var(--cyan)}@media(min-width:900px){.video-grid{grid-template-columns:repeat(3,1fr)}.panel{left:auto;top:90px;bottom:16px;width:400px}.role-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="brand">powered by <b>ბატონი მაქსი.</b> · VOID MAFIA v14 Compact</div>
<div id="toast" class="toastbox"></div>

<section id="auth" class="screen auth">
  <div class="card glass">
    <h1>VOID MAFIA</h1>
    <p>სუფთა compact build: MongoDB, clans, lobby WebRTC, chat, roles.</p>
    <div class="tabs">
      <button id="tabGuest" class="active">Guest</button>
      <button id="tabLogin">Login</button>
      <button id="tabRegister">Register</button>
    </div>
    <div id="guestForm" class="form">
      <input id="guestNick" placeholder="ნიკნეიმი">
      <input id="guestAvatar" placeholder="ავატარი მაგ: ◆ / 🕶" value="◆">
      <button id="guestBtn" class="primary">შესვლა</button>
    </div>
    <div id="loginForm" class="form hidden">
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button id="loginBtn" class="primary">Login</button>
    </div>
    <div id="regForm" class="form hidden">
      <input id="regUser" placeholder="Username">
      <input id="regNick" placeholder="ნიკნეიმი">
      <input id="regEmail" type="email" placeholder="Email">
      <input id="regPass" type="password" placeholder="Password">
      <button id="regBtn" class="primary">Register</button>
    </div>
  </div>
</section>

<section id="app" class="screen hidden">
  <header class="topbar"><button id="menuBtn" class="round">☰</button><div><h2 id="title">მაგიდები</h2><span id="userLine"></span></div><button id="refreshBtn" class="round">↻</button></header>
  <main class="main">
    <section id="pageRooms" class="page active">
      <article class="glass card">
        <h3>ახალი მაგიდა</h3>
        <input id="roomName" placeholder="მაგიდის სახელი" value="VOID TABLE">
        <div class="two"><input id="maxPlayers" type="number" value="10" min="4" max="16"><button id="createRoom" class="primary">შექმნა</button></div>
        <details><summary>როლები და დროები</summary><div id="createRoles" class="role-grid"></div></details>
      </article>
      <h3>ლაივ მაგიდები</h3><div id="rooms" class="grid"></div>
    </section>
    <section id="pageClans" class="page">
      <article class="glass card"><h3>კლანი</h3><input id="clanName" placeholder="კლანის სახელი"><button id="createClan" class="primary">კლანის შექმნა</button></article>
      <div id="clans" class="grid"></div>
    </section>
    <section id="pageStats" class="page"><h3>Leaderboard</h3><div id="leaderboard" class="grid"></div></section>
    <section id="pageProfile" class="page">
      <article class="glass card"><h3>პროფილი</h3><p id="profileText"></p><input id="profileNick" placeholder="ნიკნეიმი"><input id="profileAvatar" placeholder="ავატარი"><button id="saveProfile" class="primary">შენახვა</button></article>
    </section>
  </main>
  <nav class="nav"><button data-page="Rooms" class="active">მაგიდები</button><button data-page="Clans">კლანები</button><button data-page="Stats">რეიტინგი</button><button data-page="Profile">პროფილი</button></nav>
</section>

<section id="game" class="screen hidden">
  <header class="gamebar"><button id="leave" class="round">×</button><div><b id="phaseName">მოლოდინი</b><br><span id="phaseInfo">ლობი</span></div><b id="timer">00:00</b><button id="logBtn">LOG</button><button id="chatBtn">CHAT</button><button id="settingsBtn">ROOM</button></header>
  <section id="lobby" class="lobby">
    <article class="glass card"><h2 id="gRoomName">VOID TABLE</h2><p id="gRoomInfo"></p><div class="actions"><button id="startBtn" class="primary">START</button><button id="rolesBtn">ROLES</button></div></article>
    <article class="glass card"><h3>მოთამაშეები <span id="playerCount"></span></h3><div id="players" class="grid"></div></article>
  </section>
  <div id="videoGrid" class="video-grid hidden"></div>
</section>

<aside id="chatPanel" class="panel glass hidden"><div class="panel-head"><b>ჩათი</b><button data-close="chatPanel">×</button></div><div id="chatMessages" class="scroll"></div><div class="send"><input id="chatInput" placeholder="მესიჯი"><button id="sendChat">➤</button></div></aside>
<aside id="logPanel" class="panel glass hidden"><div class="panel-head"><b>ლოგი</b><button data-close="logPanel">×</button></div><div id="logMessages" class="scroll"></div></aside>
<div id="settingsModal" class="modal hidden"><div class="modal-card glass"><button data-close="settingsModal">×</button><h2>Room Settings</h2><div class="two"><label>Max players<input id="setMax" type="number"></label><button id="saveSettings" class="primary">SAVE</button></div><h3>როლები</h3><div id="setRoles" class="role-grid"></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const App={socket:null,user:null,currentRoom:null,localStream:null,peers:{},roles:[],speaking:{}};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;$("toast").appendChild(d);setTimeout(()=>d.remove(),3500)}
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});return r.json()}
function fmt(n){n=Number(n||0);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function show(screen){["auth","app","game"].forEach(id=>$(id).classList.toggle("hidden",id!==screen))}
function tab(name){["guest","login","reg"].forEach(x=>$(x+"Form").classList.toggle("hidden",x!==name));["Guest","Login","Register"].forEach(x=>$("tab"+x).classList.toggle("active",x.toLowerCase().startsWith(name.slice(0,3))))}
$("tabGuest").onclick=()=>tab("guest");$("tabLogin").onclick=()=>tab("login");$("tabRegister").onclick=()=>tab("reg");
async function boot(){App.socket=io();bindSocket();const roles=await api("/api/roles");App.roles=roles.roles||[];renderRoleInputs("createRoles");renderRoleInputs("setRoles");const me=await api("/api/auth/me");if(me.user){setUser(me.user);show("app");loadAll()}else show("auth")}
function setUser(u){App.user=u;$("userLine").textContent=`ID ${u.userId} · ${u.nickname}`;$("profileText").textContent=`ID ${u.userId} · Level ${u.stats?.level||1} · XP ${u.stats?.xp||0}`;$("profileNick").value=u.nickname||"";$("profileAvatar").value=u.avatar||"◆"}
$("guestBtn").onclick=async()=>{const r=await api("/api/auth/guest",{nickname:$("guestNick").value,avatar:$("guestAvatar").value});if(r.ok){setUser(r.user);show("app");loadAll()}else toast(r.error)};
$("loginBtn").onclick=async()=>{const r=await api("/api/auth/login",{email:$("loginEmail").value,password:$("loginPass").value});if(r.ok){setUser(r.user);show("app");loadAll()}else toast(r.error)};
$("regBtn").onclick=async()=>{const r=await api("/api/auth/register",{username:$("regUser").value,nickname:$("regNick").value,email:$("regEmail").value,password:$("regPass").value});if(r.ok){setUser(r.user);show("app");loadAll()}else toast(r.error)};
$("saveProfile").onclick=async()=>{const r=await api("/api/profile",{userId:App.user.userId,nickname:$("profileNick").value,avatar:$("profileAvatar").value});if(r.ok){setUser(r.user);toast("შენახულია")}else toast(r.error)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$("page"+b.dataset.page).classList.add("active");$("title").textContent=b.textContent;loadAll()});
function renderRoleInputs(id){$(id).innerHTML=App.roles.map(r=>`<label>${r.label}<input data-role="${r.id}" type="number" value="${r.id==="mafia"?1:r.id==="doctor"||r.id==="sheriff"?1:r.id==="citizen"?6:0}" min="0" max="10"></label>`).join("")}
function collectRoles(id){const roles={};$(id).querySelectorAll("input[data-role]").forEach(i=>roles[i.dataset.role]=Number(i.value||0));return roles}
async function loadAll(){loadRooms();loadClans();loadLeaders()}
async function loadRooms(){const r=await api("/api/rooms");$("rooms").innerHTML=(r.rooms||[]).map(room=>`<div class="room"><h3>${esc(room.name)}</h3><div class="badges"><span class="badge">${room.phaseLabel}</span><span class="badge">${room.players}/${room.maxPlayers}</span><span class="badge">ჰოსტი ${esc(room.hostName||"-")}</span></div><div class="actions"><button onclick="joinRoom('${room.id}',false)">შესვლა</button><button onclick="joinRoom('${room.id}',true)">ყურება</button></div></div>`).join("")||"<p>ოთახი ჯერ არ არის.</p>"}
async function loadClans(){const r=await api("/api/clans");$("clans").innerHTML=(r.clans||[]).map(c=>`<div class="clan"><h3>${esc(c.emblem||"◆")} ${esc(c.name)}</h3><p>Leader: ${esc(c.leaderName)} · Members: ${(c.members||[]).length} · Points: ${c.points||0}</p></div>`).join("")||"<p>კლანები ჯერ არ არის.</p>"}
async function loadLeaders(){const r=await api("/api/leaderboard");$("leaderboard").innerHTML=(r.users||[]).map(u=>`<div class="player"><div class="avatar">${esc(u.avatar)}</div><div><b>ID ${u.userId} · ${esc(u.nickname)}</b><br><span>Level ${u.stats?.level||1} · XP ${u.stats?.xp||0} · Wins ${u.stats?.wins||0}</span></div></div>`).join("")}
$("refreshBtn").onclick=loadAll;$("createClan").onclick=async()=>{const r=await api("/api/clans",{name:$("clanName").value,user:App.user});if(r.ok){toast("კლანი შეიქმნა");loadClans()}else toast(r.error)}
$("createRoom").onclick=()=>App.socket.emit("room:create",{user:App.user,name:$("roomName").value,settings:{maxPlayers:Number($("maxPlayers").value||10),roles:collectRoles("createRoles")}},res=>{if(res.ok){App.currentRoom=res.room;show("game");renderGame();ensureMedia();}else toast(res.error)});
window.joinRoom=(id,spectator)=>App.socket.emit("room:join",{roomId:id,spectator,user:App.user},res=>{if(res.ok){App.currentRoom=res.room;show("game");renderGame();ensureMedia();}else toast(res.error)});
$("leave").onclick=()=>{show("app");App.currentRoom=null;loadRooms()};
async function ensureMedia(){if(App.localStream)return App.localStream;try{App.localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setupSpeaking();}catch(e){toast("კამერა/მიკროფონი ვერ ჩაირთო")}return App.localStream}
function setupSpeaking(){try{const ctx=new AudioContext();const src=ctx.createMediaStreamSource(App.localStream);const analyser=ctx.createAnalyser();src.connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);setInterval(()=>{analyser.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;const me=myPlayer();if(me){App.speaking[me.userId]=avg>12;renderPlayersOnly()}},700)}catch(e){}}
function myPlayer(){return App.currentRoom?.players?.find(p=>String(p.userId)===String(App.user?.userId))}
function isHost(){const p=myPlayer();return p&&p.seat===1}
function renderGame(){const r=App.currentRoom;if(!r)return;const waiting=r.phase==="waiting";$("phaseName").textContent=r.phaseLabel||r.phase;$("phaseInfo").textContent=waiting?`ლობი · ${r.players.length}/${r.settings.maxPlayers}`:`დღე ${r.day} · ცოცხალი ${r.alive}`;$("timer").textContent=fmt(r.timer);$("lobby").classList.toggle("hidden",!waiting);$("videoGrid").classList.toggle("hidden",waiting);$("settingsBtn").style.display=isHost()?"block":"none";$("startBtn").style.display=isHost()?"block":"none";$("rolesBtn").style.display=isHost()?"block":"none";$("gRoomName").textContent=r.name;$("gRoomInfo").textContent=`კოდი ${r.id} · ჰოსტი ${r.hostName}`;renderPlayersOnly();renderChat();renderLog();if(!waiting)renderVideos()}
function renderPlayersOnly(){const r=App.currentRoom;if(!r||!$("players"))return;$("playerCount").textContent=`${r.players.length}/${r.settings.maxPlayers}`;$("players").innerHTML=r.players.map(p=>`<div class="player ${App.speaking[p.userId]?"speaking":""}"><div class="avatar">${esc(p.avatar)}</div><div class="meta"><b>#${p.seat} · ${esc(p.nickname)} ${p.userId===App.user.userId?"(you)":""}</b><br><span>ID ${p.userId} · ${p.seat===1?"HOST · ":""}${p.connected?"online":"offline"}</span>${p.userId===App.user.userId?`<div><button onclick="toggleMic()">MIC ${p.micOn?"ON":"OFF"}</button><button onclick="toggleCam()">CAM ${p.cameraOn?"ON":"OFF"}</button></div>`:""}</div><span class="badge ${p.connected?"live":""}">${p.connected?"ON":"OFF"}</span></div>`).join("")}
function renderVideos(){const r=App.currentRoom;$("videoGrid").innerHTML=r.players.map(p=>`<div class="tile"><div class="avatar">${esc(p.avatar)}</div><video id="v_${p.socketId}" autoplay playsinline ${p.userId===App.user.userId?"muted":""}></video><span class="seat">#${p.seat}</span><div class="tile-name">ID ${p.userId} · ${esc(p.nickname)} ${p.role?"· "+esc(p.role):""}</div></div>`).join("");const me=myPlayer();if(me&&App.localStream){const v=$("v_"+me.socketId);if(v){v.srcObject=App.localStream;v.muted=true;v.play?.().catch(()=>{})}}connectPeers()}
window.toggleMic=()=>{const t=App.localStream?.getAudioTracks?.()[0];if(!t)return;t.enabled=!t.enabled;App.socket.emit("media:state",{roomId:App.currentRoom.id,micOn:t.enabled});}
window.toggleCam=()=>{const t=App.localStream?.getVideoTracks?.()[0];if(!t)return;t.enabled=!t.enabled;App.socket.emit("media:state",{roomId:App.currentRoom.id,cameraOn:t.enabled});}
$("startBtn").onclick=() => App.socket.emit("game:start",{roomId:App.currentRoom.id,userId:App.user.userId},res=>{if(!res.ok)toast(res.error)});
$("rolesBtn").onclick=$("settingsBtn").onclick=()=>{if(!App.currentRoom)return;$("setMax").value=App.currentRoom.settings.maxPlayers;Object.entries(App.currentRoom.settings.roles||{}).forEach(([k,v])=>{const i=$("setRoles").querySelector(`[data-role="${k}"]`);if(i)i.value=v});$("settingsModal").classList.remove("hidden")}
$("saveSettings").onclick=()=>App.socket.emit("room:settings",{roomId:App.currentRoom.id,userId:App.user.userId,settings:{maxPlayers:Number($("setMax").value||10),roles:collectRoles("setRoles")}},res=>{if(res.ok){toast("შენახულია");$("settingsModal").classList.add("hidden")}else toast(res.error)})
$("chatBtn").onclick=()=>$("chatPanel").classList.remove("hidden");$("logBtn").onclick=()=>$("logPanel").classList.remove("hidden");document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add("hidden"));
$("sendChat").onclick=sendChat;$("chatInput").onkeydown=e=>{if(e.key==="Enter")sendChat()};function sendChat(){const m=$("chatInput").value.trim();if(!m||!App.currentRoom)return;let done=false;setTimeout(()=>{if(!done)toast("ჩატი არ გავიდა")},5000);App.socket.emit("chat:send",{roomId:App.currentRoom.id,message:m},res=>{done=true;if(res.ok)$("chatInput").value="";else toast(res.error)})}
function renderChat(){const r=App.currentRoom;if(!r)return;$("chatMessages").innerHTML=(r.chat||[]).map(m=>`<div class="msg"><b>${m.seat?"#"+m.seat+" · ":""}${esc(m.nickname)}</b><br>${esc(m.message)}</div>`).join("");$("chatMessages").scrollTop=$("chatMessages").scrollHeight}
function renderLog(){const r=App.currentRoom;if(!r)return;$("logMessages").innerHTML=(r.events||[]).slice().reverse().map(e=>`<div class="event">${esc(e.text)}</div>`).join("")}
function bindSocket(){App.socket.on("rooms:update",rooms=>loadRooms());App.socket.on("room:state",room=>{if(App.currentRoom&&room.id===App.currentRoom.id){App.currentRoom=room;renderGame()}});App.socket.on("chat:message",msg=>{if(App.currentRoom){App.currentRoom.chat=App.currentRoom.chat||[];App.currentRoom.chat.push(msg);renderChat()}});
App.socket.on("signal:offer",async({from,signal})=>{const pc=await peer(from);await pc.setRemoteDescription(signal);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);App.socket.emit("signal:answer",{to:from,signal:ans})});
App.socket.on("signal:answer",async({from,signal})=>{const pc=App.peers[from];if(pc)await pc.setRemoteDescription(signal)});
App.socket.on("signal:ice",async({from,candidate})=>{const pc=App.peers[from];if(pc&&candidate)pc.addIceCandidate(candidate).catch(()=>{})})}
async function peer(socketId){if(App.peers[socketId])return App.peers[socketId];await ensureMedia();const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});App.peers[socketId]=pc;App.localStream?.getTracks().forEach(t=>pc.addTrack(t,App.localStream));pc.onicecandidate=e=>{if(e.candidate)App.socket.emit("signal:ice",{to:socketId,candidate:e.candidate})};pc.ontrack=e=>{const v=$("v_"+socketId);if(v){v.srcObject=e.streams[0];v.play?.().catch(()=>{})}};return pc}
async function connectPeers(){const me=myPlayer();if(!me||!App.localStream)return;for(const p of App.currentRoom.players){if(!p.socketId||p.socketId===me.socketId||App.peers[p.socketId])continue;const pc=await peer(p.socketId);const offer=await pc.createOffer();await pc.setLocalDescription(offer);App.socket.emit("signal:offer",{to:p.socketId,signal:offer})}}
boot();
</script>
