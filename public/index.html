<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Mafia Voice</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn { background: #ff4757; color: white; border: none; padding: 20px 40px; border-radius: 10px; font-size: 20px; cursor: pointer; }
        #users-list { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; }
        .user-box { background: #2f3542; padding: 10px; margin: 10px; border-radius: 5px; }
        audio { display: block; margin-top: 10px; height: 30px; width: 200px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>
    <h1>Void Mafia Voice System</h1>
    <button id="joinBtn" class="btn">შესვლა და საუბარი</button>
    <p id="status">სტატუსი: გამორთულია</p>
    
    <div id="users-list"></div>

    <script>
        const socket = io();
        const joinBtn = document.getElementById('joinBtn');
        const status = document.getElementById('status');
        const usersList = document.getElementById('users-list');
        
        let localStream;
        const peers = {};

        joinBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                status.innerText = "სტატუსი: ჩართულია ✅";
                joinBtn.style.display = 'none';
                
                socket.emit('join-room', 'main-lobby', 'player-' + Math.floor(Math.random() * 1000));
            } catch (err) {
                alert("მიკროფონი მიუწვდომელია!");
            }
        };

        socket.on('all-users', users => {
            users.forEach(userId => {
                const peer = createPeer(userId, socket.id, localStream);
                peers[userId] = peer;
            });
        });

        socket.on('user-joined', payload => {
            const peer = addPeer(payload.signal, payload.callerID, localStream);
            peers[payload.callerID] = peer;
        });

        socket.on('receiving-returned-signal', payload => {
            peers[payload.id].signal(payload.signal);
        });

        socket.on('user-left', userId => {
            if (peers[userId]) {
                peers[userId].destroy();
                document.getElementById(userId)?.remove();
                delete peers[userId];
            }
        });

        function createPeer(userToSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: true, trickle: false, stream });

            peer.on('signal', signal => {
                socket.emit('sending-signal', { userToSignal, callerID, signal });
            });

            peer.on('stream', stream => {
                addAudioElement(userToSignal, stream);
            });

            return peer;
        }

        function addPeer(incomingSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream });

            peer.on('signal', signal => {
                socket.emit('returning-signal', { signal, callerID });
            });

            peer.on('stream', stream => {
                addAudioElement(callerID, stream);
            });

            peer.signal(incomingSignal);
            return peer;
        }

        function addAudioElement(userId, stream) {
            if (document.getElementById(userId)) return;

            const div = document.createElement('div');
            div.id = userId;
            div.className = 'user-box';
            div.innerHTML = `<span>მოთამაშე ${userId.substring(0, 5)}</span>`;
            
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.playsInline = true;
            audio.controls = true; // დავამატოთ კონტროლები ტესტისთვის
            
            div.appendChild(audio);
            usersList.appendChild(div);
        }
    </script>
</body>
</html>
