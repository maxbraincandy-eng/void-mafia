
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID MAFIA // VAPOR VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #ff00ff; --cyan: #00ffff; --bg: #07020f;
            --card-bg: rgba(14, 5, 32, 0.95); --red: #ff3e3e;
            --green: #3eff3e; --blue: #3e8eff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px; overflow-x: hidden;
            background-image: linear-gradient(to bottom, transparent 50%, rgba(255, 0, 255, 0.05) 50%), 
                              linear-gradient(to right, transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 40px 40px;
        }

        .game-active .glitch-title, .game-active .powered { display: none; }

        .glitch-title {
            font-family: 'Orbitron'; font-size: clamp(1.5rem, 8vw, 3rem);
            color: var(--cyan); text-shadow: 0 0 15px var(--cyan), 2px 2px var(--neon);
            margin-top: 40px; text-align: center; text-transform: uppercase;
        }

        .powered { font-size: 0.7rem; color: #6a4a8a; margin-bottom: 1rem; letter-spacing: 2px; text-align: center; }

        .card {
            background: var(--card-bg); border: 1px solid var(--neon);
            padding: 1.5rem 1rem; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            display: flex; flex-direction: column; gap: 12px;
        }

        #game-status-bar {
            width: 100%; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--neon);
            padding: 10px; display: flex; justify-content: space-around;
            font-family: 'Orbitron'; font-size: 0.8rem; position: fixed; top: 0; left: 0; z-index: 2000;
        }

        input {
            width: 100%; background: #000; border: 1px solid var(--neon);
            color: white; padding: 12px; font-size: 1rem; outline: none; text-align: center;
        }

        .btn {
            width: 100%; padding: 14px; background: var(--neon); color: white;
            border: none; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem;
            text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }

        #video-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            width: 100%; max-width: 800px; margin-top: 50px; margin-bottom: 100px;
        }

        .video-box {
            border: 1px solid var(--neon); background: #000; position: relative;
            aspect-ratio: 4/3; overflow: hidden; border-radius: 4px;
        }

        /* ნუმერაციის სტილი */
        .player-number {
            position: absolute; top: 5px; right: 5px; background: var(--neon);
            color: white; font-family: 'Orbitron'; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 2px; z-index: 10;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .video-label {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7); padding: 4px; font-size: 0.65rem;
            color: var(--cyan); border-top: 1px solid var(--neon);
        }

        .controls {
            position: fixed; bottom: 20px; display: flex; gap: 8px; z-index: 1500;
            background: rgba(7, 2, 15, 0.9); padding: 10px; border-radius: 12px; border: 1px solid var(--neon);
        }

        #chat-panel {
            position: fixed; right: -100%; top: 0; width: 100%; max-width: 320px; height: 100%;
            background: var(--card-bg); border-left: 2px solid var(--neon); transition: 0.3s ease; z-index: 3000;
            display: flex; flex-direction: column;
        }

        #chat-panel.open { right: 0; }

        #chat-header { padding: 15px; background: var(--neon); display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; }

        #chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-left: 2px solid var(--cyan); font-size: 0.85rem; }

        #chat-toggle {
            position: fixed; right: 15px; bottom: 90px; width: 45px; height: 45px; border-radius: 50%;
            background: var(--neon); display: flex; align-items: center; justify-content: center; z-index: 1400;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="login-view">

    <h1 class="glitch-title">VOID MAFIA</h1>
    <div class="powered">Powered by ბატონი მაქსი</div>

    <div id="login-screen" class="card">
        <input type="text" id="nickname" placeholder="შეიყვანე ნიკნეიმი">
        <button class="btn" onclick="showRooms()">შესვლა</button>
    </div>

    <div id="rooms-screen" class="card hidden">
        <div id="host-settings" style="text-align: left; padding: 10px; border: 1px solid var(--cyan); margin-bottom: 10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.75rem;">
                <label><input type="checkbox" id="set-sheriff" checked> შერიფი</label>
                <label><input type="checkbox" id="set-don" checked> დონი</label>
                <label><input type="checkbox" id="set-doctor" checked> ექიმი</label>
                <div>მაფია: <input type="number" id="mafia-count" value="1" style="width:30px;"></div>
            </div>
        </div>
        <input type="text" id="room-id" placeholder="ოთახის ID">
        <button class="btn" onclick="startVoid()">ოთახის შექმნა / შესვლა</button>
    </div>

    <div id="game-screen" class="hidden" style="width: 100%;">
        <div id="game-status-bar">
            <span id="game-phase">მზადება...</span>
            <span id="game-timer">00:00</span>
        </div>
        
        <div id="host-panel" class="hidden" style="margin-top: 80px; text-align: center; width: 100%;">
            <button class="btn" onclick="requestStart()" style="background: var(--cyan); color: #000; width: 80%; margin: 0 auto;">START GAME</button>
        </div>

        <div id="video-grid"></div>

        <div id="chat-toggle" onclick="toggleChat()">💬 <div id="chat-badge" style="display:none">0</div></div>
        
        <div class="controls">
            <button id="mic-btn" class="btn" onclick="toggleMic()" style="width:60px">MIC</button>
            <button id="cam-btn" class="btn" onclick="toggleCam()" style="width:60px; background:var(--cyan); color:black">CAM</button>
            <button class="btn" style="background:var(--red); width:60px" onclick="location.reload()">EXIT</button>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-header"><span>VOID CHAT</span><span onclick="toggleChat()">✕</span></div>
        <div id="chat-messages"></div>
        <div id="chat-input-area" style="padding:10px; display:flex;">
            <input type="text" id="chat-msg" placeholder="დაწერე...">
            <button class="btn" style="width:40px" onclick="sendMsg()">></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        const socket = io();
        let localStream, myNick, currentRoom, isHost = false;
        const peers = {};

        function showRooms() {
            myNick = document.getElementById('nickname').value.trim();
            if (!myNick) return;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('rooms-screen').classList.remove('hidden');
        }

        async function startVoid() {
            currentRoom = document.getElementById('room-id').value.trim();
            if (!currentRoom) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.body.classList.add('game-active');
                document.getElementById('rooms-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                
                // ჰოსტი ყოველთვის პირველია
                socket.emit('join-room', currentRoom, myNick);
            } catch (e) { alert("Access Denied"); }
        }

        socket.on('is-host', () => {
            isHost = true;
            document.getElementById('host-panel').classList.remove('hidden');
        });

        // ნუმერაციის და ვიდეოების მართვა
        socket.on('room-users-list', (users) => {
            // users არის მასივი: [{id, nick, index}]
            users.forEach((user) => {
                if (user.id === socket.id) {
                    addVideo(user.id, localStream, user.nick + " (შენ)", user.index, true);
                }
            });
        });

        function addVideo(id, stream, name, index, mute = false) {
            let div = document.getElementById(id);
            if (!div) {
                div = document.createElement('div');
                div.id = id;
                div.className = 'video-box';
                div.innerHTML = `
                    <div class="player-number">#${index}</div>
                    <video id="v-${id}" autoplay playsinline ${mute?'muted':''}></video>
                    <div class="video-label">${name}</div>
                `;
                // Grid-order ნუმერაციის მიხედვით
                div.style.order = index;
                document.getElementById('video-grid').appendChild(div);
            }
            const video = document.getElementById(`v-${id}`);
            if (video && stream) video.srcObject = stream;
        }

        // WebRTC სიგნალიზაცია
        socket.on('user-joined-with-info', p => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            peer.on('signal', signal => socket.emit('returning-signal', { signal, callerID: p.id }));
            peer.on('stream', stream => addVideo(p.id, stream, p.nick, p.index));
            peer.signal(p.signal);
            peers[p.id] = peer;
        });

        socket.on('all-users-info', users => {
            users.forEach(u => {
                const peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                peer.on('signal', signal => {
                    socket.emit('sending-signal', { userToSignal: u.id, callerID: socket.id, callerNick: myNick, signal });
                });
                peer.on('stream', stream => addVideo(u.id, stream, u.nick, u.index));
                peers[u.id] = peer;
            });
        });

        function requestStart() {
            if(!isHost) return;
            const count = document.querySelectorAll('.video-box').length;
            if(count < 4) return alert("საჭიროა 4 მოთამაშე!");
            
            socket.emit('start-game-request', {
                room: currentRoom,
                settings: {
                    sheriff: document.getElementById('set-sheriff').checked,
                    doctor: document.getElementById('set-doctor').checked,
                    don: document.getElementById('set-don').checked,
                    mafia: document.getElementById('mafia-count').value
                }
            });
        }

        // სხვა ფუნქციები (Mic, Cam, Chat)
        function toggleMic() { localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; document.getElementById('mic-btn').classList.toggle('off'); }
        function toggleCam() { localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled; document.getElementById('cam-btn').classList.toggle('off'); }
        function toggleChat() { document.getElementById('chat-panel').classList.toggle('open'); }
        function sendMsg() {
            const val = document.getElementById('chat-msg').value;
            if(!val) return;
            socket.emit('send-chat-msg', { room: currentRoom, name: myNick, text: val });
            document.getElementById('chat-msg').value = '';
        }
        socket.on('receive-chat-msg', d => {
            const m = document.getElementById('chat-messages');
            m.innerHTML += `<div class="msg"><b>${d.name}:</b> ${d.text}</div>`;
            m.scrollTop = m.scrollHeight;
        });
    </script>
</body>
</html>
