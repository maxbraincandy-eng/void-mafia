<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID MAFIA</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon: #ff00ff;
            --cyan: #00ffff;
            --bg: #07020f;
            --card-bg: rgba(14, 5, 32, 0.95);
            --red: #ff3e3e;
            --green: #3eff3e;
            --blue: #3e8eff;
            --yellow: #ffd43e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            background-image:
                linear-gradient(to bottom, transparent 50%, rgba(255, 0, 255, 0.05) 50%),
                linear-gradient(to right, transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 40px 40px;
        }

        .game-active .glitch-title,
        .game-active .powered {
            display: none;
        }

        .glitch-title {
            font-family: 'Orbitron';
            font-size: clamp(1.5rem, 8vw, 3rem);
            color: var(--cyan);
            text-shadow: 0 0 15px var(--cyan), 2px 2px var(--neon);
            margin-top: 40px;
            text-align: center;
            text-transform: uppercase;
        }

        .powered {
            font-size: 0.7rem;
            color: #6a4a8a;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--neon);
            padding: 1.5rem 1rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #game-status-bar {
            width: 100%;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--neon);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2000;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon);
            color: white;
            padding: 12px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        #mafia-count {
            width: 60px !important;
            display: inline-block;
            padding: 5px;
            margin-left: 10px;
            border-bottom: 2px solid var(--cyan);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--neon);
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 800px;
            margin: 10px auto 110px;
        }

        .video-box {
            border: 1px solid var(--neon);
            background: #000;
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            border-radius: 4px;
            transition: 0.3s ease;
        }

        .video-box.dead {
            filter: grayscale(1);
            opacity: 0.45;
            border-color: #555;
        }

        .dead-badge {
            position: absolute;
            top: 30px;
            left: 5px;
            background: var(--red);
            color: white;
            font-family: Orbitron;
            font-size: 0.6rem;
            padding: 2px 6px;
            z-index: 20;
        }

        .player-number {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--neon);
            color: white;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 2px;
            z-index: 10;
            box-shadow: 0 0 5px var(--neon);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            padding: 4px;
            font-size: 0.65rem;
            color: var(--cyan);
            border-top: 1px solid var(--neon);
        }

        .controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 8px;
            z-index: 1500;
            background: rgba(7, 2, 15, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--neon);
        }

        #chat-panel {
            position: fixed;
            right: -100%;
            top: 0;
            width: 100%;
            max-width: 320px;
            height: 100%;
            background: var(--card-bg);
            border-left: 2px solid var(--neon);
            transition: 0.3s ease;
            z-index: 3000;
            display: flex;
            flex-direction: column;
        }

        #chat-panel.open {
            right: 0;
        }

        #chat-header {
            padding: 15px;
            background: var(--neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron';
        }

        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-left: 2px solid var(--cyan);
            font-size: 0.85rem;
            word-break: break-word;
        }

        #chat-toggle {
            position: fixed;
            right: 15px;
            bottom: 90px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--neon);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1400;
            cursor: pointer;
        }

        .room-item {
            border: 1px solid var(--cyan);
            padding: 10px;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 255, 0.05);
        }

        #action-panel {
            margin: 75px auto 10px;
            max-width: 420px;
            padding: 12px;
            border: 1px solid var(--cyan);
            background: var(--card-bg);
            box-shadow: 0 0 20px rgba(0,255,255,0.15);
        }

        #action-title {
            font-family: Orbitron;
            color: var(--cyan);
            margin-bottom: 8px;
            text-align: center;
            font-size: 0.75rem;
        }

        .player-action-row {
            display: grid;
            grid-template-columns: 45px 1fr;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }

        .player-mini-number {
            background: var(--neon);
            padding: 10px 4px;
            text-align: center;
            font-family: Orbitron;
            font-size: 0.65rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<audio id="sfx-click" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3"></audio>

<h1 class="glitch-title">VOID MAFIA</h1>
<div class="powered">Powered by ბატონი მაქსი</div>

<div id="login-screen" class="card">
    <input type="text" id="nickname" placeholder="შეიყვანე ნიკნეიმი">
    <button class="btn" onclick="showRooms()">შესვლა</button>
</div>

<div id="rooms-screen" class="card hidden">
    <div id="host-settings" style="text-align:left; padding:10px; border:1px solid var(--cyan); margin-bottom:10px;">
        <p style="font-size:0.7rem; color:var(--cyan); margin:0 0 10px 0;">პარამეტრები ჰოსტისთვის</p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.8rem;">
            <label><input type="checkbox" id="set-sheriff" checked> შერიფი</label>
            <label><input type="checkbox" id="set-don" checked> დონი</label>
            <label><input type="checkbox" id="set-doctor" checked> ექიმი</label>

            <div style="display:flex; align-items:center;">
                <span>მაფია:</span>
                <input type="number" id="mafia-count" value="1" min="1" max="3">
            </div>
        </div>
    </div>

    <input type="text" id="room-id" placeholder="ოთახის ID">
    <button class="btn" onclick="startVoid()">ოთახის შექმნა / შესვლა</button>

    <div id="room-list" style="margin-top:15px; text-align:left; max-height:200px; overflow-y:auto;"></div>
</div>

<div id="game-screen" class="hidden" style="width:100%;">

    <div id="game-status-bar">
        <span id="game-phase">მზადება...</span>
        <span id="game-timer">00:00</span>
        <span id="alive-count">0 ცოცხალი</span>
    </div>

    <div id="my-role-card" class="hidden"
         style="position:fixed; top:50px; left:10px; background:var(--card-bg); border:1px solid var(--cyan); padding:7px 10px; font-family:'Orbitron'; font-size:0.7rem; z-index:1001;">
        როლი: ?
    </div>

    <div id="host-panel" class="hidden" style="margin-top:80px; text-align:center; width:100%;">
        <button class="btn" onclick="requestStart()"
                style="background:var(--cyan); color:#000; width:80%; margin:0 auto; box-shadow:0 0 15px var(--cyan);">
            START GAME
        </button>
    </div>

    <div id="action-panel" class="hidden">
        <div id="action-title">ქმედება</div>
        <div id="players-actions"></div>
    </div>

    <div id="video-grid"></div>

    <div id="chat-toggle" onclick="toggleChat()">CHAT</div>

    <div class="controls">
        <button id="mic-btn" class="btn" onclick="toggleMic()" style="width:60px">MIC</button>
        <button id="cam-btn" class="btn" onclick="toggleCam()" style="width:60px; background:var(--cyan); color:black">CAM</button>
        <button class="btn" style="background:var(--red); width:60px" onclick="location.reload()">EXIT</button>
    </div>
</div>

<div id="chat-panel">
    <div id="chat-header">
        <span>VOID CHAT</span>
        <span onclick="toggleChat()" style="cursor:pointer; padding:5px;">✕</span>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area" style="padding:10px; display:flex; gap:5px;">
        <input type="text" id="chat-msg" placeholder="დაწერე...">
        <button class="btn" style="width:50px" onclick="sendMsg()">></button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>

<script>
    const socket = io();

    let localStream;
    let myNick;
    let currentRoom;
    let isHost = false;

    let myRole = null;
    let currentPhase = "waiting";
    let alivePlayers = [];
    let timerInterval = null;
    let timerSeconds = 0;

    const peers = {};

    function playSFX() {
        document.getElementById('sfx-click').play().catch(() => {});
    }

    function showRooms() {
        myNick = document.getElementById('nickname').value.trim();

        if (!myNick) {
            return alert("ჩაწერე ნიკი");
        }

        playSFX();

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('rooms-screen').classList.remove('hidden');

        socket.emit('get-rooms');
    }

    async function startVoid(roomFromList) {
        currentRoom = roomFromList || document.getElementById('room-id').value.trim();

        if (!currentRoom) {
            return alert("ჩაწერე ოთახის ID");
        }

        playSFX();

        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });

            document.body.classList.add('game-active');
            document.getElementById('rooms-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            socket.emit('join-room', currentRoom, myNick);
        } catch (e) {
            alert("კამერა ან მიკროფონი არ ჩაირთო");
        }
    }

    socket.on('is-host', () => {
        isHost = true;
        document.getElementById('host-panel').classList.remove('hidden');
    });

    socket.on('update-room-list', rooms => {
        const list = document.getElementById('room-list');

        list.innerHTML = rooms.length === 0
            ? '<p style="font-size:0.7rem; color:#666;">აქტიური ოთახები არ არის</p>'
            : '';

        rooms.forEach(r => {
            list.innerHTML += `
                <div class="room-item">
                    <span style="font-size:0.8rem;">ID: ${escapeHtml(r.code)} (${r.playerCount}/10)</span>
                    <button class="btn" style="width:60px; padding:5px; font-size:0.6rem;" onclick="startVoid('${escapeHtml(r.code)}')">JOIN</button>
                </div>
            `;
        });
    });

    socket.on('room-users-list', users => {
        users.forEach(user => {
            if (user.id === socket.id) {
                addVideo(user.id, localStream, user.name + " (შენ)", user.index, true);
            }
        });
    });

    socket.on('all-users-info', users => {
        users.forEach(u => {
            const peer = new SimplePeer({
                initiator: true,
                trickle: false,
                stream: localStream
            });

            peer.on('signal', signal => {
                socket.emit('sending-signal', {
                    userToSignal: u.id,
                    callerID: socket.id,
                    signal
                });
            });

            peer.on('stream', stream => {
                addVideo(u.id, stream, u.name, u.index);
            });

            peers[u.id] = peer;
        });
    });

    socket.on('user-joined-with-info', p => {
        const peer = new SimplePeer({
            initiator: false,
            trickle: false,
            stream: localStream
        });

        peer.on('signal', signal => {
            socket.emit('returning-signal', {
                signal,
                callerID: p.id
            });
        });

        peer.on('stream', stream => {
            addVideo(p.id, stream, p.nick, p.index);
        });

        if (p.signal) {
            peer.signal(p.signal);
        }

        peers[p.id] = peer;
    });

    socket.on('receiving-returned-signal', p => {
        if (peers[p.id]) {
            peers[p.id].signal(p.signal);
        }
    });

    socket.on('user-left', id => {
        if (peers[id]) {
            peers[id].destroy();
        }

        delete peers[id];

        const el = document.getElementById(id);
        if (el) el.remove();
    });

    function addVideo(id, stream, name, index, mute = false) {
        if (document.getElementById(id)) return;

        const div = document.createElement('div');

        div.id = id;
        div.className = 'video-box';
        div.style.order = index;

        div.innerHTML = `
            <div class="player-number">#${index}</div>
            <video id="v-${id}" autoplay playsinline ${mute ? 'muted' : ''}></video>
            <div class="video-label">${escapeHtml(name)}</div>
        `;

        document.getElementById('video-grid').appendChild(div);

        if (stream) {
            document.getElementById(`v-${id}`).srcObject = stream;
        }
    }

    function requestStart() {
        if (!isHost) return;

        const count = document.querySelectorAll('.video-box').length;

        if (count < 4) {
            return alert("საჭიროა მინიმუმ 4 მოთამაშე");
        }

        playSFX();

        socket.emit('start-game-request', {
            room: currentRoom,
            settings: {
                sheriff: document.getElementById('set-sheriff').checked,
                don: document.getElementById('set-don').checked,
                doctor: document.getElementById('set-doctor').checked,
                mafia: Number(document.getElementById('mafia-count').value)
            }
        });
    }

    socket.on('assign-role', role => {
        myRole = role;

        const el = document.getElementById('my-role-card');

        el.classList.remove('hidden');
        el.innerText = "როლი: " + roleName(role);

        if (role === 'mafia' || role === 'don') {
            el.style.color = 'var(--red)';
        } else if (role === 'doctor') {
            el.style.color = 'var(--green)';
        } else if (role === 'sheriff') {
            el.style.color = 'var(--blue)';
        } else {
            el.style.color = 'white';
        }

        addSystemMsg("შენი როლია: " + roleName(role));
    });

    socket.on('game-state', state => {
        currentPhase = state.phase;
        alivePlayers = state.players || [];

        updatePhaseText();
        updateAliveCount();
        updateDeadVideos();
        renderActionPanel();
    });

    socket.on('phase-message', msg => {
        addSystemMsg(msg);
    });

    socket.on('sheriff-result', data => {
        const result = data.isMafia ? "მაფიაა" : "მშვიდობიანია";
        alert(`${data.name} — ${result}`);
        addSystemMsg(`შერიფის პასუხი: ${data.name} — ${result}`);
    });

    socket.on('game-over', data => {
        addSystemMsg(data.message);
        alert(data.message);
        document.getElementById('action-panel').classList.add('hidden');
    });

    function updatePhaseText() {
        const phase = document.getElementById('game-phase');

        if (currentPhase === "night") {
            phase.innerText = "ღამე";
            startTimer(60);
        } else if (currentPhase === "day") {
            phase.innerText = "დღე / განხილვა";
            startTimer(45);
        } else if (currentPhase === "vote") {
            phase.innerText = "ხმის მიცემა";
            startTimer(30);
        } else if (currentPhase === "ended") {
            phase.innerText = "თამაში დასრულდა";
            stopTimer();
        } else {
            phase.innerText = "მზადება";
            stopTimer();
        }
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        timerSeconds = seconds;

        updateTimerText();

        timerInterval = setInterval(() => {
            timerSeconds--;
            updateTimerText();

            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('game-timer').innerText = "00:00";
    }

    function updateTimerText() {
        const min = String(Math.flo
