<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VOID MAFIA</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon:#ff00ff;
      --cyan:#00ffff;
      --bg:#07020f;
      --card:rgba(14,5,32,.95);
      --red:#ff3e3e;
      --green:#3eff3e;
      --blue:#3e8eff;
    }

    * {
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body {
      margin:0;
      min-height:100vh;
      padding:10px;
      background:var(--bg);
      color:white;
      font-family:'Rajdhani',sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow-x:hidden;
      background-image:
        linear-gradient(to bottom, transparent 50%, rgba(255,0,255,.05) 50%),
        linear-gradient(to right, transparent 50%, rgba(0,255,255,.05) 50%);
      background-size:40px 40px;
    }

    body.night-mode {
      background-color:#010008;
      filter:brightness(.75);
    }

    body.day-mode {
      filter:brightness(1);
    }

    body.night-mode #game-status-bar {
      border-bottom-color:var(--blue);
      background:#000;
    }

    body.night-mode .video-box {
      box-shadow:0 0 18px rgba(62,142,255,.35);
      border-color:var(--blue);
    }

    .hidden { display:none !important; }

    .game-active .glitch-title,
    .game-active .powered {
      display:none;
    }

    .glitch-title {
      margin-top:40px;
      font-family:'Orbitron';
      font-size:clamp(1.6rem,8vw,3rem);
      color:var(--cyan);
      text-shadow:0 0 15px var(--cyan), 2px 2px var(--neon);
      text-align:center;
    }

    .powered {
      font-size:.75rem;
      color:#8b64aa;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    .card {
      width:100%;
      max-width:420px;
      background:var(--card);
      border:1px solid var(--neon);
      padding:18px 14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      box-shadow:0 0 30px rgba(255,0,255,.2);
    }

    input {
      width:100%;
      background:#000;
      border:1px solid var(--neon);
      color:white;
      padding:13px;
      outline:none;
      text-align:center;
      font-size:1rem;
      font-family:'Rajdhani';
    }

    .btn {
      width:100%;
      padding:14px;
      border:0;
      background:var(--neon);
      color:white;
      font-family:'Orbitron';
      font-size:.75rem;
      cursor:pointer;
      text-transform:uppercase;
    }

    .btn:active { transform:scale(.97); }

    #mafia-count {
      width:60px;
      padding:6px;
      margin-left:8px;
    }

    .room-item {
      border:1px solid var(--cyan);
      padding:10px;
      margin-top:6px;
      background:rgba(0,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    #game-screen {
      width:100%;
    }

    #game-status-bar {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:2000;
      background:rgba(0,0,0,.92);
      border-bottom:2px solid var(--neon);
      display:flex;
      justify-content:space-around;
      padding:10px 4px;
      font-family:'Orbitron';
      font-size:.68rem;
    }

    #my-role-card {
      position:fixed;
      top:52px;
      left:8px;
      z-index:2100;
      background:var(--card);
      border:1px solid var(--cyan);
      padding:7px 10px;
      font-family:'Orbitron';
      font-size:.68rem;
    }

    #host-panel {
      margin-top:82px;
      text-align:center;
      width:100%;
    }

    .phase-banner {
      margin:55px auto 10px;
      max-width:430px;
      padding:14px;
      border:2px solid var(--cyan);
      background:rgba(0,0,0,.75);
      text-align:center;
      box-shadow:0 0 20px rgba(0,255,255,.25);
    }

    #phase-big-text {
      font-family:Orbitron;
      font-size:1.1rem;
      color:var(--cyan);
    }

    #phase-small-text {
      margin-top:6px;
      font-size:.85rem;
      color:white;
    }

    body.night-mode .phase-banner {
      border-color:var(--blue);
      box-shadow:0 0 25px rgba(62,142,255,.45);
    }

    body.night-mode #phase-big-text {
      color:var(--blue);
    }

    #action-panel {
      margin:10px auto 10px;
      max-width:420px;
      background:var(--card);
      border:1px solid var(--cyan);
      padding:12px;
    }

    #action-title {
      color:var(--cyan);
      font-family:'Orbitron';
      font-size:.75rem;
      text-align:center;
      margin-bottom:8px;
    }

    #video-grid {
      width:100%;
      max-width:850px;
      margin:12px auto 110px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }

    .video-box {
      position:relative;
      background:#000;
      border:1px solid var(--neon);
      aspect-ratio:4/3;
      overflow:hidden;
      border-radius:4px;
    }

    .video-box.dead {
      filter:grayscale(1);
      opacity:.45;
      border-color:#555;
    }

    video {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .player-number {
      position:absolute;
      top:5px;
      right:5px;
      z-index:10;
      background:var(--neon);
      color:white;
      font-family:'Orbitron';
      font-size:.65rem;
      padding:2px 7px;
    }

    .video-label {
      position:absolute;
      bottom:0;
      left:0;
      width:100%;
      background:rgba(0,0,0,.75);
      color:var(--cyan);
      border-top:1px solid var(--neon);
      padding:4px;
      font-size:.7rem;
    }

    .dead-badge {
      position:absolute;
      top:30px;
      left:5px;
      background:var(--red);
      color:white;
      padding:2px 6px;
      font-family:'Orbitron';
      font-size:.6rem;
      z-index:20;
    }

    .controls {
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:1500;
      background:rgba(7,2,15,.92);
      border:1px solid var(--neon);
      border-radius:12px;
      padding:9px;
      display:flex;
      gap:8px;
    }

    .controls .btn {
      width:62px;
      padding:12px 4px;
    }

    #chat-toggle {
      position:fixed;
      right:14px;
      bottom:88px;
      width:50px;
      height:50px;
      border-radius:50%;
      background:var(--neon);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1600;
      font-family:'Orbitron';
      font-size:.6rem;
      cursor:pointer;
    }

    #chat-panel {
      position:fixed;
      right:-100%;
      top:0;
      width:100%;
      max-width:330px;
      height:100%;
      z-index:3000;
      background:var(--card);
      border-left:2px solid var(--neon);
      transition:.25s;
      display:flex;
      flex-direction:column;
    }

    #chat-panel.open { right:0; }

    #chat-header {
      background:var(--neon);
      padding:14px;
      display:flex;
      justify-content:space-between;
      font-family:'Orbitron';
      font-size:.75rem;
    }

    #chat-messages {
      flex:1;
      overflow-y:auto;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .msg {
      background:rgba(255,255,255,.06);
      border-left:2px solid var(--cyan);
      padding:8px;
      font-size:.86rem;
      word-break:break-word;
    }

    .action-row {
      display:grid;
      grid-template-columns:45px 1fr;
      gap:7px;
      margin-top:7px;
    }

    .num {
      background:var(--neon);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Orbitron';
      font-size:.65rem;
    }


    /* ---------------- ADMIN PANEL ---------------- */

    .admin-toggle {
      position:fixed;
      top:52px;
      right:10px;
      z-index:2400;
      width:auto;
      padding:9px 12px;
      border-radius:10px;
      background:linear-gradient(135deg, var(--neon), var(--cyan));
      color:#000;
      box-shadow:0 0 18px rgba(0,255,255,.45);
      font-size:.62rem;
    }

    .admin-panel {
      position:fixed;
      top:0;
      right:-430px;
      width:400px;
      max-width:94vw;
      height:100vh;
      z-index:3500;
      background:rgba(7,2,15,.98);
      border-left:2px solid var(--cyan);
      box-shadow:-12px 0 35px rgba(0,0,0,.75);
      padding:15px;
      overflow-y:auto;
      transition:right .25s ease;
    }

    .admin-panel.admin-open {
      right:0;
    }

    .admin-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      border-bottom:1px solid rgba(0,255,255,.35);
      padding-bottom:10px;
    }

    .admin-header h2 {
      margin:0;
      font-family:Orbitron;
      font-size:1rem;
      color:var(--cyan);
      text-shadow:0 0 12px rgba(0,255,255,.75);
    }

    .admin-close {
      width:36px;
      height:36px;
      padding:0;
      border-radius:10px;
      background:var(--red);
      color:white;
      border:0;
      font-family:Orbitron;
      cursor:pointer;
    }

    .admin-section {
      margin-bottom:13px;
      padding:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      border-radius:14px;
    }

    .admin-section h3 {
      margin:0 0 10px;
      font-family:Orbitron;
      font-size:.72rem;
      color:var(--neon);
    }

    .admin-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }

    .admin-mini-btn {
      padding:10px 8px;
      border:0;
      border-radius:10px;
      background:#1b2144;
      color:white;
      font-family:Orbitron;
      font-size:.58rem;
      cursor:pointer;
    }

    .admin-mini-btn:active {
      transform:scale(.97);
    }

    .admin-mini-btn.danger {
      background:#a30032;
    }

    .admin-mini-btn.good {
      background:#007f66;
    }

    .admin-mini-btn.warn {
      background:#7f5c00;
    }

    #admin-announce-input {
      width:100%;
      margin-bottom:8px;
      border-color:var(--cyan);
    }

    .admin-user-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:8px;
      margin-bottom:7px;
      background:rgba(255,255,255,.06);
      border-radius:10px;
      border-left:2px solid var(--cyan);
      font-size:.82rem;
    }

    .admin-user-actions {
      display:flex;
      gap:5px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .admin-user-actions button {
      padding:6px 7px;
      border:0;
      border-radius:8px;
      background:var(--neon);
      color:white;
      font-family:Orbitron;
      font-size:.52rem;
      cursor:pointer;
    }

    .admin-user-actions button.danger {
      background:var(--red);
    }

    .admin-empty {
      opacity:.65;
      font-size:.8rem;
    }

    .admin-chat-announcement {
      background:rgba(255,0,255,.13);
      border-left:2px solid var(--neon);
      padding:8px;
      color:#ffd9ff;
    }



    /* ---------------- LOBBY MUSIC + MINI GAMES ---------------- */

    .mini-games-toggle {
      position:fixed;
      left:14px;
      bottom:88px;
      z-index:1600;
      width:auto;
      padding:12px 14px;
      border-radius:18px;
      background:linear-gradient(135deg, #ff00ff, #00ffff);
      color:#02020a;
      box-shadow:0 0 18px rgba(255,0,255,.45);
      font-size:.6rem;
    }

    .mini-games-panel {
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:430px;
      max-width:94vw;
      max-height:86vh;
      overflow-y:auto;
      z-index:3400;
      background:rgba(7,2,15,.98);
      border:2px solid var(--cyan);
      box-shadow:0 0 40px rgba(0,255,255,.35), 0 0 60px rgba(255,0,255,.25);
      border-radius:18px;
      padding:14px;
    }

    .mini-games-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
      padding-bottom:10px;
      border-bottom:1px solid rgba(0,255,255,.35);
    }

    .mini-games-header h2 {
      margin:0;
      font-family:Orbitron;
      color:var(--cyan);
      font-size:.95rem;
      text-shadow:0 0 12px var(--cyan);
    }

    .mini-close {
      width:36px;
      height:36px;
      border:0;
      border-radius:10px;
      background:var(--red);
      color:white;
      font-family:Orbitron;
      cursor:pointer;
    }

    .mini-tabs {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      margin-bottom:12px;
    }

    .mini-tab {
      border:1px solid rgba(0,255,255,.35);
      background:#111735;
      color:white;
      padding:9px 5px;
      border-radius:10px;
      font-family:Orbitron;
      font-size:.52rem;
      cursor:pointer;
    }

    .mini-tab.active {
      background:var(--cyan);
      color:#000;
      box-shadow:0 0 14px rgba(0,255,255,.55);
    }

    .mini-game-box {
      border:1px solid rgba(255,0,255,.35);
      background:rgba(255,255,255,.04);
      border-radius:14px;
      padding:12px;
    }

    .mini-title {
      font-family:Orbitron;
      color:var(--neon);
      margin-bottom:8px;
      text-align:center;
    }

    .mini-status {
      text-align:center;
      color:var(--cyan);
      margin-bottom:10px;
      font-family:Orbitron;
      font-size:.7rem;
    }

    .ttt-board {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:7px;
      margin:0 auto 12px;
      max-width:300px;
    }

    .ttt-cell {
      aspect-ratio:1/1;
      border:1px solid var(--cyan);
      background:#000;
      color:white;
      font-family:Orbitron;
      font-size:2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:inset 0 0 16px rgba(0,255,255,.12);
    }

    .ttt-cell:hover {
      background:rgba(0,255,255,.08);
    }

    .mini-reset {
      padding:10px;
      background:var(--neon);
    }

    .truth-card {
      min-height:110px;
      border:1px solid var(--cyan);
      background:#000;
      padding:16px;
      margin-bottom:12px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:1.05rem;
      color:white;
    }

    .dice-result {
      font-family:Orbitron;
      font-size:4rem;
      text-align:center;
      color:var(--cyan);
      text-shadow:0 0 20px var(--cyan);
      padding:18px 0;
    }



    /* ---------------- ADVANCED PACK ---------------- */

    .advanced-floating {
      position:fixed;
      left:50%;
      bottom:150px;
      transform:translateX(-50%);
      z-index:2300;
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      justify-content:center;
      width:min(94vw, 620px);
      pointer-events:auto;
    }

    .advanced-floating .mini-float-btn {
      width:auto;
      padding:9px 10px;
      border:0;
      border-radius:12px;
      background:rgba(0,255,255,.16);
      color:white;
      border:1px solid rgba(0,255,255,.5);
      font-family:Orbitron;
      font-size:.55rem;
      cursor:pointer;
      box-shadow:0 0 12px rgba(0,255,255,.18);
    }

    .advanced-floating .mini-float-btn.admin-only {
      border-color:rgba(255,0,255,.55);
      background:rgba(255,0,255,.16);
    }

    .lobby-ready-box {
      border:1px solid var(--cyan);
      padding:10px;
      background:rgba(0,255,255,.05);
      font-size:.82rem;
      text-align:center;
    }

    #ready-list {
      display:flex;
      flex-direction:column;
      gap:5px;
      margin-top:7px;
      max-height:120px;
      overflow:auto;
    }

    .ready-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px 8px;
      border-radius:9px;
      background:rgba(255,255,255,.06);
      border-left:2px solid var(--neon);
    }

    .ready-ok {
      color:var(--green);
    }

    .ready-no {
      color:var(--red);
    }

    .chat-tabs {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:4px;
      padding:7px;
      background:#080316;
      border-bottom:1px solid rgba(255,0,255,.35);
    }

    .chat-tab {
      border:1px solid rgba(0,255,255,.35);
      background:#101632;
      color:white;
      padding:7px 4px;
      font-size:.55rem;
      font-family:Orbitron;
      border-radius:8px;
      cursor:pointer;
    }

    .chat-tab.active {
      background:var(--cyan);
      color:#000;
    }

    .advanced-mini-selector {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      margin-bottom:10px;
    }

    .advanced-mini-selector button {
      padding:8px 4px;
      border-radius:9px;
      border:1px solid rgba(0,255,255,.4);
      background:#111735;
      color:white;
      font-family:Orbitron;
      font-size:.5rem;
      cursor:pointer;
    }

    .advanced-mini-selector button.active {
      background:var(--cyan);
      color:#000;
    }

    .game-card {
      border:1px solid rgba(255,0,255,.32);
      background:rgba(0,0,0,.42);
      padding:12px;
      border-radius:14px;
      min-height:180px;
    }

    .game-card h3 {
      margin:0 0 10px;
      color:var(--cyan);
      font-family:Orbitron;
      font-size:.72rem;
      text-align:center;
    }

    .game-output {
      min-height:70px;
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid rgba(0,255,255,.35);
      background:#000;
      border-radius:12px;
      font-size:1rem;
      margin-bottom:10px;
    }

    .wheel {
      width:170px;
      height:170px;
      margin:8px auto 12px;
      border-radius:50%;
      border:7px solid var(--cyan);
      background:conic-gradient(var(--neon), var(--cyan), #7c4dff, var(--red), var(--green), var(--neon));
      box-shadow:0 0 24px rgba(0,255,255,.35);
      transition:transform 1.2s ease;
    }

    .memory-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
    }

    .memory-card {
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--cyan);
      background:#000;
      border-radius:9px;
      font-size:1.35rem;
      cursor:pointer;
    }

    .rps-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
    }

    .rps-grid button,
    .game-card .game-btn {
      border:0;
      border-radius:10px;
      padding:10px;
      background:var(--neon);
      color:white;
      font-family:Orbitron;
      cursor:pointer;
      font-size:.62rem;
    }

    .quiz-options {
      display:grid;
      gap:7px;
    }

    .quiz-options button {
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(0,255,255,.4);
      background:#111735;
      color:white;
      cursor:pointer;
    }

    .guess-input {
      margin-bottom:8px;
    }

    .soundboard-grid {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:7px;
    }

    .soundboard-grid button {
      padding:10px;
      border:0;
      border-radius:10px;
      background:#1b2144;
      color:white;
      font-family:Orbitron;
      font-size:.55rem;
      cursor:pointer;
    }

    .pro-admin-row {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      margin-top:8px;
    }

  </style>
</head>

<body>
  <audio id="sfx-click" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3"></audio>
  <audio id="lobby-music" loop preload="auto"
    src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_9c6c04589e.mp3?filename=lofi-study-112191.mp3">
  </audio>

  <h1 class="glitch-title">VOID MAFIA</h1>
  <div class="powered">Powered by ბატონი მაქსი</div>

  <div id="login-screen" class="card">
    <input id="nickname" type="text" placeholder="შეიყვანე ნიკნეიმი">
    <button class="btn" id="login-btn">შესვლა</button>
  </div>

  <div id="rooms-screen" class="card hidden">

      <button class="mini-float-btn" data-react="GG">GG</button>

  <div id="chat-panel">
    <div id="chat-header">
      <span>VOID CHAT</span>
      <span id="close-chat" style="cursor:pointer;">✕</span>
    </div>
    <div class="chat-tabs">
      <button class="chat-tab active" data-chat="main">MAIN</button>
      <button class="chat-tab" data-chat="dead">DEAD</button>
      <button class="chat-tab" data-chat="spectator">SPECTATOR</button>
    </div>


    <div id="chat-messages"></div>

    <div style="padding:10px; display:flex; gap:5px;">
      <input id="chat-msg" type="text" placeholder="დაწერე...">
      <button class="btn" id="send-chat-btn" style="width:55px;">></button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script src="/js/spectators.js"></script>
  
  <script>
    const socket = io();

    let localStream = null;
    let myNick = "";
    let currentRoom = "";
    let isHost = false;
    let myRole = null;
    let currentPhase = "waiting";
    let alivePlayers = [];
    let mafiaIds = [];
    let timerInterval = null;
    let timerSeconds = 0;
    let latestPlayers = [];
    let latestSpectators = [];
    let lobbyMusicOn = false;
    let tttBoard = Array(9).fill("");
    let tttTurn = "X";
    let tttFinished = false;

    const peers = {};
    const $ = id => document.getElementById(id);

    $("login-btn").addEventListener("click", showRooms);
    $("join-btn").addEventListener("click", () => startVoid());
    $("start-game-btn").addEventListener("click", requestStart);
    $("mic-btn").addEventListener("click", toggleMic);
    $("cam-btn").addEventListener("click", toggleCam);
    $("exit-btn").addEventListener("click", () => location.reload());
    $("chat-toggle").addEventListener("click", toggleChat);
    $("close-chat").addEventListener("click", toggleChat);
    $("send-chat-btn").addEventListener("click", sendMsg);

    setupAdminPanel();
    setupLobbyMusic();
    setupMiniGames();

    $("nickname").addEventListener("keydown", e => {
      if (e.key === "Enter") showRooms();
    });

    $("room-id").addEventListener("keydown", e => {
      if (e.key === "Enter") startVoid();
    });

    $("chat-msg").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMsg();
    });

    function playSFX() {
      $("sfx-click").play().catch(() => {});
    }

    function showRooms() {
      myNick = $("nickname").value.trim();

      if (!myNick) {
        alert("ჯერ ჩაწერე ნიკნეიმი");
        return;
      }

      playSFX();

      $("login-screen").classList.add("hidden");
      $("rooms-screen").classList.remove("hidden");

      socket.emit("get-rooms");
    }

    async function startVoid(roomFromList) {
      currentRoom = roomFromList || $("room-id").value.trim();

      if (!currentRoom) {
        alert("ჩაწერე ოთახის ID, მაგალითად 123");
        return;
      }

      playSFX();
      stopLobbyMusic();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        document.body.classList.add("game-active");
        $("rooms-screen").classList.add("hidden");
        $("game-screen").classList.remove("hidden");

        socket.emit("join-room", currentRoom, myNick);
      } catch (err) {
        console.error(err);
        alert("კამერა/მიკროფონი ვერ ჩაირთო. Browser permissions შეამოწმე.");
      }
    }

    socket.on("connect", () => {
      console.log("connected:", socket.id);
    });

    socket.on("connect_error", err => {
      alert("სერვერთან კავშირი ვერ შედგა");
      console.error(err);
    });

    socket.on("error", data => {
      alert(data && data.msg ? data.msg : "შეცდომა");
    });

    socket.on("is-host", () => {
      isHost = true;
      $("host-panel").classList.remove("hidden");
      $("admin-toggle-btn").classList.remove("hidden");
      $("admin-panel").classList.remove("hidden");
      addSystemMsg("შენ ხარ ოთახის ჰოსტი");
      renderAdminPanel();
    });

    socket.on("remove-host", () => {
      isHost = false;
      $("host-panel").classList.add("hidden");
      $("admin-toggle-btn").classList.add("hidden");
      $("admin-panel").classList.add("hidden");
      $("admin-panel").classList.remove("admin-open");
      addSystemMsg("შენ აღარ ხარ ჰოსტი");
    });

    socket.on("update-room-list", rooms => {
      const list = $("room-list");
      list.innerHTML = "";

      if (!rooms || rooms.length === 0) {
        list.innerHTML = '<p style="font-size:.75rem; color:#777;">აქტიური ოთახები არ არის</p>';
        return;
      }

      rooms.forEach(r => {
        const div = document.createElement("div");
        div.className = "room-item";

        div.innerHTML = `
          <span style="font-size:.85rem;">ID: ${escapeHtml(r.code)} (${r.playerCount}/10)</span>
          <button class="btn" style="width:70px; padding:7px; font-size:.6rem;">JOIN</button>
        `;

        div.querySelector("button").onclick = () => startVoid(r.code);
        list.appendChild(div);
      });
    });

    socket.on("room-users-list", users => {
      users.forEach(user => {
        if (user.id === socket.id) {
          addVideo(user.id, localStream, user.name + " (შენ)", user.index, true);
        }
      });
    });

    socket.on("all-users-info", users => {
      users.forEach(u => {
        const peer = new SimplePeer({
          initiator: true,
          trickle: false,
          stream: localStream
        });

        peer.on("signal", signal => {
          socket.emit("sending-signal", {
            userToSignal: u.id,
            callerID: socket.id,
            signal
          });
        });

        peer.on("stream", stream => {
          addVideo(u.id, stream, u.name, u.index);
        });

        peer.on("error", err => console.error("peer error:", err));

        peers[u.id] = peer;
      });
    });

    socket.on("user-joined-with-info", p => {
      const peer = new SimplePeer({
        initiator: false,
        trickle: false,
        stream: localStream
      });

      peer.on("signal", signal => {
        socket.emit("returning-signal", {
          signal,
          callerID: p.id
        });
      });

      peer.on("stream", stream => {
        addVideo(p.id, stream, p.nick, p.index);
      });

      peer.on("error", err => console.error("peer error:", err));

      if (p.signal) {
        peer.signal(p.signal);
      }

      peers[p.id] = peer;
    });

    socket.on("receiving-returned-signal", p => {
      if (peers[p.id]) {
        peers[p.id].signal(p.signal);
      }
    });

    socket.on("user-left", id => {
      if (peers[id]) {
        peers[id].destroy();
        delete peers[id];
      }

      const el = $(id);
      if (el) el.remove();
    });

    function addVideo(id, stream, name, index, mute = false) {
      if ($(id)) return;

      const div = document.createElement("div");
      div.id = id;
      div.className = "video-box";
      div.style.order = index;

      div.innerHTML = `
        <div class="player-number">#${index}</div>
        <video id="v-${id}" autoplay playsinline ${mute ? "muted" : ""}></video>
        <div class="video-label">${escapeHtml(name)}</div>
      `;

      $("video-grid").appendChild(div);

      if (stream) {
        $("v-" + id).srcObject = stream;
        setTimeout(updateVoiceByPhase, 300);
      }
    }

    function requestStart() {
      if (!isHost) {
        alert("თამაშის დაწყება მხოლოდ ჰოსტს შეუძლია");
        return;
      }

      const count = document.querySelectorAll(".video-box").length;

      if (count < 4) {
        alert("საჭიროა მინიმუმ 4 მოთამაშე");
        return;
      }

      socket.emit("start-game-request", {
        room: currentRoom,
        settings: {
          sheriff: $("set-sheriff").checked,
          don: $("set-don").checked,
          doctor: $("set-doctor").checked,
          mafia: Number($("mafia-count").value)
        }
      });
    }

    socket.on("assign-role", role => {
      myRole = role;

      const card = $("my-role-card");
      card.classList.remove("hidden");
      card.innerText = "როლი: " + roleName(role);

      if (role === "mafia" || role === "don") card.style.color = "var(--red)";
      else if (role === "doctor") card.style.color = "var(--green)";
      else if (role === "sheriff") card.style.color = "var(--blue)";
      else card.style.color = "white";

      addSystemMsg("შენი როლია: " + roleName(role));
      updatePhaseText();
      updateVoiceByPhase();
    });

    socket.on("mafia-list", ids => {
      mafiaIds = ids || [];
      updateVoiceByPhase();
    });

    socket.on("game-state", state => {
      currentPhase = state.phase || "waiting";
      alivePlayers = state.players || [];
      latestPlayers = state.players || [];

      updatePhaseText();
      updateAliveCount();
      updateDeadVideos();
      renderActionPanel();
      updateVoiceByPhase();
      renderAdminPanel();
    });

    socket.on("phase-message", msg => {
      addSystemMsg(msg);
    });

    socket.on("sheriff-result", data => {
      const result = data.isMafia ? "მაფიაა" : "მშვიდობიანია";
      alert(`${data.name} — ${result}`);
      addSystemMsg(`შერიფის პასუხი: ${data.name} — ${result}`);
    });

    socket.on("game-over", data => {
      addSystemMsg(data.message);
      alert(data.message);
      $("action-panel").classList.add("hidden");
    });

    function updatePhaseText() {
      document.body.classList.remove("night-mode", "day-mode");

      if (currentPhase === "night") {
        document.body.classList.add("night-mode");

        $("game-phase").innerText = "ღამე";
        $("phase-big-text").innerText = "ღამე";

        if (myRole === "mafia" || myRole === "don") {
          $("phase-small-text").innerText = "მაფიის ფაზა: აირჩიე მოსაკლავი. მხოლოდ მაფიებს ესმით ერთმანეთის ხმა.";
        } else if (myRole === "doctor") {
          $("phase-small-text").innerText = "ექიმის ფაზა: აირჩიე გადასარჩენი მოთამაშე.";
        } else if (myRole === "sheriff") {
          $("phase-small-text").innerText = "შერიფის ფაზა: შეამოწმე მოთამაშე.";
        } else {
          $("phase-small-text").innerText = "ღამეა. მოქალაქე ელოდება დილის დადგომას.";
        }

        startTimer(60);
      } else if (currentPhase === "day") {
        document.body.classList.add("day-mode");

        $("game-phase").innerText = "დღე";
        $("phase-big-text").innerText = "დღე";
        $("phase-small-text").innerText = "ყველას ხმა ისმის. იმსჯელეთ და იპოვეთ მაფია.";

        startTimer(45);
      } else if (currentPhase === "vote") {
        document.body.classList.add("day-mode");

        $("game-phase").innerText = "ხმის მიცემა";
        $("phase-big-text").innerText = "ხმის მიცემა";
        $("phase-small-text").innerText = "აირჩიე მოთამაშე, ვის გაგდებასაც უჭერ მხარს.";

        startTimer(30);
      } else if (currentPhase === "ended") {
        $("game-phase").innerText = "დასრულდა";
        $("phase-big-text").innerText = "თამაში დასრულდა";
        $("phase-small-text").innerText = "შედეგი გამოჩნდა ჩატში.";
        stopTimer();
      } else {
        $("game-phase").innerText = "მზადება";
        $("phase-big-text").innerText = "მზადება";
        $("phase-small-text").innerText = "ჰოსტმა უნდა დააჭიროს START GAME.";
        stopTimer();
      }
    }

    function updateVoiceByPhase() {
      const iAmMafia = myRole === "mafia" || myRole === "don";

      Object.keys(peers).forEach(peerId => {
        const video = $("v-" + peerId);
        if (!video) return;

        const peerIsMafia = mafiaIds.includes(peerId);

        if (currentPhase === "night") {
          if (iAmMafia && peerIsMafia) {
            video.muted = false;
            video.volume = 1;
          } else {
            video.muted = true;
            video.volume = 0;
          }
        } else {
          video.muted = false;
          video.volume = 1;
        }
      });

      const myVideo = $("v-" + socket.id);
      if (myVideo) {
        myVideo.muted = true;
        myVideo.volume = 0;
      }
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSeconds = seconds;
      updateTimerText();

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerText();

        if (timerSeconds <= 0) clearInterval(timerInterval);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      $("game-timer").innerText = "00:00";
    }

    function updateTimerText() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
      const s = String(timerSeconds % 60).padStart(2, "0");
      $("game-timer").innerText = `${m}:${s}`;
    }

    function updateAliveCount() {
      const count = alivePlayers.filter(p => p.alive).length;
      $("alive-count").innerText = `${count} ცოცხალი`;
    }

    function updateDeadVideos() {
      alivePlayers.forEach(p => {
        const box = $(p.id);
        if (!box) return;

        box.classList.toggle("dead", !p.alive);

        const old = box.querySelector(".dead-badge");
        if (old) old.remove();

        if (!p.alive) {
          const badge = document.createElement("div");
          badge.className = "dead-badge";
          badge.innerText = "DEAD";
          box.appendChild(badge);
        }
      });
    }

    function renderActionPanel() {
      const panel = $("action-panel");
      const box = $("players-actions");
      const title = $("action-title");

      box.innerHTML = "";

      const me = alivePlayers.find(p => p.id === socket.id);

      if (!me || !me.alive || currentPhase === "ended") {
        panel.classList.add("hidden");
        return;
      }

      const otherAlive = alivePlayers.filter(p => p.alive && p.id !== socket.id);
      const allAlive = alivePlayers.filter(p => p.alive);

      if (currentPhase === "night") {
        if (myRole === "mafia" || myRole === "don") {
          panel.classList.remove("hidden");
          title.innerText = "მაფიის ღამე — აირჩიე მსხვერპლი";
          otherAlive.forEach(p => addActionButton(p, "kill", "მოკვლა"));
          return;
        }

        if (myRole === "doctor") {
          panel.classList.remove("hidden");
          title.innerText = "ექიმის ღამე — აირჩიე გადასარჩენი";
          allAlive.forEach(p => addActionButton(p, "save", "გადარჩენა"));
          return;
        }

        if (myRole === "sheriff") {
          panel.classList.remove("hidden");
          title.innerText = "შერიფის ღამე — შეამოწმე მოთამაშე";
          otherAlive.forEach(p => addActionButton(p, "check", "შემოწმება"));
          return;
        }

        panel.classList.remove("hidden");
        title.innerText = "ღამეა — დაელოდე დილას";
        box.innerHTML = `<div class="msg">შენ მოქალაქე ხარ. ღამით მოქმედება არ გაქვს.</div>`;
        return;
      }

      if (currentPhase === "vote") {

    function renderTicTacToe() {
      const board = $("ttt-board");
      board.innerHTML = "";

      tttBoard.forEach((value, index) => {
        const cell = document.createElement("div");
        cell.className = "ttt-cell";
        cell.innerText = value;
        cell.onclick = () => playTicTacToe(index);
        board.appendChild(cell);
      });

      $("ttt-status").innerText = tttFinished ? $("ttt-status").innerText : `Turn: ${tttTurn}`;
    }

    function playTicTacToe(index) {
      if (tttFinished || tttBoard[index]) return;

      tttBoard[index] = tttTurn;

      const winner = getTicTacToeWinner();

      if (winner) {
        tttFinished = true;
        $("ttt-status").innerText = `Winner: ${winner}`;
      } else if (tttBoard.every(Boolean)) {
        tttFinished = true;
        $("ttt-status").innerText = "Draw";
      } else {
        tttTurn = tttTurn === "X" ? "O" : "X";
        $("ttt-status").innerText = `Turn: ${tttTurn}`;
      }

      renderTicTacToe();
    }

    function getTicTacToeWinner() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      for (const [a,b,c] of wins) {
        if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
          return tttBoard[a];
        }
      }

      return null;
    }

      tttBoard = Array(9).fill("");

      <h3>Tic Tac Toe</h3>
      <div class="mini-status" id="adv-ttt-status">${adv.ttt.done ? "Finished" : "Turn: " + adv.ttt.turn}</div>
      <div class="ttt-board" id="adv-ttt-board"></div>
      <button class="game-btn" id="adv-ttt-reset">RESET</button>
    `;
    const board = A("adv-ttt-board");
    adv.ttt.board.forEach((v,i) => {
      const c = document.createElement("div");
      c.className = "ttt-cell";
      c.innerText = v;
      c.onclick = () => {
        if (adv.ttt.done || adv.ttt.board[i]) return;
        adv.ttt.board[i] = adv.ttt.turn;
        const w = tttWinner(adv.ttt.board);
        if (w) {
          adv.ttt.done = true;
          sys("Tic Tac Toe winner: " + w);
        } else if (adv.ttt.board.every(Boolean)) {
          adv.ttt.done = true;
          sys("Tic Tac Toe draw");
        } else {
          adv.ttt.turn = adv.ttt.turn === "X" ? "O" : "X";
        }
        renderTTT(root);
      };
      board.appendChild(c);
    });
    A("adv-ttt-reset").onclick = () => {
      adv.ttt = { board:Array(9).fill(""), turn:"X", done:false };
      renderTTT(root);
    };
  }

  function tttWinner(b){
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,c,d] of wins) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    return null;
  }

  function renderRPS(root){
    root.innerHTML = `
      <h3>Rock Paper Scissors</h3>
      <div id="rps-output" class="game-output">Choose your move</div>
      <div class="rps-grid">
        <button data-rps="Rock">ROCK</button>
        <button data-rps="Paper">PAPER</button>
        <button data-rps="Scissors">SCISSORS</button>
      </div>
    `;
    root.querySelectorAll("[data-rps]").forEach(b => b.onclick = () => {
      const cpu = ["Rock","Paper","Scissors"][Math.floor(Math.random()*3)];
      const me = b.dataset.rps;
      let res = "Draw";
      if ((me==="Rock"&&cpu==="Scissors")||(me==="Paper"&&cpu==="Rock")||(me==="Scissors"&&cpu==="Paper")) res = "You win";
      else if (me !== cpu) res = "You lose";
      A("rps-output").innerText = `${me} vs ${cpu} — ${res}`;
      sys(`RPS: ${me} vs ${cpu} — ${res}`);
    });
  }

  function renderTruth(root){
    root.innerHTML = `
      <h3>Truth / Dare</h3>
      <div id="truth-output" class="game-output">Choose Truth or Dare</div>
      <div class="admin-grid">
        <button class="admin-mini-btn good" id="adv-truth">TRUTH</button>
        <button class="admin-mini-btn warn" id="adv-dare">DARE</button>
      </div>
    `;
    A("adv-truth").onclick = () => pickTD("truth");
    A("adv-dare").onclick = () => pickTD("dare");
  }

  function pickTD(type){
    const list = type === "truth" ? truth : dare;
    const picked = list[Math.floor(Math.random()*list.length)];
    A("truth-output").innerText = picked;
    sys((type === "truth" ? "TRUTH: " : "DARE: ") + picked);
  }

  function renderDice(root){
    root.innerHTML = `
      <h3>Dice Duel</h3>
      <div id="dice-output" class="game-output" style="font-size:2rem;">?</div>
      <button class="game-btn" id="dice-roll-adv">ROLL TWO DICE</button>
    `;
    A("dice-roll-adv").onclick = () => {
      const a = Math.floor(Math.random()*6)+1;
      const b = Math.floor(Math.random()*6)+1;
      A("dice-output").innerText = `${a} + ${b} = ${a+b}`;
      sys(`Dice Duel: ${a} + ${b} = ${a+b}`);
    };
  }

  function renderWheel(root){
    root.innerHTML = `
      <h3>Spin Wheel</h3>
      <div class="wheel" id="spin-wheel"></div>
      <div id="wheel-output" class="game-output">Spin to select a challenge</div>
      <button class="game-btn" id="wheel-spin">SPIN</button>
    `;
    A("wheel-spin").onclick = () => {
      const options = ["Truth", "Dare", "Suspect someone", "Defend someone", "Skip turn", "Ask a question"];
      const picked = options[Math.floor(Math.random()*options.length)];
      adv.wheelDeg += 720 + Math.floor(Math.random()*360);
      A("spin-wheel").style.transform = `rotate(${adv.wheelDeg}deg)`;
      setTimeout(() => {
        A("wheel-output").innerText = picked;
        sys("Spin Wheel: " + picked);
      }, 850);
    };
  }

  function renderQuiz(root){
    const q = quiz[adv.quizIndex % quiz.length];
    root.innerHTML = `
      <h3>Mafia Quiz</h3>
      <div class="game-output">${safe(q.q)}</div>
      <div class="quiz-options">
        ${q.a.map((x,i)=>`<button data-q="${i}">${safe(x)}</button>`).join("")}
      </div>
      <div class="mini-status">Score: ${adv.quizScore}</div>
    `;
    root.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      if (Number(b.dataset.q) === q.ok) {
        adv.quizScore++;
        sys("Quiz: Correct");
      } else {
        sys("Quiz: Wrong");
      }
      adv.quizIndex++;
      renderQuiz(root);
    });
  }

  function renderMemory(root){
    if (!adv.memory.deck.length) resetMemory();
    root.innerHTML = `
      <h3>Memory Match</h3>
      <div class="memory-grid" id="memory-grid"></div>
      <button class="game-btn" id="memory-reset" style="margin-top:10px;">RESET</button>
    `;
    const grid = A("memory-grid");
    adv.memory.deck.forEach((v,i)=>{
      const card = document.createElement("div");
      card.className = "memory-card";
      const shown = adv.memory.open.includes(i) || adv.memory.matched.includes(i);
      card.innerText = shown ? v : "?";
      card.onclick = () => openMemory(i);
      grid.appendChild(card);
    });
    A("memory-reset").onclick = () => { resetMemory(); renderMemory(root); };
  }

  function resetMemory(){
    const items = ["M","M","D","D","S","S","C","C"];
    adv.memory.deck = items.sort(()=>Math.random()-.5);
    adv.memory.open = [];
    adv.memory.matched = [];
  }

  function openMemory(i){
    if (adv.memory.open.includes(i) || adv.memory.matched.includes(i)) return;
    if (adv.memory.open.length >= 2) adv.memory.open = [];
    adv.memory.open.push(i);
    if (adv.memory.open.length === 2) {
      const [a,b] = adv.memory.open;
      if (adv.memory.deck[a] === adv.memory.deck[b]) {
        adv.memory.matched.push(a,b);
        adv.memory.open = [];
        sys("Memory: match found");
      }
    }
    renderMemory(A("adv-game-root"));
  }

  function renderGuess(root){
    root.innerHTML = `
      <h3>Guess Number</h3>
      <div id="guess-output" class="game-output">Guess 1-20</div>
      <input id="guess-input" class="guess-input" type="number" min="1" max="20" placeholder="1-20">
      <button class="game-btn" id="guess-btn">GUESS</button>
      <button class="game-btn" id="guess-reset" style="background:#1b2144; margin-top:7px;">NEW NUMBER</button>
    `;
    A("guess-btn").onclick = () => {
      const n = Number(A("guess-input").value);
      if (!n) return;
      const msg = n === adv.guess.number ? "Correct" : n < adv.guess.number ? "Higher" : "Lower";
      A("guess-output").innerText = msg;
      sys("Guess Number: " + msg);
    };
    A("guess-reset").onclick = () => {
      adv.guess.number = Math.floor(Math.random()*20)+1;
      A("guess-output").innerText = "New number ready";
    };
  }

  function renderWould(root){
    root.innerHTML = `
      <h3>Who Would?</h3>
      <div id="would-output" class="game-output">Generate a question</div>
      <button class="game-btn" id="would-btn">GENERATE</button>
    `;
    A("would-btn").onclick = () => {
      const q = would[Math.floor(Math.random()*would.length)];
      A("would-output").innerText = q;
      sys("Who Would: " + q);
    };
  }

  function renderSound(root){
    root.innerHTML = `
      <h3>Soundboard / Textboard</h3>
      <div class="soundboard-grid">
        <button data-sound="Suspicious...">SUS</button>
        <button data-sound="Dramatic reveal!">REVEAL</button>
        <button data-sound="Objection!">OBJECTION</button>
        <button data-sound="Good game.">GG</button>
        <button data-sound="Emergency meeting energy.">ALARM</button>
        <button data-sound="Void silence...">VOID</button>
      </div>
    `;
    root.querySelectorAll("[data-sound]").forEach(b => b.onclick = () => {
      emitChat("[SOUNDBOARD] " + b.dataset.sound);
    });
  }

  // Compatible server-less admin action descriptions.
  const oldAdminAction = window.adminAction;
  window.adminAction = function(action, targetId = null, message = ""){
    if (typeof isHost !== "undefined" && !isHost) {
      alert("მხოლოდ ადმინს შეუძლია");
      return;
    }
    if (["skip-phase","pause-game","revive-all"].includes(action)) {
      if (typeof socket !== "undefined") {
        socket.emit("admin-action", { room: currentRoom, action, targetId, message });
      }
      sys("Admin action sent: " + action);
      return;
    }
    if (typeof oldAdminAction === "function") return oldAdminAction(action, targetId, message);
  };
})();
</script>

</body>
</html>
