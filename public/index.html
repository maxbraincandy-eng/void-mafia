<style>
    /* Void Mafia - Unique Industrial Style */
    :root { 
        --void-red: #e84118; 
        --void-black: #0b0c10; 
        --void-grey: #1f2833; 
        --void-cyan: #66fcf1; /* ცოტა "ციფრული" ელფერი */
    }
    
    body { background: var(--void-black); color: #c5c6c7; font-family: 'Segoe UI', sans-serif; margin: 0; }

    /* Header Profile - სუფთა დიზაინი */
    .user-header {
        background: #121417; padding: 15px 20px; display: flex; align-items: center;
        border-bottom: 1px solid #2c3e50; width: 100%; box-sizing: border-box;
    }
    .avatar-frame { 
        width: 45px; height: 45px; border-radius: 8px; 
        border: 1px solid var(--void-red); margin-right: 15px; 
        background: #1a1a1a; display: flex; align-items: center; justify-content: center;
    }
    .user-info-text { text-align: left; flex-grow: 1; }
    .user-name { font-weight: 600; font-size: 16px; color: #fff; display: block; }
    .user-status { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

    /* Lobby Tabs */
    .nav-tabs {
        position: fixed; bottom: 0; width: 100%; background: #0f1113;
        display: flex; justify-content: space-around; padding: 12px 0; 
        border-top: 1px solid #222; z-index: 100;
    }
    .tab-item { color: #555; font-size: 10px; cursor: pointer; text-align: center; transition: 0.3s; }
    .tab-item.active { color: var(--void-red); }

    /* Room Card - უნიკალური ვიზუალი */
    .room-card {
        background: #161b22; margin: 12px; padding: 18px; border-radius: 10px;
        display: flex; justify-content: space-between; align-items: center;
        border: 1px solid #30363d; transition: 0.2s;
    }
    .room-card:hover { border-color: var(--void-red); }
    .room-details h3 { margin: 0; font-size: 15px; color: #f0f6fc; }
    .room-details span { font-size: 11px; color: #8b949e; }
    
    .join-btn { 
        background: transparent; border: 1px solid var(--void-red); color: var(--void-red); 
        padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.3s;
    }
    .join-btn:hover { background: var(--void-red); color: white; }

    /* Login Screen */
    .mafia-logo-large { 
        font-size: 45px; font-weight: 800; color: white; 
        letter-spacing: 8px; margin-bottom: 30px; text-shadow: 2px 2px var(--void-red);
    }
</style>

<div id="auth-screen" class="screen">
    <div class="login-box">
        <div class="mafia-logo-large">VOID</div>
        <div class="auth-card">
            <input type="text" id="nickname" placeholder="სახელი">
            <button id="loginBtn" class="btn">შესვლა</button>
        </div>
    </div>
</div>

<div id="lobby-screen" style="display:none;">
    <div class="user-header">
        <div class="avatar-frame">👤</div>
        <div class="user-info-text">
            <span class="user-name" id="display-nick">მოთამაშე</span>
            <span class="user-status" id="user-tier">მოთამაშე</span>
        </div>
        <div id="online-count" style="font-size: 10px; color: #444;">ონლაინ: 1</div>
    </div>

    <div id="room-list" style="padding: 10px; padding-bottom: 80px;">
        </div>

    <div style="padding: 0 20px;">
        <input type="text" id="newRoomName" placeholder="ახალი ოთახის სახელი" style="margin-bottom: 10px;">
        <button id="createRoomBtn" class="btn" style="background: var(--void-red);">ოთახის შექმნა</button>
    </div>

    <div class="nav-tabs">
        <div class="tab-item active">🏠<br>LOBBY</div>
        <div class="tab-item">👥<br>ROOMS</div>
        <div class="tab-item">⚙️<br>SETTINGS</div>
    </div>
</div>
