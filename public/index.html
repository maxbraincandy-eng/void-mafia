<!doctype html><html lang="ka"><head><meta charset="utf-8"><title>VOID MAFIA v16</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="/css/app.css"></head><body><div id="toast"></div><div class="powered">powered by <b>ბატონი მაქსი.</b></div><section id="auth" class="screen center"><div class="card auth-card"><div class="logo">VM</div><h1>VOID MAFIA</h1><p>Rooms · Clans · Voice · Seasons</p><div class="tabs"><button data-tab="guest" class="active">Guest</button><button data-tab="login">Login</button><button data-tab="register">Register</button></div><div id="guestForm" class="form"><input id="guestNick" placeholder="ნიკნეიმი"><input id="guestAvatar" value="◆"><button id="guestBtn" class="primary">შესვლა</button></div><div id="loginForm" class="form hidden"><input id="loginEmail" placeholder="Email"><input id="loginPass" type="password" placeholder="Password"><button id="loginBtn" class="primary">Login</button></div><div id="registerForm" class="form hidden"><input id="regNick" placeholder="ნიკნეიმი"><input id="regEmail" placeholder="Email"><input id="regPass" type="password" placeholder="Password"><button id="registerBtn" class="primary">Register</button></div></div></section><section id="app" class="screen hidden"><header class="topbar"><button>☰</button><div><h2 id="pageTitle">Rooms</h2><small id="userLine">VOID</small></div><button id="refreshBtn">↻</button></header><main><section id="pageRooms" class="page active"><div class="season card"><b>Season 1 · Silence of the Void</b><div class="bar"><i style="width:45%"></i></div></div><div class="actions-row"><button id="joinByCodeBtn">JOIN BY NUMBER</button><button id="hostGameBtn" class="primary">HOST GAME</button></div><div id="roomCreate" class="card hidden"><input id="roomName" value="VOID TABLE"><div class="grid2"><input id="maxPlayers" type="number" value="10"><input id="roomLanguage" value="Georgian"></div><button id="createRoomBtn" class="primary">Create</button></div><div class="section-title"><b>Rooms</b><span id="roomsCount">0</span></div><div id="roomsList" class="list"></div></section><section id="pageClans" class="page"><div class="card"><h3>Create Clan</h3><input id="clanName" placeholder="Clan name"><input id="clanTag" placeholder="Tag"><button id="createClanBtn" class="primary">Create Clan</button></div><div id="clansList" class="list"></div></section><section id="pageLeaderboard" class="page"><div class="card"><h3>Leaderboard</h3><div id="leaderboard" class="list"></div></div></section><section id="pageStore" class="page"><div class="card"><h3>Store</h3><div id="storeList" class="list"></div></div></section><section id="pageProfile" class="page"><div class="card profile"><div class="avatar" id="profileAvatar">◆</div><h2 id="profileName">Player</h2><p id="profileId">ID</p><div class="grid2 stats"><div><b id="statXp">0</b><span>XP</span></div><div><b id="statRating">5.0</b><span>Rating</span></div><div><b id="statWins">0</b><span>Wins</span></div><div><b id="statGames">0</b><span>Games</span></div></div><input id="editNick"><input id="editAvatar"><button id="saveProfileBtn" class="primary">Save Profile</button></div></section></main><nav class="bottom"><button onclick="showPage('Rooms')" class="active">Games</button><button onclick="showPage('Clans')">Clans</button><button onclick="showPage('Leaderboard')">Rank</button><button onclick="showPage('Store')">Store</button><button onclick="showPage('Profile')">Profile</button></nav></section><section id="game" class="screen hidden"><header class="gamebar"><button id="leaveBtn" class="danger">×</button><div><b id="phaseName">Lobby</b><small id="phaseInfo">0/0</small></div><div><b id="timer">00:00</b><small>time</small></div><button id="chatTopBtn">CHAT</button><button id="roomTopBtn">ROOM</button></header><div id="lobbyView"><div class="card room-head"><h2 id="gameRoomName">VOID TABLE</h2><p id="gameRoomInfo">Lobby</p><button id="settingsBtn">ROOM</button><button id="startBtn" class="primary">START</button><button id="nextPhaseBtn">NEXT</button></div><div class="card"><div class="section-title"><b>Players</b><span id="playersCount">0/0</span></div><div id="playersList" class="list"></div></div></div><div id="videoGrid" class="video-grid hidden"></div><div id="chatPanel" class="panel hidden"><div class="panel-head"><b>Chat</b><button onclick="hide('chatPanel')">×</button></div><div id="chatMessages" class="scroll"></div><div class="send"><input id="chatInput" placeholder="Message"><button id="sendChatBtn">➤</button></div><div id="mafiaChatBox" class="hidden"><b>Mafia Walkie-Talkie</b><div id="mafiaMessages" class="scroll small"></div><div class="send"><input id="mafiaInput" placeholder="Mafia private"><button id="sendMafiaBtn">➤</button></div></div></div><div id="settingsModal" class="modal hidden"><div class="modal-card"><button onclick="hide('settingsModal')" class="x">×</button><h2>Room Settings</h2><div class="grid2"><label>Max<input id="setMaxPlayers" type="number" value="10"></label><label>Night<input id="setNight" type="number" value="45"></label><label>Day<input id="setDay" type="number" value="90"></label><label>Vote<input id="setVote" type="number" value="35"></label></div><h3>Roles</h3><div id="roleSettings" class="grid2"></div><button id="saveSettingsBtn" class="primary">Save</button></div></div><div id="playerModal" class="modal hidden"><div class="modal-card"><button onclick="hide('playerModal')" class="x">×</button><div id="playerProfile"></div></div></div></section><script src="/socket.io/socket.io.js"></script><script src="/js/app.js"></script></body></html>
