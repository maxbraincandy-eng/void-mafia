<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID MAFIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff6b00;
            --bg: #030305;
            --grid: rgba(255, 107, 0, 0.1);
        }
        body {
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* რეტრო ბადის ეფექტი */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
        }
        .card {
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid var(--orange);
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px var(--orange);
        }
        h1 { font-family: 'Bebas Neue'; letter-spacing: 5px; margin-bottom: 20px; }
        .terminal {
            background: #000;
            color: var(--orange);
            font-family: 'Share Tech Mono';
            font-size: 12px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: left;
            border-left: 3px solid var(--orange);
        }
        input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            border-bottom: 2px solid var(--orange);
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--orange);
            border: none;
            color: black;
            font-family: 'Bebas Neue';
            font-size: 18px;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
        .hidden { display: none; }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 90vw; }
        .video-box { background: #000; border: 1px solid var(--orange); aspect-ratio: 1; }
    </style>
</head>
<body>

<div id="login-screen" class="card">
    <h1>VOID MAFIA</h1>
    <div class="terminal" id="status">> SYSTEM_READY: AWAITING_SIGNAL...</div>
    <input type="text" id="nickname" placeholder="// OPERATOR_ID">
    <button class="btn" onclick="connectToVoid()">შესვლა</button>
</div>

<div id="game-screen" class="hidden" style="width: 100%; padding: 20px;">
    <div id="video-grid"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    let socket;

    function connectToVoid() {
        const nick = document.getElementById('nickname').value.trim();
        const status = document.getElementById('status');
        
        if (!nick) {
            status.innerText = "> ERROR: ID_REQUIRED";
            return;
        }

        status.innerText = "> SYNCING_WITH_CORE...";

        // ვუკავშირდებით სერვერს
        socket = io();

        socket.on('connect', () => {
            status.innerText = "> CONNECTION_ESTABLISHED";
            
            // გადავდივართ სათამაშო ეკრანზე
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // ვქმნით ოთახს ავტომატურად (ტესტისთვის)
            socket.emit('create_room', { roomCode: 'VOID_1', playerName: nick });
        });

        socket.on('room_update', (room) => {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "";
            room.players.forEach(p => {
                const box = document.createElement('div');
                box.className = 'video-box';
                box.innerHTML = `<div style="padding:10px; color:var(--orange)">${p.name}</div>`;
                grid.appendChild(box);
            });
        });

        socket.on('connect_error', () => {
            status.innerText = "> SYSTEM_ERROR: CONNECTION_REFUSED";
        });
    }
</script>
</body>
</html>
