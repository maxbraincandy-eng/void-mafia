<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOID PORTAL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="portal-shell">
    <section class="hero panel">
      <div class="hero-top">
        <span class="eyebrow">PRIVATE SOCIAL GAME HUB</span>
        <span class="powered-by">powered by ბატონი მაქსი</span>
      </div>

      <h1 class="glitch" data-text="VOID PORTAL">VOID PORTAL</h1>
      <p class="subtitle">Enter the room. Choose the game. Trust nobody.</p>
    </section>

    <section class="panel form-panel">
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" value="max" />
      </div>

      <div class="field-group">
        <label for="roomCode">Room Code</label>
        <input type="text" id="roomCode" placeholder="Enter room code" value="373828" />
      </div>

      <div class="field-group">
        <label>Choose Space</label>

        <input type="hidden" id="space" value="lounge" />

        <div class="space-grid">
          <button type="button" class="space-card active" data-space="lounge">
            <span class="space-title">Void Lounge</span>
            <span class="space-desc">Chat, chill, gather players</span>
          </button>

          <button type="button" class="space-card" data-space="mafia">
            <span class="space-title">Mafia Lite</span>
            <span class="space-desc">Roles, lobby, future day/night</span>
          </button>

          <button type="button" class="space-card" data-space="confession">
            <span class="space-title">Confession Room</span>
            <span class="space-desc">Anonymous secrets and reveal</span>
          </button>

          <button type="button" class="space-card" data-space="truth">
            <span class="space-title">Truth or Dare</span>
            <span class="space-desc">Spin a player and play</span>
          </button>

          <button type="button" class="space-card" data-space="debate">
            <span class="space-title">Debate Arena</span>
            <span class="space-desc">Topics, timer, audience votes</span>
          </button>

          <button type="button" class="space-card" data-space="mystery">
            <span class="space-title">Mystery Room</span>
            <span class="space-desc">Detective, liar, clues</span>
          </button>
        </div>
      </div>

      <button id="joinBtn" class="primary-btn" type="button">Create / Join Room</button>
    </section>

    <section class="panel room-panel">
      <div class="room-topbar">
        <div>
          <div class="mini-label">CURRENT SPACE</div>
          <div id="currentSpace" class="room-value">Void Lounge</div>
        </div>

        <div>
          <div class="mini-label">ROOM</div>
          <div id="currentRoom" class="room-value">VOID</div>
        </div>

        <div class="room-actions">
          <button id="startBtn" class="ghost-btn" type="button">Start</button>
          <button id="leaveBtn" class="ghost-btn danger" type="button">Leave</button>
        </div>
      </div>

      <div class="room-grid">
        <div class="sub-panel">
          <div class="sub-panel-title">Players</div>
          <ul id="playersList" class="players-list">
            <li>No players yet</li>
          </ul>
        </div>

        <div class="sub-panel">
          <div class="sub-panel-title">Chat</div>
          <div id="chatMessages" class="chat-box"></div>

          <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="Type a message..." />
            <button id="sendBtn" class="primary-btn small" type="button">Send</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>

  <script>
    const spaceCards = document.querySelectorAll(".space-card");
    const hiddenSpaceInput = document.getElementById("space");
    const currentSpace = document.getElementById("currentSpace");

    const prettyNames = {
      lounge: "Void Lounge",
      mafia: "Mafia Lite",
      confession: "Confession Room",
      truth: "Truth or Dare",
      debate: "Debate Arena",
      mystery: "Mystery Room"
    };

    spaceCards.forEach(card => {
      card.addEventListener("click", () => {
        spaceCards.forEach(c => c.classList.remove("active"));
        card.classList.add("active");

        const selected = card.dataset.space;
        hiddenSpaceInput.value = selected;

        if (currentSpace) {
          currentSpace.textContent = prettyNames[selected] || selected;
        }
      });
    });
  </script>
</body>
</html>
