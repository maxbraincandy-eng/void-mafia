<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID MAFIA // VAPOR VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #ff00ff;
            --cyan: #00ffff;
            --bg: #07020f;
            --card-bg: rgba(14, 5, 32, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            /* Vaporwave Grid ეფექტი ფონზე */
            background-image: linear-gradient(to bottom, transparent 50%, rgba(255, 0, 255, 0.05) 50%), 
                              linear-gradient(to right, transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 40px 40px;
        }

        .glitch-title {
            font-family: 'Orbitron';
            font-size: clamp(1.8rem, 10vw, 3rem);
            color: var(--cyan);
            text-shadow: 0 0 15px var(--cyan), 2px 2px var(--neon);
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
        }

        .powered {
            font-size: 0.8rem;
            color: #6a4a8a;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--neon);
            padding: 2.5rem 1.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon);
            color: white;
            padding: 18px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--neon);
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 1rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--cyan);
            box-shadow: 0 0 25px var(--cyan);
            color: black;
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .video-box {
            border: 2px solid var(--neon);
            background: #000;
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            font-size: 0.8rem;
            border-left: 3px solid var(--cyan);
            color: var(--cyan);
        }

        .controls {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .hidden { display: none !important; }

        #room-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
        }

        /* Ambient BGM */
        audio { display: none; }
    </style>
</head>
<body>

    <audio id="ambient-bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <h1 class="glitch-title">VOID MAFIA</h1>
    <div class="powered">Powered by ბატონი მაქსი</div>

    <div id="login-screen" class="card">
        <input type="text" id="nickname" placeholder="შეიყვანე ნიკნეიმი" autocomplete="off">
        <button class="btn" onclick="showRooms()">შესვლა</button>
    </div>

    <div id="rooms-screen" class="card hidden">
        <input type="text" id="room-id" placeholder="ოთახის ID" autocomplete="off">
        <button class="btn" onclick="startVoid()">ოთახის შექმნა</button>
        <div style="margin: 10px 0; color: var(--cyan); font-size: 0.8rem; letter-spacing: 1px;">// აქტიური სიხშირეები</div>
        <div id="room-list"></div>
    </div>

    <div id="game-screen" class="hidden" style="width: 100%;">
        <div id="video-grid"></div>
        <div class="controls">
            <button class="btn" style="width: auto; padding: 12px 20px;" onclick="toggleMic()">MIC</button>
            <button class="btn" style="width: auto; padding: 12px 20px; background: var(--cyan); color: black;" onclick="toggleCam()">CAM</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        const socket = io();
        let localStream, myNick;
        const peers = {};

        function showRooms() {
            myNick = document.getElementById('nickname').value.trim();
            if (!myNick) return alert("ჩაწერე ნიკი");

            const bgm = document.getElementById('ambient-bgm');
            bgm.volume = 0.25;
            bgm.play().catch(e => console.log("Audio Playback Blocked"));

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('rooms-screen').classList.remove('hidden');
            socket.emit('get-rooms');
        }

        async function startVoid(roomFromList) {
            const rid = roomFromList || document.getElementById('room-id').value.trim();
            if (!rid) return alert("ჩაწერე ოთახის ID");

            document.getElementById('ambient-bgm').pause();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                document.getElementById('rooms-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                
                addVideo('me', localStream, myNick + " (YOU)", true);
                socket.emit('join-room', rid, myNick);
            } catch (e) { 
                alert("კამერაზე წვდომა უარყოფილია!"); 
            }
        }

        socket.on('update-room-list', rooms => {
            const list = document.getElementById('room-list');
            list.innerHTML = rooms.length > 0 ? 
                rooms.map(r => `<button class="btn" style="margin-bottom:8px; background:none; border:1px solid var(--cyan); color:var(--cyan); font-size:0.8rem;" onclick="startVoid('${r.code}')">სიგნალი: ${r.code} [${r.playerCount}/10]</button>`).join('') :
                '<div style="color:#6a4a8a; font-size:0.8rem; margin-top:10px;">სიგნალები არ მოიძებნა...</div>';
        });

        socket.on('all-users', users => {
            users.forEach(id => {
                const peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                peer.on('signal', signal => socket.emit('sending-signal', { userToSignal: id, callerID: socket.id, signal }));
                peer.on('stream', stream => addVideo(id, stream, "OPERATOR"));
                peers[id] = peer;
            });
        });

        socket.on('user-joined', p => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            peer.on('signal', signal => socket.emit('returning-signal', { signal, callerID: p.callerID }));
            peer.on('stream', stream => addVideo(p.callerID, stream, "OPERATOR"));
            peer.signal(p.signal);
            peers[p.callerID] = peer;
        });

        socket.on('receiving-returned-signal', p => {
            if(peers[p.id]) peers[p.id].signal(p.signal);
        });
        
        socket.on('user-left', id => {
            if(peers[id]) peers[id].destroy();
            delete peers[id];
            document.getElementById(id)?.remove();
        });

        function addVideo(id, stream, name, mute = false) {
            if (document.getElementById(id)) return;
            const grid = document.getElementById('video-grid');
            const div = document.createElement('div');
            div.id = id; div.className = 'video-box';
            div.innerHTML = `<video id="v-${id}" autoplay playsinline ${mute?'muted':''}></video><div class="video-label">${name}</div>`;
            grid.appendChild(div);
            document.getElementById(`v-${id}`).srcObject = stream;
        }

        function toggleMic() { 
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            console.log("MIC:", track.enabled);
        }
        function toggleCam() { 
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            console.log("CAM:", track.enabled);
        }
    </script>
</body>
</html>
