<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID MAFIA // VAPOR VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #ff00ff;
            --cyan: #00ffff;
            --bg: #07020f;
            --card-bg: rgba(14, 5, 32, 0.95);
            --red: #ff3e3e;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            background-image: linear-gradient(to bottom, transparent 50%, rgba(255, 0, 255, 0.05) 50%), 
                              linear-gradient(to right, transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 40px 40px;
        }

        .glitch-title {
            font-family: 'Orbitron';
            font-size: clamp(1.8rem, 10vw, 3rem);
            color: var(--cyan);
            text-shadow: 0 0 15px var(--cyan), 2px 2px var(--neon);
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
        }

        .powered {
            font-size: 0.8rem;
            color: #6a4a8a;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--neon);
            padding: 2rem 1.2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon);
            color: white;
            padding: 15px;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--neon);
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            background: var(--cyan);
            box-shadow: 0 0 25px var(--cyan);
            color: black;
        }

        .btn.off {
            background: #333 !important;
            color: #777 !important;
            box-shadow: none !important;
            border: 1px solid #444;
        }

        .btn-leave {
            background: var(--red) !important;
            box-shadow: 0 0 15px var(--red);
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            padding: 5px;
            margin-bottom: 80px;
        }

        .video-box {
            border: 2px solid var(--neon);
            background: #000;
            position: relative;
            aspect-ratio: 1/1;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            font-size: 0.7rem;
            border-left: 2px solid var(--cyan);
            color: var(--cyan);
        }

        .controls {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(7, 2, 15, 0.8);
            padding: 10px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 0, 255, 0.2);
        }

        .hidden { display: none !important; }

        #room-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .room-item {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--cyan);
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.4);
        }

        .room-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .player-count {
            background: var(--neon);
            color: white;
            padding: 2px 8px;
            font-size: 0.8rem;
            font-family: 'Orbitron';
        }

        #chat-panel {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--card-bg);
            border-left: 2px solid var(--neon);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        #chat-panel.open {
            right: 0;
        }

        #chat-header {
            padding: 15px;
            background: var(--neon);
            font-family: 'Orbitron';
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }

        .msg {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-left: 2px solid var(--cyan);
        }

        #chat-input-area {
            padding: 10px;
            border-top: 1px solid rgba(255,0,255,0.3);
            display: flex;
            gap: 5px;
        }

        #chat-toggle {
            position: fixed;
            right: 20px;
            bottom: 30px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--neon);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 0 15px var(--neon);
            font-size: 1.2rem;
        }

        audio { display: none; }
    </style>
</head>
<body>

    <audio id="ambient-bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <h1 class="glitch-title">VOID MAFIA</h1>
    <div class="powered">Powered by ბატონი მაქსი</div>

    <div id="login-screen" class="card">
        <input type="text" id="nickname" placeholder="შეიყვანე ნიკნეიმი" autocomplete="off">
        <button class="btn" onclick="showRooms()">შესვლა</button>
    </div>

    <div id="rooms-screen" class="card hidden">
        <input type="text" id="room-id" placeholder="ოთახის ID" autocomplete="off">
        <button class="btn" onclick="startVoid()">ოთახის შექმნა</button>
        <div style="margin: 10px 0; color: var(--cyan); font-size: 0.8rem; letter-spacing: 1px;">// აქტიური სიხშირეები</div>
        <div id="room-list"></div>
    </div>

    <div id="game-screen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div id="video-grid"></div>
        <div id="chat-toggle" onclick="toggleChat()">💬</div>
        <div class="controls">
            <button id="mic-btn" class="btn" style="width: 60px;" onclick="toggleMic()">MIC</button>
            <button id="cam-btn" class="btn" style="width: 60px; background: var(--cyan); color: black;" onclick="toggleCam()">CAM</button>
            <button class="btn btn-leave" style="width: 60px;" onclick="leaveRoom()">EXIT</button>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-header">
            <span>VOID CHAT</span>
            <span style="cursor:pointer" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-msg" placeholder="დაწერე..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn" style="width: auto; padding: 10px;" onclick="sendMsg()">></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        let socket = io();
        let localStream, myNick, currentRoom;
        const peers = {};

        function showRooms() {
            myNick = document.getElementById('nickname').value.trim();
            if (!myNick) return alert("ჩაწერე ნიკი");

            const bgm = document.getElementById('ambient-bgm');
            bgm.volume = 0.25;
            bgm.play().catch(() => {});

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('rooms-screen').classList.remove('hidden');
            socket.emit('get-rooms');
        }

        async function startVoid(roomFromList) {
            currentRoom = roomFromList || document.getElementById('room-id').value.trim();
            if (!currentRoom) return alert("ჩაწერე ოთახის ID");

            document.getElementById('ambient-bgm').pause();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 400, height: 400 }, 
                    audio: true 
                });
                document.getElementById('rooms-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                
                addVideo(socket.id, localStream, myNick + " (შენ)", true);
                // ვაგზავნით ნიკნეიმსაც სერვერზე
                socket.emit('join-room', currentRoom, myNick);
            } catch (e) { 
                alert("კამერა/მიკროფონი მიუწვდომელია!"); 
            }
        }

        function leaveRoom() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            socket.emit('leave-room', currentRoom);
            socket.disconnect(); // სრული გათიშვა
            
            // UI წმენდა
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('rooms-screen').classList.remove('hidden');
            document.getElementById('video-grid').innerHTML = '';
            document.getElementById('chat-messages').innerHTML = '';
            
            Object.keys(peers).forEach(id => {
                peers[id].destroy();
                delete peers[id];
            });

            // რეკონექტი ლობისთვის
            socket = io();
            socket.emit('get-rooms');

            const bgm = document.getElementById('ambient-bgm');
            bgm.play().catch(() => {});
        }

        function toggleMic() { 
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('mic-btn').classList.toggle('off', !track.enabled);
        }

        function toggleCam() { 
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('cam-btn').classList.toggle('off', !track.enabled);
        }

        function toggleChat() {
            document.getElementById('chat-panel').classList.toggle('open');
        }

        function sendMsg() {
            const inp = document.getElementById('chat-msg');
            const txt = inp.value.trim();
            if(!txt) return;
            socket.emit('send-chat-msg', { room: currentRoom, name: myNick, text: txt });
            inp.value = '';
        }

        socket.on('receive-chat-msg', data => {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<b>${data.name}:</b> ${data.text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        socket.on('update-room-list', rooms => {
            const list = document.getElementById('room-list');
            list.innerHTML = rooms.length > 0 ? 
                rooms.map(r => `
                    <div class="room-item">
                        <div class="room-info">
                            <span style="color:var(--cyan);">ID: ${r.code}</span>
                            <span class="player-count">${r.playerCount}/10</span>
                        </div>
                        <button class="btn" style="padding: 5px;" onclick="startVoid('${r.code}')">JOIN</button>
                    </div>
                `).join('') : '<div style="color:#6a4a8a; font-size:0.8rem;">სიგნალი არ არის...</div>';
        });

        socket.on('all-users', users => {
            users.forEach(user => {
                const peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                peer.on('signal', signal => {
                    socket.emit('sending-signal', { 
                        userToSignal: user.id, 
                        callerID: socket.id, 
                        callerNick: myNick, 
                        signal 
                    });
                });
                peer.on('stream', stream => addVideo(user.id, stream, user.nick));
                peers[user.id] = peer;
            });
        });

        socket.on('user-joined', p => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            peer.on('signal', signal => {
                socket.emit('returning-signal', { signal, callerID: p.callerID });
            });
            peer.on('stream', stream => addVideo(p.callerID, stream, p.callerNick));
            peer.signal(p.signal);
            peers[p.callerID] = peer;
        });

        socket.on('receiving-returned-signal', p => {
            if(peers[p.id]) peers[p.id].signal(p.signal);
        });
        
        socket.on('user-left', id => {
            if(peers[id]) peers[id].destroy();
            delete peers[id];
            const videoElement = document.getElementById(id);
            if(videoElement) videoElement.remove();
        });

        function addVideo(id, stream, name, mute = false) {
            if (document.getElementById(id)) return;
            const grid = document.getElementById('video-grid');
            const div = document.createElement('div');
            div.id = id; div.className = 'video-box';
            div.innerHTML = `<video id="v-${id}" autoplay playsinline ${mute?'muted':''}></video><div class="video-label">${name}</div>`;
            grid.appendChild(div);
            const v = document.getElementById(`v-${id}`);
            v.srcObject = stream;
        }
    </script>
</body>
</html>
