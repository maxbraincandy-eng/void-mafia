<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Mafia Online</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .video-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; width: 100%; max-width: 900px; margin-top: 20px; }
        
        .video-box { background: #1a1a1a; border: 2px solid #333; border-radius: 15px; overflow: hidden; position: relative; aspect-ratio: 3/4; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        
        .nick { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); text-align: center; padding: 6px 0; font-size: 13px; font-weight: bold; }
        
        /* მართვის ღილაკები ვიდეოზე */
        .controls-overlay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .control-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid #444; color: white; border-radius: 50%; cursor: pointer; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
        .control-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .control-btn.off { background: #ff4757; border-color: #ff4757; }

        #login-screen { background: #1a1a1a; padding: 35px; border-radius: 20px; text-align: center; border: 1px solid #333; margin-top: 50px; }
        input { padding: 14px; border-radius: 10px; border: 1px solid #444; background: #000; color: white; margin-bottom: 20px; width: 220px; font-size: 16px; }
        .btn-main { padding: 14px 30px; border: none; border-radius: 10px; background: #ff4757; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        .status-bar { margin-bottom: 10px; font-size: 14px; color: #888; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>

    <h2 style="color: #ff4757; letter-spacing: 2px;">VOID MAFIA</h2>

    <div id="login-screen">
        <div class="status-bar">შეიყვანე ნიკნეიმი სათამაშოდ</div>
        <input type="text" id="nickname" placeholder="მაგ: დონ კორლეონე">
        <br>
        <button class="btn-main" onclick="startApp()">შესვლა ოთახში</button>
    </div>

    <div id="game-screen" style="display: none; width: 100%;">
        <div id="host-controls" style="display: none; margin-bottom: 20px;">
            <button class="btn-main" style="background: #2ecc71;">თამაშის დაწყება (Host)</button>
        </div>
        <div class="video-container" id="video-grid"></div>
    </div>

    <script>
        const socket = io();
        const videoGrid = document.getElementById('video-grid');
        const peers = {};
        let localStream;

        async function startApp() {
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) return alert("გთხოვთ შეიყვანოთ სახელი");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';

                addVideoElement('me', localStream, nickname + " (შენ)", true);
                socket.emit('join-room', 'main-room', nickname);

            } catch (err) {
                alert("კამერა ან მიკროფონი არ მოიძებნა!");
            }
        }

        // მიკროფონის მართვა
        function toggleMic() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('mic-btn');
            btn.classList.toggle('off');
            btn.innerText = audioTrack.enabled ? '🎤' : '🔇';
        }

        // კამერის მართვა
        function toggleVideo() {
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            const btn = document.getElementById('cam-btn');
            btn.classList.toggle('off');
            btn.innerText = videoTrack.enabled ? '📷' : '🚫';
        }

        function addVideoElement(id, stream, name, isLocal = false) {
            let box = document.getElementById(id);
            if (!box) {
                box = document.createElement('div');
                box.id = id;
                box.className = 'video-box';
                
                let controlsHtml = isLocal ? `
                    <div class="controls-overlay">
                        <button id="mic-btn" class="control-btn" onclick="toggleMic()">🎤</button>
                        <button id="cam-btn" class="control-btn" onclick="toggleVideo()">📷</button>
                    </div>
                ` : '';

                box.innerHTML = `
                    ${controlsHtml}
                    <video id="v-${id}" autoplay playsinline ${isLocal ? 'muted' : ''}></video>
                    <div class="nick">${name}</div>
                `;
                videoGrid.appendChild(box);
            }
            if (stream) {
                const video = document.getElementById(`v-${id}`);
                video.srcObject = stream;
            }
        }

        // Socket ლოგიკა (უცვლელი)
        socket.on('all-users', users => {
            users.forEach(user => {
                const peer = createPeer(user.id, socket.id, localStream);
                peers[user.id] = { peer, nickname: user.nickname };
            });
        });

        socket.on('user-joined', payload => {
            const peer = addPeer(payload.signal, payload.callerID, localStream);
            peers[payload.callerID] = { peer, nickname: payload.nickname };
            addVideoElement(payload.callerID, null, payload.nickname);
        });

        socket.on('receiving-returned-signal', payload => {
            if (peers[payload.id]) peers[payload.id].peer.signal(payload.signal);
        });

        function createPeer(userToSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: true, trickle: false, stream });
            peer.on('signal', signal => socket.emit('sending-signal', { userToSignal, callerID, signal }));
            peer.on('stream', st => addVideoElement(userToSignal, st, peers[userToSignal]?.nickname || "მოთამაშე"));
            return peer;
        }

        function addPeer(incomingSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream });
            peer.on('signal', signal => socket.emit('returning-signal', { signal, callerID }));
            peer.on('stream', st => addVideoElement(callerID, st, peers[callerID]?.nickname || "მოთამაშე"));
            peer.signal(incomingSignal);
            return peer;
        }

        socket.on('user-left', id => { document.getElementById(id)?.remove(); delete peers[id]; });
    </script>
</body>
</html>
