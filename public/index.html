<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID MAFIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #ff6b00; --bg: #030305; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(10, 10, 20, 0.95); border: 1px solid var(--orange); padding: 30px; width: 350px; text-align: center; }
        .terminal { background: #000; color: var(--orange); font-family: 'Share Tech Mono'; padding: 10px; border-left: 3px solid var(--orange); margin-bottom: 15px; }
        input { width: 100%; background: #000; border: 1px solid #333; border-bottom: 2px solid var(--orange); color: white; padding: 10px; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--orange); border: none; cursor: pointer; font-family: 'Bebas Neue'; font-size: 18px; margin-top: 5px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
        .hidden { display: none; }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; width: 95vw; height: 80vh; padding: 20px; }
        .video-box { background: #000; border: 1px solid var(--orange); position: relative; aspect-ratio: 1; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { position: fixed; bottom: 20px; display: flex; gap: 10px; z-index: 100; }
        .ctrl-btn { padding: 10px 20px; background: #222; border: 1px solid var(--orange); color: var(--orange); cursor: pointer; font-family: 'Share Tech Mono'; }
        .active { background: var(--orange); color: black; }
    </style>
</head>
<body>

<div id="login-screen" class="card">
    <h1>VOID MAFIA</h1>
    <div class="terminal" id="status">> AWAITING_OPERATOR...</div>
    <input type="text" id="nickname" placeholder="// NICKNAME">
    <button class="btn" onclick="init()">შესვლა</button>
</div>

<div id="game-screen" class="hidden">
    <div id="video-grid"></div>
    <div class="controls">
        <button id="mic-btn" class="ctrl-btn active" onclick="toggleAudio()">MIC: ON</button>
        <button id="cam-btn" class="ctrl-btn active" onclick="toggleVideo()">CAM: ON</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
<script>
    let socket, localStream;
    const peers = {};

    async function init() {
        const nick = document.getElementById('nickname').value.trim();
        if (!nick) return;

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            socket = io();

            socket.on('connect', () => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                socket.emit('join_room', 'VOID_MAIN', nick);
                addVideoElement('me', localStream, nick + " (შენ)", true);
            });

            socket.on('all_users', users => {
                users.forEach(id => { peers[id] = createPeer(id, socket.id, localStream); });
            });

            socket.on('user_joined', p => { peers[p.callerID] = addPeer(p.signal, p.callerID, localStream); });

            socket.on('receiving_returned_signal', p => { peers[p.id].signal(p.signal); });

            socket.on('user_left', id => {
                if (peers[id]) peers[id].destroy();
                document.getElementById(id)?.remove();
            });

        } catch (e) { alert("კამერა/მიკროფონი მიუწვდომელია"); }
    }

    function createPeer(userToSignal, callerID, stream) {
        const peer = new SimplePeer({ initiator: true, trickle: false, stream });
        peer.on('signal', signal => socket.emit('sending_signal', { userToSignal, callerID, signal }));
        peer.on('stream', st => addVideoElement(userToSignal, st, "OPERATOR"));
        return peer;
    }

    function addPeer(incomingSignal, callerID, stream) {
        const peer = new SimplePeer({ initiator: false, trickle: false, stream });
        peer.on('signal', signal => socket.emit('returning_signal', { signal, callerID }));
        peer.on('stream', st => addVideoElement(callerID, st, "OPERATOR"));
        peer.signal(incomingSignal);
        return peer;
    }

    function addVideoElement(id, stream, name, isLocal = false) {
        const grid = document.getElementById('video-grid');
        if (document.getElementById(id)) return;
        const box = document.createElement('div');
        box.id = id; box.className = 'video-box';
        box.innerHTML = `<video id="v-${id}" autoplay playsinline ${isLocal?'muted':''}></video><div style="position:absolute; bottom:5px; width:100%; text-align:center; font-size:12px; color:var(--orange)">${name}</div>`;
        grid.appendChild(box);
        document.getElementById(`v-${id}`).srcObject = stream;
    }

    function toggleAudio() {
        const enabled = localStream.getAudioTracks()[0].enabled;
        localStream.getAudioTracks()[0].enabled = !enabled;
        document.getElementById('mic-btn').innerText = !enabled ? "MIC: ON" : "MIC: OFF";
        document.getElementById('mic-btn').classList.toggle('active');
    }

    function toggleVideo() {
        const enabled = localStream.getVideoTracks()[0].enabled;
        localStream.getVideoTracks()[0].enabled = !enabled;
        document.getElementById('cam-btn').innerText = !enabled ? "CAM: ON" : "CAM: OFF";
        document.getElementById('cam-btn').classList.toggle('active');
    }
</script>
</body>
</html>
