<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Mafia Online</title>
    <style>
        :root { --main-red: #ff4757; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; min-height: 100vh; }

        /* Glitch & Text Styles */
        .glitch { font-size: 38px; font-weight: bold; color: var(--main-red); text-shadow: 2px 2px #00fffc, -2px -2px #fc00ff; animation: glitch 1s infinite; letter-spacing: 3px; }
        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        .powered-by { font-size: 12px; color: #555; margin-bottom: 20px; }

        /* UI Containers */
        #login-screen, #rooms-screen { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid #333; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--main-red); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn:disabled { background: #444; cursor: not-allowed; }

        /* Game Header (Timer & Role) */
        #game-info { display: none; background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; width: 100%; max-width: 600px; text-align: center; border: 1px solid var(--main-red); }
        #timer { font-size: 24px; font-weight: bold; color: #ffcc00; }
        #role-display { font-size: 18px; margin-top: 5px; color: #00fffc; font-weight: bold; }

        /* Video Grid */
        .video-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; max-width: 1000px; }
        .video-box { background: #1a1a1a; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 3/4; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .nick { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); text-align: center; padding: 5px 0; font-size: 12px; }

        .controls-overlay { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 10; }
        .c-btn { background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .c-btn.off { background: var(--main-red); }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>

    <div class="glitch">VOID MAFIA</div>
    <div class="powered-by">Powered by ბატონი მაქსი</div>

    <div id="login-screen">
        <input type="text" id="nickname" placeholder="შეიყვანე სახელი">
        <button class="btn" onclick="showRooms()">გაგრძელება</button>
    </div>

    <div id="rooms-screen" style="display: none;">
        <input type="text" id="room-name" placeholder="ოთახის სახელი">
        <button class="btn" onclick="joinRoom(document.getElementById('room-name').value)">ოთახის შექმნა</button>
        <div id="room-list" style="margin-top: 15px;"></div>
    </div>

    <div id="game-info">
        <div id="timer">ელოდება მოთამაშეებს...</div>
        <div id="role-display">შენი როლი: ?</div>
        <button id="start-btn" class="btn" style="display: none; background: #2ecc71; margin-top: 10px;" onclick="startGame()">თამაშის დაწყება</button>
    </div>

    <div id="game-screen" style="display: none; width: 100%;">
        <div class="video-container" id="video-grid"></div>
    </div>

    <script>
        const socket = io();
        const videoGrid = document.getElementById('video-grid');
        const peers = {};
        let localStream, myNickname, currentRoomId;

        function showRooms() {
            myNickname = document.getElementById('nickname').value.trim();
            if (!myNickname) return alert("სახელი?");
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('rooms-screen').style.display = 'block';
            socket.emit('get-rooms');
        }

        async function joinRoom(roomID) {
            currentRoomId = roomID;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('rooms-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('game-info').style.display = 'block';

                addVideoElement('me', localStream, myNickname + " (შენ)", true);
                socket.emit('join-room', roomID, myNickname);
            } catch (e) { alert("კამერა ჩართე!"); }
        }

        // ჰოსტის მართვა
        socket.on('is-host', () => {
            document.getElementById('start-btn').style.display = 'block';
        });

        function startGame() {
            socket.emit('start-game', currentRoomId);
            document.getElementById('start-btn').style.display = 'none';
        }

        // როლის მიღება
        socket.on('assign-role', role => {
            const display = document.getElementById('role-display');
            display.innerText = "შენი როლია: " + role;
            display.style.color = role === 'Mafia' ? '#ff4757' : '#2ecc71';
            startTimer(60); // 60 წამიანი ტაიმერი
        });

        function startTimer(seconds) {
            let timeLeft = seconds;
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                timerEl.innerText = `დარჩენილი დრო: ${timeLeft}წმ`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(interval);
                    timerEl.innerText = "დრო ამოიწურა!";
                }
            }, 1000);
        }

        // ოთახების სია
        socket.on('update-room-list', rooms => {
            const list = document.getElementById('room-list');
            list.innerHTML = "";
            rooms.forEach(r => {
                const b = document.createElement('button');
                b.className = "btn"; b.style.background = "#2f3542"; b.style.marginBottom = "5px";
                b.innerHTML = `${r.name} (${r.playerCount}/10)`;
                b.onclick = () => joinRoom(r.name);
                list.appendChild(b);
            });
        });

        // WebRTC ლოგიკა (უცვლელი, მუშაობს)
        socket.on('all-users', users => {
            users.forEach(u => {
                const p = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                p.on('signal', s => socket.emit('sending-signal', { userToSignal: u.id, callerID: socket.id, signal: s }));
                p.on('stream', st => addVideoElement(u.id, st, u.nickname));
                peers[u.id] = p;
            });
        });

        socket.on('user-joined', p => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            peer.on('signal', s => socket.emit('returning-signal', { signal: s, callerID: p.callerID }));
            peer.on('stream', st => addVideoElement(p.callerID, st, p.nickname));
            peer.signal(p.signal);
            peers[p.callerID] = peer;
        });

        socket.on('receiving-returned-signal', p => peers[p.id].signal(p.signal));

        function addVideoElement(id, stream, name, isLocal = false) {
            let box = document.getElementById(id);
            if (!box) {
                box = document.createElement('div'); box.id = id; box.className = 'video-box';
                let controls = isLocal ? `<div class="controls-overlay">
                    <button id="m-b" class="c-btn" onclick="tM()">🎤</button>
                    <button id="v-b" class="c-btn" onclick="tV()">📷</button>
                </div>` : '';
                box.innerHTML = `${controls}<video id="v-${id}" autoplay playsinline ${isLocal?'muted':''}></video><div class="nick">${name}</div>`;
                videoGrid.appendChild(box);
            }
            if (stream) document.getElementById(`v-${id}`).srcObject = stream;
        }

        function tM() { 
            const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled;
            document.getElementById('m-b').classList.toggle('off');
        }
        function tV() { 
            const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled;
            document.getElementById('v-b').classList.toggle('off');
        }

        socket.on('user-left', id => { document.getElementById(id)?.remove(); delete peers[id]; });
    </script>
</body>
</html>
