<script>
const socket = io();

let localStream = null;
let myNick = "";
let currentRoom = "";
let isHost = false;
let myRole = null;
let currentPhase = "waiting";
let alivePlayers = [];
let mafiaIds = [];
let timerInterval = null;
let timerSeconds = 0;

const peers = {};
const $ = id => document.getElementById(id);

/* ================= EVENTS ================= */

$("login-btn").onclick = showRooms;
$("join-btn").onclick = () => startVoid();
$("start-game-btn").onclick = requestStart;
$("mic-btn").onclick = toggleMic;
$("cam-btn").onclick = toggleCam;
$("exit-btn").onclick = () => location.reload();
$("chat-toggle").onclick = toggleChat;
$("close-chat").onclick = toggleChat;
$("send-chat-btn").onclick = sendMsg;

$("nickname").onkeydown = e => e.key === "Enter" && showRooms();
$("room-id").onkeydown = e => e.key === "Enter" && startVoid();
$("chat-msg").onkeydown = e => e.key === "Enter" && sendMsg();

/* ================= BASIC ================= */

function playSFX() {
  $("sfx-click").play().catch(()=>{});
}

function showRooms() {
  myNick = $("nickname").value.trim();
  if (!myNick) return alert("ჩაწერე ნიკი");

  playSFX();
  $("login-screen").classList.add("hidden");
  $("rooms-screen").classList.remove("hidden");

  socket.emit("get-rooms");
}

async function startVoid(roomFromList) {
  currentRoom = roomFromList || $("room-id").value.trim();
  if (!currentRoom) return alert("ჩაწერე ID");

  playSFX();

  try {
    await startCameraAndMic();

    document.body.classList.add("game-active");
    $("rooms-screen").classList.add("hidden");
    $("game-screen").classList.remove("hidden");

    socket.emit("join-room", currentRoom, myNick);
  } catch (e) {
    alert("კამერა ვერ ჩაირთო");
  }
}

/* ================= SOCKET ================= */

socket.on("is-host", () => {
  isHost = true;
  $("host-panel").classList.remove("hidden");
});

socket.on("update-room-list", rooms => {
  const list = $("room-list");
  list.innerHTML = "";

  rooms.forEach(r => {
    list.innerHTML += `
      <div class="room-item">
        <span>ID: ${escapeHtml(r.code)} (${r.playerCount}/10)</span>
        <button class="btn" onclick="startVoid('${r.code}')">JOIN</button>
      </div>
    `;
  });
});

socket.on("room-users-list", users => {
  users.forEach(user => {
    if (user.id === socket.id) {
      addVideo(user.id, localStream, user.name + " (შენ)", user.index, true);
    }
  });
});

/* 🔥 NEW CLEAN WEBRTC */
socket.on("all-users-info", setupIncomingUsers);
socket.on("user-joined-with-info", setupNewUserPeer);
socket.on("receiving-returned-signal", receiveReturnedSignal);
socket.on("user-left", removePeer);

/* ================= GAME ================= */

function requestStart() {
  if (!isHost) return;

  socket.emit("start-game-request", {
    room: currentRoom,
    settings: {
      sheriff: $("set-sheriff").checked,
      don: $("set-don").checked,
      doctor: $("set-doctor").checked,
      mafia: Number($("mafia-count").value)
    }
  });
}

socket.on("assign-role", role => {
  myRole = role;

  const el = $("my-role-card");
  el.classList.remove("hidden");
  el.innerText = "როლი: " + roleName(role);

  updateVoiceByPhase();
});

socket.on("mafia-list", ids => {
  mafiaIds = ids || [];
  updateVoiceByPhase();
});

socket.on("game-state", state => {
  currentPhase = state.phase;
  alivePlayers = state.players;

  updatePhaseText();
  updateVoiceByPhase();
});

/* ================= PHASE ================= */

function updatePhaseText() {
  document.body.classList.remove("night-mode","day-mode");

  if (currentPhase === "night") {
    document.body.classList.add("night-mode");
    $("game-phase").innerText = "ღამე";
    startTimer(60);
  }

  if (currentPhase === "day") {
    document.body.classList.add("day-mode");
    $("game-phase").innerText = "დღე";
    startTimer(45);
  }

  if (currentPhase === "vote") {
    $("game-phase").innerText = "ვოუთი";
    startTimer(30);
  }
}

/* ================= VOICE CONTROL ================= */

function updateVoiceByPhase() {
  Object.keys(peers).forEach(id => {
    const video = document.getElementById("v-" + id);
    if (!video) return;

    if (currentPhase === "night") {
      const isMafia = mafiaIds.includes(socket.id);
      const targetIsMafia = mafiaIds.includes(id);

      video.muted = !(isMafia && targetIsMafia);
    } else {
      video.muted = false;
    }
  });
}

/* ================= TIMER ================= */

function startTimer(sec) {
  clearInterval(timerInterval);
  timerSeconds = sec;

  timerInterval = setInterval(()=>{
    timerSeconds--;
    $("game-timer").innerText =
      String(Math.floor(timerSeconds/60)).padStart(2,"0") + ":" +
      String(timerSeconds%60).padStart(2,"0");

    if (timerSeconds <= 0) clearInterval(timerInterval);
  },1000);
}

/* ================= CHAT ================= */

function sendMsg() {
  const val = $("chat-msg").value;
  if (!val.trim()) return;

  socket.emit("send-chat-msg", {
    room: currentRoom,
    name: myNick,
    text: val
  });

  $("chat-msg").value = "";
}

socket.on("receive-chat-msg", d => {
  $("chat-messages").innerHTML += `
    <div class="msg"><b>${escapeHtml(d.name)}:</b> ${escapeHtml(d.text)}</div>
  `;
});

function toggleChat() {
  $("chat-panel").classList.toggle("open");
}
</script>
