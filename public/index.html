<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Void Mafia Room</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #users-list { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .user-box { background: #1e1e1e; padding: 10px; border-radius: 15px; border: 1px solid #333; }
        video { width: 300px; height: 225px; background: #000; border-radius: 12px; object-fit: cover; display: block; }
        #localVideo { border: 3px solid #2ed573; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-join { background: #ff4757; color: white; font-size: 18px; }
        .active { background: #2ed573; color: white; }
        .off { background: #ff4757; color: white; }
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; width: 200px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>
    <h1>Void Mafia Room</h1>
    
    <div id="login-screen">
        <input type="text" id="nickname" placeholder="შეიყვანე სახელი..." maxlength="15">
        <br>
        <button id="joinBtn" class="btn btn-join">შესვლა</button>
    </div>

    <div id="controls" class="controls" style="display: none;">
        <button id="toggleCam" class="btn active">📷 კამერა: ON</button>
        <button id="toggleMic" class="btn active">🎤 მიკროფონი: ON</button>
    </div>
    
    <div id="users-list"></div>

    <script>
        const socket = io();
        const nicknameInput = document.getElementById('nickname');
        const joinBtn = document.getElementById('joinBtn');
        const usersList = document.getElementById('users-list');
        
        let localStream;
        let myName = "";
        const peers = {};

        joinBtn.onclick = async () => {
            myName = nicknameInput.value.trim() || "უცნობი";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, 
                    video: { facingMode: "user" } 
                });
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';

                createVideoElement('localVideo', localStream, myName + " (შენ)", true);
                
                // ვუგზავნით სერვერს ჩვენს სახელს
                socket.emit('join-room', 'main-lobby', myName);
            } catch (err) {
                alert("კამერაზე ან მიკროფონზე წვდომა აკრძალულია!");
            }
        };

        // კამერა/მიკროფონის მართვა
        document.getElementById('toggleCam').onclick = function() {
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            this.innerText = videoTrack.enabled ? "📷 კამერა: ON" : "📷 კამერა: OFF";
            this.className = videoTrack.enabled ? 'btn active' : 'btn off';
        };

        document.getElementById('toggleMic').onclick = function() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            this.innerText = audioTrack.enabled ? "🎤 მიკროფონი: ON" : "🎤 მიკროფონი: OFF";
            this.className = audioTrack.enabled ? 'btn active' : 'btn off';
        };

        socket.on('all-users', users => {
            users.forEach(user => {
                const peer = createPeer(user.id, socket.id, localStream);
                peers[user.id] = peer;
            });
        });

        socket.on('user-joined', payload => {
            const peer = addPeer(payload.signal, payload.callerID, localStream);
            peers[payload.callerID] = peer;
        });

        socket.on('receiving-returned-signal', payload => {
            peers[payload.id].signal(payload.signal);
        });

        function createPeer(userToSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: true, trickle: false, stream });
            peer.on('signal', signal => {
                socket.emit('sending-signal', { userToSignal, callerID, signal });
            });
            peer.on('stream', stream => createVideoElement(userToSignal, stream, "მოთამაშე"));
            return peer;
        }

        function addPeer(incomingSignal, callerID, stream) {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream });
            peer.on('signal', signal => {
                socket.emit('returning-signal', { signal, callerID });
            });
            peer.on('stream', stream => createVideoElement(callerID, stream, "მოთამაშე"));
            peer.signal(incomingSignal);
            return peer;
        }

        function createVideoElement(id, stream, label, isLocal = false) {
            if (document.getElementById(id + '-box')) return;
            const div = document.createElement('div');
            div.className = 'user-box';
            div.id = id + '-box';
            const video = document.createElement('video');
            video.id = id;
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) video.muted = true;
            const span = document.createElement('div');
            span.innerText = label;
            span.style.marginTop = "10px";
            div.appendChild(video);
            div.appendChild(span);
            usersList.appendChild(div);
            
            // "გამოღვიძების" მექანიზმი ხმისთვის
            video.onloadedmetadata = () => video.play();
        }

        socket.on('user-left', userId => {
            if (peers[userId]) {
                peers[userId].destroy();
                document.getElementById(userId + '-box')?.remove();
                delete peers[userId];
            }
        });
    </script>
</body>
</html>
