<script>
const $ = id => document.getElementById(id);
/* ══════════════════════════════════════
   ICE / STUN / TURN CONFIG
   This fixes mobile internet ↔ Wi-Fi WebRTC issues as much as possible
   without a private coturn server.
══════════════════════════════════════ */
function getDefaultIceServers(){
  return [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    // Temporary public TURN fallback for testing.
    // Production-ისთვის საბოლოოდ საკუთარი coturn TURN server ჯობია.
    {
      urls: "turn:global.relay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:global.relay.metered.ca:80?transport=tcp",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:global.relay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turns:global.relay.metered.ca:443?transport=tcp",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ];
}
function mergeIceServers(serverIceServers){
  const base = getDefaultIceServers();
  if(!Array.isArray(serverIceServers) || !serverIceServers.length) return base;
  const seen = new Set();
  const merged = [];
  for(const item of [...base, ...serverIceServers]){
    if(!item || !item.urls) continue;
    const key = JSON.stringify(item);
    if(seen.has(key)) continue;
    seen.add(key);
    merged.push(item);
  }
  return merged;
}
function getRTCConfig(){
  return {
    iceServers: App.iceServers && App.iceServers.length
      ? App.iceServers
      : getDefaultIceServers(),
    // Normal mode. Browser tries direct/STUN first and TURN when needed.
    iceTransportPolicy: "all"
    // Diagnostic test only:
    // If voice still fails, temporarily change to "relay".
    // If "relay" also fails, public TURN is not working and you need private coturn.
    // iceTransportPolicy: "relay"
  };
}
const App = {
  user: null,
  socket: null,
  room: null,
  roles: [],
  localStream: null,
  peers: {},
  iceServers: getDefaultIceServers(),
  musicOn: false,
  sfxOn: true,
  lastChatCount: 0,
  micOn: true,
  camOn: true
};
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[m]));
}
function show(id){ $(id)?.classList.remove("hidden"); }
function hide(id){ $(id)?.classList.add("hidden"); }
function toast(t){
  let el = $("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  if(!t){
    el.classList.remove("show");
    el.textContent = "";
    return;
  }
  el.textContent = t;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.classList.remove("show");
    el.textContent = "";
  }, 2400);
}
/* ── GLITCH TRANSITION ── */
function glitchTransition(cb){
  const el = $("glitchOverlay");
  if(!el){
    cb && cb();
    return;
  }
  el.classList.remove("active");
  void el.offsetWidth;
  el.classList.add("active");
  beep("navigate");
  setTimeout(() => {
    cb && cb();
  }, 130);
  setTimeout(() => el.classList.remove("active"), 350);
}
/* ── AUDIO — sub-bass and feedback removed, all notes ≥ 220 Hz ── */
let audioCtx = null;
function audio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}
function beep(type = "tap"){
  if(!App.sfxOn) return;
  try{
    const ctx = audio();
    const now = ctx.currentTime;
    if(type === "navigate"){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(440, now);
      o.frequency.exponentialRampToValueAtTime(880, now + 0.06);
      g.gain.setValueAtTime(0.04, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(now);
      o.stop(now + 0.18);
    } else if(type === "msg"){
      [880, 1320].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.001, now + i * 0.07);
        g.gain.linearRampToValueAtTime(0.04, now + i * 0.07 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.14);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + i * 0.07);
        o.stop(now + i * 0.07 + 0.16);
      });
    } else if(type === "start"){
      [220,330,440,660,880,1100].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "triangle";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.001, now + i * 0.075);
        g.gain.linearRampToValueAtTime(0.05, now + i * 0.075 + 0.025);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.075 + 0.22);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + i * 0.075);
        o.stop(now + i * 0.075 + 0.26);
      });
    } else if(type === "error"){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(330, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.16);
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(now);
      o.stop(now + 0.22);
    } else if(type === "night"){
      [220,330,440].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.001, now + i * 0.1);
        g.gain.linearRampToValueAtTime(0.035, now + i * 0.1 + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.6);
      });
    } else {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.035, now + 0.007);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(now);
      o.stop(now + 0.07);
    }
  }catch(e){}
}
function fmt(s){
  s = Number(s || 0);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function level(u){
  return Math.max(1, Math.floor(Number(u?.stats?.xp || 0) / 100) + 1);
}
async function api(url, opt = {}){
  const r = await fetch(url, {
    headers: { "Content-Type":"application/json" },
    credentials: "include",
    ...opt,
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  return r.json();
}
function emit(name, payload, timeout = 7000){
  return new Promise(resolve => {
    let done = false;
    const t = setTimeout(() => {
      if(!done){
        done = true;
        resolve({ ok:false, error:"Timeout" });
      }
    }, timeout);
    App.socket.emit(name, payload, res => {
      if(done) return;
      done = true;
      clearTimeout(t);
      resolve(res || { ok:true });
    });
  });
}
document.addEventListener("DOMContentLoaded", init);
window.addEventListener("pointerdown", () => {
  if(App.sfxOn) beep("tap");
}, { once:true });
async function init(){
  bindUi();
  try{
    const w = await api("/api/webrtc");
    if(w.ok && Array.isArray(w.iceServers) && w.iceServers.length){
      App.iceServers = mergeIceServers(w.iceServers);
    } else {
      App.iceServers = getDefaultIceServers();
    }
    console.log("[WebRTC] ICE servers loaded:", App.iceServers);
  }catch(e){
    console.warn("[WebRTC] /api/webrtc failed, using defaults", e);
    App.iceServers = getDefaultIceServers();
  }
  const rr = await api("/api/roles");
  if(rr.ok){
    App.roles = rr.roles;
    renderRoleSettings(rr.defaultSettings.roles);
  }
  const me = await api("/api/auth/me");
  if(me.user) enterApp(me.user);
}
function bindUi(){
  document.querySelectorAll("[data-auth-tab]").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("[data-auth-tab]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      ["guestForm","loginForm","registerForm"].forEach(hide);
      show(btn.dataset.authTab + "Form");
    };
  });
  $("guestBtn").onclick = async () => {
    const r = await api("/api/auth/guest", {
      method:"POST",
      body:{
        nickname:$("guestNick").value,
        avatar:$("guestAvatar").value
      }
    });
    r.ok ? enterApp(r.user) : toast(r.error);
  };
  $("registerBtn").onclick = async () => {
    const r = await api("/api/auth/register", {
      method:"POST",
      body:{
        nickname:$("regNick").value,
        email:$("regEmail").value,
        password:$("regPass").value
      }
    });
    r.ok ? enterApp(r.user) : toast(r.error);
  };
  $("loginBtn").onclick = async () => {
    const r = await api("/api/auth/login", {
      method:"POST",
      body:{
        email:$("loginEmail").value,
        password:$("loginPass").value
      }
    });
    r.ok ? enterApp(r.user) : toast(r.error);
  };
  $("menuBtn").onclick = () => openDrawer();
  $("drawerClose").onclick = () => closeDrawer();
  $("refreshBtn").onclick = () => loadAll();
  $("toggleCreateBtn").onclick = () => $("createBox").classList.toggle("hidden");
  $("createRoomBtn").onclick = () => {
    beep("start");
    createRoom();
  };
  $("joinByCodeBtn").onclick = () => {
    const id = prompt("Room number");
    if(id) joinRoom(id.trim());
  };
  document.querySelectorAll("[data-page]").forEach(b => {
    b.onclick = () => showPage(b.dataset.page);
  });
  document.querySelectorAll("[data-drawer-page]").forEach(b => {
    b.onclick = () => {
      closeDrawer();
      showPage(b.dataset.drawerPage);
    };
  });
  $("createClanBtn").onclick = createClan;
  $("saveProfileBtn").onclick = saveProfile;
  $("logoutBtn").onclick = logout;
  $("storeBtn").onclick = () => {
    closeDrawer();
    loadStore();
    show("storeModal");
  };
  $("musicBtn").onclick = () => {
    toast("Music disabled · SFX only");
  };
  $("sfxBtn").onclick = () => {
    App.sfxOn = !App.sfxOn;
    $("sfxBtn").textContent = "🔊 SFX: " + (App.sfxOn ? "ON" : "OFF");
  };
  $("leaveBtn").onclick = leaveRoom;
  $("chatTopBtn").onclick = () => {
    $("chatTopBtn").classList.remove("notifyHot");
    show("chatModal");
    setTimeout(() => {
      $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
    }, 50);
  };
  $("settingsTopBtn").onclick = openSettings;
  $("settingsBtn").onclick = openSettings;
  $("startBtn").onclick = startGame;
  $("nextPhaseBtn").onclick = nextPhase;
  $("saveSettingsBtn").onclick = saveSettings;
  $("sendChatBtn").onclick = () => {
    beep("tap");
    sendChat("room");
  };
  $("sendMafiaBtn").onclick = () => {
    beep("tap");
    sendChat("mafia");
  };
  $("chatInput").addEventListener("keydown", e => {
    if(e.key === "Enter") sendChat("room");
  });
  $("mafiaInput").addEventListener("keydown", e => {
    if(e.key === "Enter") sendChat("mafia");
  });
  document.querySelectorAll("[data-close]").forEach(b => {
    b.onclick = () => hide(b.dataset.close);
  });
  $("sendLobbyChatBtn").onclick = () => sendLobbyChatMsg();
  $("lobbyChatInput").addEventListener("keydown", e => {
    if(e.key === "Enter") sendLobbyChatMsg();
  });
}
async function sendLobbyChatMsg(){
  const input = $("lobbyChatInput");
  const msg = input.value.trim();
  if(!msg || !App.room) return;
  input.disabled = true;
  const r = await emit("chat:send", {
    roomId:App.room.id,
    message:msg,
    channel:"room"
  });
  input.disabled = false;
  if(r.ok) input.value = "";
  else toast(r.error);
}
function enterApp(user){
  App.user = user;
  glitchTransition(() => {
    hide("auth");
    show("app");
  });
  connectSocket();
  renderMe();
  loadAll();
}
function connectSocket(){
  if(App.socket) App.socket.disconnect();
  App.socket = io();
  App.socket.on("connect", () => {
    App.socket.emit("auth", { userId:App.user.userId }, r => {
      if(!r?.ok) toast(r?.error || "Socket auth failed");
    });
  });
  App.socket.on("rooms:list", renderRooms);
  App.socket.on("room:state", room => {
    const count = (room.chat || []).length;
    if(App.room && count > App.lastChatCount && $("chatModal")?.classList.contains("hidden")){
      $("chatTopBtn")?.classList.add("notifyHot");
      beep("msg");
    }
    App.lastChatCount = count;
    App.room = room;
    renderRoom();
  });
  App.socket.on("room:terminated", () => {
    toast("Room terminated by host");
    exitGameView();
  });
  App.socket.on("chat:message", m => {
    addMsg(m.channel === "mafia" ? "mafiaMessages" : "chatMessages", m);
    if(App.room?.phase === "waiting" && m.channel === "room"){
      addMsg("lobbyChatMsgs", m);
    }
  });
  App.socket.on("room:closed", () => {
    toast("Room closed");
    leaveRoom(true);
  });
  bindWebRTCEvents();
}
function renderMe(){
  if(!App.user) return;
  $("userLine").textContent = `ID ${App.user.userId} · ${App.user.nickname}`;
  $("profileName").textContent = App.user.nickname;
  $("profileId").textContent = `ID ${App.user.userId} · Level ${level(App.user)}`;
  $("profileAvatar").textContent = App.user.avatar || "◆";
  $("drawerAvatar").textContent = App.user.avatar || "◆";
  $("drawerName").textContent = App.user.nickname;
  $("drawerInfo").textContent = `ID ${App.user.userId} · Level ${level(App.user)}`;
  $("statXp").textContent = App.user.stats?.xp || 0;
  $("statRating").textContent = Number(App.user.stats?.rating || 5).toFixed(1);
  $("statWins").textContent = App.user.stats?.wins || 0;
  $("statGames").textContent = App.user.stats?.games || 0;
  $("editNick").value = App.user.nickname || "";
  $("editAvatar").value = App.user.avatar || "◆";
}
function openDrawer(){
  renderMe();
  $("drawer").classList.add("open");
}
function closeDrawer(){
  $("drawer").classList.remove("open");
}
function showPage(name){
  glitchTransition(() => {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $("page" + name)?.classList.add("active");
    $("pageTitle").textContent = name;
    $("pageTitle").dataset.text = name;
    document.querySelectorAll("[data-page]").forEach(b => {
      b.classList.toggle("active", b.dataset.page === name);
    });
    if(name === "Rooms") loadRooms();
    if(name === "Clans") loadClans();
    if(name === "Stats") loadLeaderboard();
    if(name === "Profile") renderMe();
  });
}
async function loadAll(){
  await loadRooms();
  loadClans();
  loadLeaderboard();
}
async function loadRooms(){
  const r = await api("/api/rooms");
  if(r.ok) renderRooms(r.rooms || []);
}
function renderRooms(rooms){
  $("roomsCount").textContent = rooms.length;
  $("roomsList").innerHTML = (rooms || []).map(r => `
    <div class="room">
      <div class="pic">🎭</div>
      <div>
        <h3>${esc(r.name)}</h3>
        <p>Host: ${esc(r.hostName)} · ${r.players}/${r.maxPlayers} · ${esc(r.language || "")}</p>
        <span class="badge">${esc(r.phase)}</span>
      </div>
      <button onclick="joinRoom('${r.id}')">JOIN</button>
    </div>
  `).join("") || `<p class="sub" style="padding:18px 0">No active rooms</p>`;
}
async function createRoom(){
  if(!App.socket?.connected) return toast("Socket not connected. Try refresh.");
  const settings = collectSettings();
  settings.maxPlayers = Number($("maxPlayers").value || 10);
  settings.language = $("roomLanguage").value || "Georgian";
  const btn = $("createRoomBtn");
  btn.disabled = true;
  btn.textContent = "Creating...";
  const r = await emit("room:create", {
    name:$("roomName").value || "VOID TABLE",
    settings
  });
  btn.disabled = false;
  btn.textContent = "Create room";
  if(!r.ok) return toast(r.error || "Room create failed");
  enterRoom(r.room);
}
async function joinRoom(id){
  const r = await emit("room:join", { roomId:id });
  if(!r.ok) return toast(r.error || "Join failed");
  enterRoom(r.room);
}
function enterRoom(room){
  App.room = room;
  resetWebRTC();
  glitchTransition(() => {
    document.body.classList.add("gameActive");
    hide("app");
    show("game");
    $("gameOverlay").classList.add("hidden");
    renderRoom();
    ensureMedia().then(() => {
      signalReady();
    });
  });
}
async function leaveRoom(skipEmit = false){
  if(!skipEmit && App.socket && App.room){
    App.socket.emit("room:leave", { roomId:App.room.id }, () => {});
  }
  resetWebRTC();
  if(App.localStream){
    App.localStream.getTracks().forEach(t => t.stop());
    App.localStream = null;
  }
  App.room = null;
  glitchTransition(() => {
    document.body.classList.remove("gameActive");
    hide("game");
    show("app");
    loadAll();
  });
}
function exitGameView(){
  resetWebRTC();
  App.room = null;
  glitchTransition(() => {
    document.body.classList.remove("gameActive");
    hide("game");
    show("app");
    loadRooms();
  });
}
function renderRoom(){
  const r = App.room;
  if(!r) return;
  const waiting = r.phase === "waiting";
  $("phaseName").textContent = waiting ? "Lobby" : r.phaseLabel || r.phase;
  $("phaseInfo").textContent = waiting ? `${r.players.length}/${r.settings.maxPlayers}` : `Day ${r.day}`;
  $("timer").textContent = waiting ? "00:00" : fmt(r.timer);
  $("gameRoomName").textContent = r.name;
  $("gameRoomInfo").textContent = `${r.phase} · Host: ${r.hostName} · Code: ${r.id}`;
  $("playersCount").textContent = `${r.players.length}/${r.settings.maxPlayers}`;
  ["settingsBtn","settingsTopBtn","startBtn","nextPhaseBtn"].forEach(id => {
    $(id).style.display = r.viewer?.isHost ? "inline-flex" : "none";
  });
  $("lobbyView").classList.toggle("hidden", !waiting);
  document.body.classList.toggle("gameActive", !waiting && !$("game").classList.contains("hidden"));
  $("playersList").innerHTML = r.players.map(playerRow).join("");
  renderChat();
  renderVideos();
  if(!waiting) renderActionBox();
  else hide("actionBox");
  $("lobbyChatPanel").classList.toggle("hidden", !waiting);
  if(waiting){
    $("lobbyChatMsgs").innerHTML = (r.chat || []).slice(-60).map(msgHtml).join("");
    setTimeout(() => {
      $("lobbyChatMsgs").scrollTop = $("lobbyChatMsgs").scrollHeight;
    }, 30);
  }
  const over = r.gameOver || (r.phase === "ended" ? { winnerTeam:"unknown", label:"Game Over" } : null);
  if(over){
    $("gameOverlay").classList.remove("hidden");
    $("gameOverText").textContent = over.label || `${over.winnerTeam} WINS`;
  } else {
    $("gameOverlay").classList.add("hidden");
  }
}
function playerRow(p){
  const me = Number(p.userId) === Number(App.user.userId);
  const micOn = me ? App.micOn : (p.micOn !== false);
  const camOn = me ? App.camOn : (p.cameraOn !== false);
  const roleStr = p.role ? ` · ${esc(roleLabel(p.role))}` : "";
  const micStyle = micOn ? "" : "border-color:var(--danger);color:var(--danger);";
  const camStyle = camOn ? "" : "border-color:var(--danger);color:var(--danger);";
  return `<div class="player ${p.alive ? "" : " dead"}">
    <div class="pic ${p.speaking ? "speakerPulse" : ""}">${esc(p.avatar || "◆")}</div>
    <div>
      <b>#${p.seat} · ${esc(p.nickname)}${me ? " (you)" : ""}</b><br>
      <small>ID ${p.userId}${roleStr}</small><br>
      ${me ? `<button onclick="toggleMic()" style="margin-top:4px;${micStyle}">${micOn ? "🎙" : "🔇"} MIC</button> <button onclick="toggleCam()" style="margin-top:4px;${camStyle}">${camOn ? "📷" : "📷✕"} CAM</button>` : ""}
    </div>
    <span class="badge">${p.speaking ? "LIVE" : p.connected ? "ON" : "OFF"}</span>
  </div>`;
}
function roleLabel(key){
  return (App.roles.find(r => r.key === key) || {}).label || key;
}
function renderVideos(){
  const grid = $("videoGrid");
  if(!grid || !App.room) return;
  const players = App.room.players || [];
  grid.classList.remove("hidden");
  grid.innerHTML = players.map(p => {
    const isMe = Number(p.userId) === Number(App.user.userId);
    const sid = p.socketId || p.id || p.userId;
    return `<div class="tile ${p.speaking ? "speaking" : ""} ${p.cameraOn === false ? "camOff" : ""}" data-socket-id="${sid}">
      <video id="vid_${sid}" autoplay playsinline ${isMe ? "muted" : ""}></video>
      <div class="mediaState"><span>${p.micOn === false ? "🔇" : "🎙"}</span><span>${p.cameraOn === false ? "📷✕" : "📷"}</span></div>
      <div class="label">#${p.seat} · ${esc(p.nickname || "Player")}</div>
    </div>`;
  }).join("");
  const me = players.find(p => Number(p.userId) === Number(App.user.userId));
  const mySid = me?.socketId || me?.id || me?.userId;
  if(App.localStream && mySid){
    const v = $("vid_" + mySid);
    if(v){
      v.srcObject = App.localStream;
      v.muted = true;
      v.playsInline = true;
      v.play?.().catch(() => {});
    }
  }
  for(const p of players){
    const sid = p.socketId;
    if(!sid || sid === me?.socketId) continue;
    const pc = App.peers[sid];
    if(pc && pc._remoteStream){
      const v = $("vid_" + sid);
      if(v && v.srcObject !== pc._remoteStream){
        v.srcObject = pc._remoteStream;
        v.muted = false;
        v.playsInline = true;
        v.play?.().catch(() => {});
      }
    }
  }
}
function renderActionBox(){
  const r = App.room;
  const me = r.players.find(p => p.userId === App.user.userId);
  if(!me || !me.alive){
    hide("actionBox");
    return;
  }
  const nightRoles = [
    "mafia","don","godfather","doctor","sheriff","detective","bodyguard",
    "serial_killer","fortune_teller","lady","spy","bulletproof","lawyer",
    "priest","witch","tracker"
  ];
  const canNight = r.phase === "night" && nightRoles.includes(me.role);
  const canNominate = r.phase === "nomination";
  const canVote = r.phase === "vote";
  if(!canNight && !canNominate && !canVote){
    hide("actionBox");
    return;
  }
  show("actionBox");
  if(canNominate){
    $("actionTitle").textContent = "Nomination";
    $("actionText").textContent = "Nominate a player for elimination.";
    const nominated = r.nominatedIds || [];
    const targets = r.players.filter(p => p.alive && p.id !== me.id);
    $("targets").innerHTML = targets.map(t => `
      <button onclick="sendNominate('${t.id}')" ${nominated.includes(t.id) ? "class='primary'" : ""}>#${t.seat} · ${esc(t.nickname)}${nominated.includes(t.id) ? " ★" : ""}</button>
    `).join("");
    return;
  }
  $("actionTitle").textContent = canNight ? "Night Action" : "Vote";
  $("actionText").textContent = canNight ? `Your role: ${roleLabel(me.role)}` : "Choose a player or abstain.";
  const canSelf = ["doctor","bodyguard","priest","bulletproof"].includes(me.role);
  let targets;
  if(canVote && (r.nominatedIds || []).length > 0){
    targets = r.players.filter(p => p.alive && (r.nominatedIds || []).includes(p.id));
  } else {
    targets = r.players.filter(p => p.alive && (canVote || canSelf || p.id !== me.id));
  }
  $("targets").innerHTML = targets.map(t => `
    <button onclick="${canNight ? "sendAction" : "sendVote"}('${t.id}')">#${t.seat} · ${esc(t.nickname)}</button>
  `).join("") + (canVote ? `<button onclick="sendVote('abstain')" style="opacity:.7">Abstain</button>` : "");
}

async function ensureMedia(){
  if(App.localStream) return App.localStream;
  try{
    App.localStream = await navigator.mediaDevices.getUserMedia({
      video:{
        width:{ ideal:640 },
        height:{ ideal:480 },
        facingMode:"user"
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });
    setupVoiceActivity();
    App.socket?.emit("media:state", {
      roomId:App.room?.id,
      micOn:App.localStream.getAudioTracks()[0]?.enabled !== false,
      cameraOn:App.localStream.getVideoTracks()[0]?.enabled !== false
    });
  }catch(e){
    console.warn("media failed", e);
    toast("კამერა/მიკროფონი ვერ ჩაირთო");
  }
  return App.localStream;
}

function setupVoiceActivity(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const src = ctx.createMediaStreamSource(App.localStream);
    const an = ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    let last = false;
    setInterval(() => {
      an.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const micOn = App.localStream?.getAudioTracks?.()[0]?.enabled !== false;
      const speaking = micOn && avg > 18;
      if(speaking !== last){
        last = speaking;
        App.socket?.emit("media:state", {
          roomId:App.room?.id,
          speaking
        });
      }
    }, 350);
  }catch(e){}
}
/* ══════════════════════════════════════
   WebRTC — TURN/STUN FIXED IMPLEMENTATION
══════════════════════════════════════ */
const pendingIce = {};
let rtcSignaled = false;
function resetWebRTC(){
  Object.values(App.peers).forEach(pc => {
    try{ pc.close(); }catch(e){}
  });
  App.peers = {};
  Object.keys(pendingIce).forEach(k => delete pendingIce[k]);
  rtcSignaled = false;
  document.querySelectorAll("audio[id^='aud_']").forEach(a => a.remove());
}
async function signalReady(){
  if(rtcSignaled || !App.room || !App.localStream) return;
  rtcSignaled = true;
  console.log("[WebRTC] signaling ready for room", App.room.id);
  App.socket.emit("webrtc:ready", {
    roomId:App.room.id
  });
}
function bindWebRTCEvents(){
  App.socket.on("webrtc:peer-ready", async ({ socketId }) => {
    if(!App.localStream || App.peers[socketId]) return;
    const pc = createPeer(socketId);
    try{
      const offer = await pc.createOffer({
        offerToReceiveAudio:true,
        offerToReceiveVideo:true
      });
      await pc.setLocalDescription(offer);
      console.log("[WebRTC] offer →", socketId);
      App.socket.emit("signal:offer", {
        to:socketId,
        signal:offer
      });
    }catch(e){
      console.warn("[WebRTC] offer error", e);
    }
  });
  App.socket.on("webrtc:reset-peer", ({ socketId }) => {
    const pc = App.peers[socketId];
    if(pc){
      try{ pc.close(); }catch(e){}
      delete App.peers[socketId];
    }
    delete pendingIce[socketId];
    const aud = document.getElementById("aud_" + socketId);
    if(aud) aud.remove();
  });
  App.socket.on("signal:offer", onOffer);
  App.socket.on("signal:answer", onAnswer);
  App.socket.on("signal:ice", onIce);
}
function createPeer(id){
  const pc = new RTCPeerConnection(getRTCConfig());
  App.peers[id] = pc;
  console.log("[WebRTC] create peer", id, getRTCConfig());
  if(App.localStream){
    App.localStream.getTracks().forEach(t => {
      pc.addTrack(t, App.localStream);
      console.log("[WebRTC] added local track", t.kind, "to", id);
    });
  } else {
    try{
      pc.addTransceiver("audio", { direction:"recvonly" });
    }catch(e){}
  }
  pc.onicecandidate = e => {
    if(e.candidate){
      console.log(
        "[WebRTC] ICE candidate →",
        id,
        e.candidate.type,
        e.candidate.protocol
      );
      App.socket.emit("signal:ice", {
        to:id,
        candidate:e.candidate.toJSON ? e.candidate.toJSON() : e.candidate
      });
    }
  };
  pc.onicecandidateerror = e => {
    console.warn(
      "[WebRTC] ICE candidate error",
      id,
      e.errorCode,
      e.errorText,
      e.url
    );
  };
  pc.oniceconnectionstatechange = () => {
    console.log("[WebRTC] ICE state", id, pc.iceConnectionState);
    if(pc.iceConnectionState === "failed"){
      console.warn("[WebRTC] ICE failed, restarting", id);
      try{
        pc.restartIce();
      }catch(e){}
      toast("Voice connection failed. Try refresh / reset voice.");
    }
    if(pc.iceConnectionState === "disconnected"){
      console.warn("[WebRTC] ICE disconnected", id);
    }
  };
  pc.onconnectionstatechange = () => {
    console.log("[WebRTC] connection state", id, pc.connectionState);
    if(pc.connectionState === "failed" || pc.connectionState === "closed"){
      console.warn("[WebRTC] peer connection ended", id, pc.connectionState);
      delete App.peers[id];
      delete pendingIce[id];
    }
  };
  pc.onsignalingstatechange = () => {
    console.log("[WebRTC] signaling state", id, pc.signalingState);
  };
  pc.onicegatheringstatechange = () => {
    console.log("[WebRTC] gathering state", id, pc.iceGatheringState);
  };
  pc.ontrack = e => {
    console.log("[WebRTC] remote track from", id, e.track.kind, e.streams);
    let stream = pc._remoteStream;
    if(!stream){
      stream = new MediaStream();
      pc._remoteStream = stream;
    }
    if(!stream.getTrackById(e.track.id)){
      stream.addTrack(e.track);
    }
    attachRemoteStream(id, stream);
  };
  return pc;
}
function attachRemoteStream(id, stream){
  const v = $("vid_" + id);
  if(v){
    if(v.srcObject !== stream){
      v.srcObject = stream;
    }
    v.muted = false;
    v.playsInline = true;
    v.play?.().catch(err => {
      console.warn("[WebRTC] video/audio play blocked", id, err);
    });
  }
  let aud = document.getElementById("aud_" + id);
  if(!aud){
    aud = document.createElement("audio");
    aud.id = "aud_" + id;
    aud.autoplay = true;
    aud.setAttribute("playsinline", "");
    aud.muted = false;
    aud.volume = 1.0;
    aud.style.display = "none";
    document.body.appendChild(aud);
  }
  if(aud.srcObject !== stream){
    aud.srcObject = stream;
  }
  aud.play?.().catch(err => {
    console.warn("[WebRTC] audio autoplay blocked", id, err);
    const retry = () => {
      aud.play?.().catch(() => {});
      document.removeEventListener("click", retry);
      document.removeEventListener("touchstart", retry);
    };
    document.addEventListener("click", retry, { once:true });
    document.addEventListener("touchstart", retry, { once:true });
  });
}
async function onOffer({ from, signal }){
  await ensureMedia();
  let pc = App.peers[from];
  if(!pc) pc = createPeer(from);
  try{
    await pc.setRemoteDescription(new RTCSessionDescription(signal));
    await flushIce(from);
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    console.log("[WebRTC] answer →", from);
    App.socket.emit("signal:answer", {
      to:from,
      signal:ans
    });
    signalReady();
  }catch(e){
    console.warn("[WebRTC] offer handling failed", from, e);
  }
}
async function onAnswer({ from, signal }){
  const pc = App.peers[from];
  if(!pc) return;
  try{
    if(pc.signalingState === "stable"){
      console.log("[WebRTC] already stable, skip answer", from);
      return;
    }
    await pc.setRemoteDescription(new RTCSessionDescription(signal));
    await flushIce(from);
    console.log("[WebRTC] answer applied from", from);
  }catch(e){
    console.warn("[WebRTC] answer failed", from, e);
  }
}
async function onIce({ from, candidate }){
  const pc = App.peers[from];
  if(!pc || !pc.remoteDescription){
    if(!pendingIce[from]) pendingIce[from] = [];
    pendingIce[from].push(candidate);
    return;
  }
  try{
    await pc.addIceCandidate(new RTCIceCandidate(candidate));
    console.log("[WebRTC] ICE added from", from);
  }catch(e){
    console.warn("[WebRTC] ICE add failed", from, e);
  }
}
async function flushIce(from){
  const list = pendingIce[from];
  if(!list) return;
  const pc = App.peers[from];
  if(!pc) return;
  for(const c of list){
    try{
      await pc.addIceCandidate(new RTCIceCandidate(c));
      console.log("[WebRTC] queued ICE added from", from);
    }catch(e){
      console.warn("[WebRTC] queued ICE failed", from, e);
    }
  }
  delete pendingIce[from];
}
