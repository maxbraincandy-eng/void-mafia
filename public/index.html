<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Void Mafia Online</title>
    <style>
        :root { --void-red: #ff4757; --bg: #0a0a0a; --card: #161b22; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

        /* ცენტრალური კონტეინერი */
        .flex-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }

        /* ავტორიზაციის ეკრანი */
        .auth-box { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid #30363d; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-size: 50px; font-weight: 900; letter-spacing: 10px; margin-bottom: 30px; text-transform: uppercase; color: white; text-shadow: 0 0 15px var(--void-red); }

        input { width: 100%; padding: 15px; margin-bottom: 20px; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; color: white; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: var(--void-red); outline: none; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-red { background: var(--void-red); color: white; }
        .btn-red:hover { opacity: 0.8; transform: translateY(-2px); }

        /* ვიდეო ზონა */
        #game-screen { display: none; width: 100%; padding-top: 80px; }
        .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .video-container { background: var(--card); padding: 10px; border-radius: 15px; border: 1px solid #333; position: relative; }
        video { width: 100%; max-width: 300px; border-radius: 10px; background: #000; object-fit: cover; }
        .name-tag { position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px 0; }

        /* მართვის პანელი */
        .top-bar { position: fixed; top: 0; width: 100%; background: #121417; padding: 15px; display: flex; justify-content: space-around; border-bottom: 1px solid #30363d; z-index: 100; }
        .control-btn { padding: 10px 15px; border-radius: 8px; font-size: 12px; border: 1px solid #444; background: #1f2328; color: white; cursor: pointer; }
        .active { border-color: #2ed573; color: #2ed573; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>

    <div id="auth-screen" class="flex-center">
        <div class="logo">VOID</div>
        <div class="auth-box">
            <input type="text" id="nickname" placeholder="შეიყვანე სახელი..." maxlength="15">
            <button id="joinBtn" class="btn btn-red">შესვლა</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="top-bar">
            <button id="toggleCam" class="control-btn active">📷 კამერა: ON</button>
            <button id="toggleMic" class="control-btn active">🎤 მიკროფონი: ON</button>
            <div id="user-info" style="align-self: center; font-weight: bold; color: var(--void-red);"></div>
        </div>
        
        <div id="video-area" class="video-grid">
            </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        const peers = {};
        const videoArea = document.getElementById('video-area');

        document.getElementById('joinBtn').onclick = async () => {
            const nick = document.getElementById('nickname').value.trim();
            if (!nick) return alert("შეიყვანე სახელი!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('user-info').innerText = nick;

                addVideoElement('local', localStream, nick + " (შენ)");
                socket.emit('join-room', 'void-main', nick);

            } catch (e) {
                alert("კამერა/მიკროფონი ვერ მოიძებნა!");
            }
        };

        socket.on('user-connected', (userId, userNick) => {
            console.log("ახალი მომხმარებელი:", userNick);
            const peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
            
            peer.on('signal', signal => socket.emit('send-signal', { to: userId, from: socket.id, signal }));
            peer.on('stream', stream => addVideoElement(userId, stream, userNick));
            
            peers[userId] = peer;
        });

        socket.on('receive-signal', data => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            
            peer.on('signal', signal => socket.emit('return-signal', { to: data.from, signal }));
            peer.on('stream', stream => addVideoElement(data.from, stream, "მომხმარებელი"));
            
            peer.signal(data.signal);
            peers[data.from] = peer;
        });

        socket.on('user-disconnected', userId => {
            if (peers[userId]) peers[userId].destroy();
            const el = document.getElementById(userId);
            if (el) el.remove();
        });

        function addVideoElement(id, stream, name) {
            if (document.getElementById(id)) return;
            const container = document.createElement('div');
            container.className = 'video-container';
            container.id = id;
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (id === 'local') video.muted = true;

            const label = document.createElement('div');
            label.className = 'name-tag';
            label.innerText = name;

            container.appendChild(video);
            container.appendChild(label);
            videoArea.appendChild(container);
        }

        // კამერა/მიკროფონის ტოგლი
        document.getElementById('toggleCam').onclick = function() {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            this.classList.toggle('active');
            this.innerText = track.enabled ? "📷 კამერა: ON" : "📷 კამერა: OFF";
        };

        document.getElementById('toggleMic').onclick = function() {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            this.classList.toggle('active');
            this.innerText = track.enabled ? "🎤 მიკროფონი: ON" : "🎤 მიკროფონი: OFF";
        };
    </script>
</body>
</html>
