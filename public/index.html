
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>VOID MAFIA // NEON VOID</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff00ff; --cyan: #00ffff; --bg: #07020f; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .glitch-title { font-family: 'Orbitron'; font-size: 40px; color: var(--cyan); text-shadow: 0 0 20px var(--cyan); margin-bottom: 0; }
        .powered { font-size: 12px; color: #6a4a8a; margin-bottom: 30px; letter-spacing: 2px; }
        .card { background: rgba(14, 5, 32, 0.9); border: 1px solid var(--neon); padding: 30px; width: 350px; text-align: center; box-shadow: 0 0 20px rgba(255, 0, 255, 0.2); }
        input { width: 100%; background: #000; border: 1px solid var(--neon); color: white; padding: 12px; margin: 10px 0; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--neon); color: white; border: none; cursor: pointer; font-family: 'Orbitron'; font-size: 12px; transition: 0.3s; }
        .btn:hover { background: var(--cyan); box-shadow: 0 0 20px var(--cyan); }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 90vw; height: 80vh; padding: 20px; }
        .video-box { border: 2px solid var(--neon); position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { position: fixed; bottom: 20px; display: flex; gap: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1 class="glitch-title">VOID MAFIA</h1>
    <div class="powered">Powered by ბატონი მაქსი</div>

    <div id="login-screen" class="card">
        <input type="text" id="nickname" placeholder="შეიყვანე ნიკნეიმი">
        <button class="btn" onclick="showRooms()">შესვლა</button>
    </div>

    <div id="rooms-screen" class="card hidden">
        <h3>არხები</h3>
        <input type="text" id="room-id" placeholder="ოთახის ID">
        <button class="btn" onclick="startVoid()">ოთახის შექმნა</button>
        <div id="room-list" style="margin-top: 20px;"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="video-grid"></div>
        <div class="controls">
            <button class="btn" onclick="toggleMic()">მიკროფონი</button>
            <button class="btn" onclick="toggleCam()">კამერა</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        const socket = io();
        let localStream, myNick;
        const peers = {};

        function showRooms() {
            myNick = document.getElementById('nickname').value;
            if (!myNick) return alert("ჩაწერე ნიკი");
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('rooms-screen').classList.remove('hidden');
            socket.emit('get-rooms');
        }

        async function startVoid(roomFromList) {
            const rid = roomFromList || document.getElementById('room-id').value;
            if (!rid) return alert("ჩაწერე ოთახის ID");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('rooms-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                
                addVideo('me', localStream, myNick + " (შენ)", true);
                socket.emit('join-room', rid, myNick);
            } catch (e) { alert("კამერა ვერ ჩაირთო!"); }
        }

        socket.on('update-room-list', rooms => {
            const list = document.getElementById('room-list');
            list.innerHTML = rooms.map(r => `<button class="btn" style="margin-bottom:5px" onclick="startVoid('${r.code}')">შეუერთდი: ${r.code} (${r.playerCount})</button>`).join('');
        });

        socket.on('all-users', users => {
            users.forEach(id => {
                const peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                peer.on('signal', signal => socket.emit('sending-signal', { userToSignal: id, callerID: socket.id, signal }));
                peer.on('stream', stream => addVideo(id, stream, "ოპერატორი"));
                peers[id] = peer;
            });
        });

        socket.on('user-joined', p => {
            const peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
            peer.on('signal', signal => socket.emit('returning-signal', { signal, callerID: p.callerID }));
            peer.on('stream', stream => addVideo(p.callerID, stream, "ოპერატორი"));
            peer.signal(p.signal);
            peers[p.callerID] = peer;
        });

        socket.on('receiving-returned-signal', p => peers[p.id].signal(p.signal));
        
        socket.on('user-left', id => {
            if(peers[id]) peers[id].destroy();
            document.getElementById(id)?.remove();
        });

        function addVideo(id, stream, name, mute = false) {
            if (document.getElementById(id)) return;
            const div = document.createElement('div');
            div.id = id; div.className = 'video-box';
            div.innerHTML = `<video id="v-${id}" autoplay playsinline ${mute?'muted':''}></video><div style="position:absolute;bottom:5px;width:100%;text-align:center;font-size:12px">${name}</div>`;
            document.getElementById('video-grid').appendChild(div);
            document.getElementById(`v-${id}`).srcObject = stream;
        }

        function toggleMic() { localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; }
        function toggleCam() { localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled; }
    </script>
</body>
</html>
