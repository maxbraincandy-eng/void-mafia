<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>VOID MAFIA v10</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="toast"></div>

  <section id="authScreen" class="screen auth-screen">
    <div class="auth-card">
      <div class="logo-mark">◈</div>
      <h1>VOID MAFIA</h1>
      <p>პროფილის შექმნა / სწრაფი შესვლა</p>
      <input id="nickInput" placeholder="ნიკნეიმი">
      <div class="avatar-grid" id="avatarGrid"></div>
      <button id="guestBtn" class="primary">სწრაფი შესვლა</button>
    </div>
  </section>

  <section id="lobbyScreen" class="screen hidden">
    <header class="app-top">
      <button id="drawerBtn" class="icon-btn">☰</button>
      <div>
        <h2>მაგიდები</h2>
        <p id="meLine">Ready</p>
      </div>
      <button id="refreshRoomsBtn" class="icon-btn">↻</button>
    </header>

    <main class="lobby-content">
      <div class="tools">
        <input id="searchRooms" placeholder="ძებნა: კოდი, ჰოსტი, მაგიდა">
        <button id="sortRoomsBtn">LIVE</button>
      </div>

      <div class="create-card">
        <h3>ახალი მაგიდა</h3>
        <input id="roomNameInput" placeholder="მაგიდის სახელი">
        <div class="grid2">
          <label>მოთამაშეები <input id="maxPlayersInput" type="number" value="10" min="4" max="16"></label>
          <label>მაფია <input id="mafiaCountInput" type="number" value="1" min="1" max="6"></label>
        </div>
        <button id="createRoomBtn" class="primary">მაგიდის შექმნა</button>
      </div>

      <h3 class="section-title">ლაივ მაგიდები</h3>
      <div id="roomsList" class="rooms-list"></div>
    </main>

    <nav class="bottom-nav">
      <button data-tab="rooms" class="active">მაგიდები</button>
      <button data-tab="clans">კლანები</button>
      <button data-tab="stats">სტატისტიკა</button>
      <button data-tab="profile">პროფილი</button>
    </nav>
  </section>

  <section id="gameScreen" class="screen hidden">
    <header class="game-hud">
      <button id="leaveBtn" class="exit-btn">×</button>
      <div class="hud-item"><b id="phaseLabel">მოლოდინი</b><span id="dayLabel">დღე 0</span></div>
      <div class="hud-item"><b id="timerLabel">00:00</b><span>დრო</span></div>
      <div class="hud-item"><b id="aliveLabel">0</b><span>ცოცხალი</span></div>
      <button id="settingsBtn" class="room-btn">ROOM</button>
    </header>

    <div id="phaseBanner" class="phase-banner hidden">
      <h2 id="phaseBannerTitle"></h2>
      <p id="phaseBannerText"></p>
    </div>

    <div id="videoGrid" class="video-grid"></div>

    <button id="chatFab" class="chat-fab">CHAT</button>
    <button id="logFab" class="log-fab">LOG</button>

    <aside id="chatPanel" class="side-panel hidden">
      <div class="panel-head"><b>მოთამაშეების ჩათი</b><button data-close="chatPanel">×</button></div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-row"><input id="chatInput" placeholder="მესიჯი"><button id="sendChatBtn">➤</button></div>
    </aside>

    <aside id="logPanel" class="side-panel hidden">
      <div class="panel-head"><b>თამაშის ჩანაწერი</b><button data-close="logPanel">×</button></div>
      <div id="eventLog" class="event-log"></div>
    </aside>

    <div id="actionModal" class="modal hidden">
      <div class="modal-card">
        <button id="closeActionModal" class="modal-x">×</button>
        <h2 id="actionTitle">ქმედება</h2>
        <p id="actionHelp"></p>
        <div id="actionTargets" class="target-list"></div>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-card wide">
        <button id="closeSettings" class="modal-x">×</button>
        <h2>Room Settings</h2>
        <div class="settings-section">
          <h3>Game Flow</h3>
          <div class="grid2">
            <button id="startGameBtn" class="primary">START</button>
            <button id="forceNightBtn">TO NIGHT</button>
          </div>
        </div>
        <div class="settings-section">
          <h3>Timers</h3>
          <div class="grid2">
            <label>საერთო <input id="tCommon" type="number" value="60"></label>
            <label>თითო მოთამაშე <input id="tIndividual" type="number" value="60"></label>
            <label>დასახელება <input id="tNomination" type="number" value="45"></label>
            <label>ხმა <input id="tVote" type="number" value="35"></label>
            <label>ბოლო სიტყვა <input id="tLastWords" type="number" value="45"></label>
            <label>ღამე <input id="tNight" type="number" value="45"></label>
          </div>
          <button id="saveTimersBtn" class="primary">SAVE TIMERS</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
