name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build both committed production bundles on the runner before uploading.
    # Railway's Nixpacks build phase is intentionally a no-op: it serves the
    # pre-built server/dist and client/dist. A source-only change must therefore
    # never be uploaded with stale dist artifacts.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server and client bundles
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy server
        run: ./.github/scripts/railway-up.sh 226d60e0-8aee-42f4-83b3-2151ee30dced server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 08c2a0d2-1c54-4c07-8497-8130c7baa696

      - name: Deploy client
        run: ./.github/scripts/railway-up.sh 958a7cd3-adc4-49ad-a955-27c6df5794d8 client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 08c2a0d2-1c54-4c07-8497-8130c7baa696

      - name: Verify the live build matches this commit
        id: verify
        continue-on-error: true
        run: |
          EXPECTED=$(grep -oE "2026-[0-9]{2}-[0-9]{2}-v[0-9]+" server/src/index.ts | head -1)
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          ./.github/scripts/wait-for-build.sh "$EXPECTED" 15

      - name: Upload again if the build did not land
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::warning::the upload did not become live — retrying once"
          ./.github/scripts/railway-up.sh 226d60e0-8aee-42f4-83b3-2151ee30dced server
          ./.github/scripts/railway-up.sh 958a7cd3-adc4-49ad-a955-27c6df5794d8 client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 08c2a0d2-1c54-4c07-8497-8130c7baa696

      - name: Confirm the live build
        run: |
          ./.github/scripts/wait-for-build.sh "${{ steps.verify.outputs.expected }}" 20 || {
            echo "::error::The deploy did not land. Check Railway service Watch Paths and deployment logs."
            exit 1
          }
